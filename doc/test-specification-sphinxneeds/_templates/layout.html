{% extends "!layout.html" %}
{% block menu %}
  {{ super() }}
  {% if reference_links %}
  <div class="toctree-wrapper compound">
    <p class="caption"><span class="caption-text">Documents</span></p>
    <ul>
      {% for title, url in reference_links.items() %}
      <li class="toctree-l1">
        <a class="reference external" href="{{ url }}">{{ title }}</a>
      </li>
      {% endfor %}
    </ul>
  </div>
  {% endif %}
{% endblock %}
