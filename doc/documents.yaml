# Central document registry for the Zephyr safety docset.
#
# Read by zdocs: `add_docs_from_registry()` creates every build target from it,
# and each document's conf.py shim derives its cross-document links from it via
# docrefs.load(). One declaration per document — build targets, intersphinx
# mappings, Doxygen TAGFILES, navigation and needs imports all come from here.
#
# Schema: tools/zdocs/doc/manual/reference/registry-schema.rst
#
# NAMING TRAP: a group id must never equal a document id of the same builder.
# add_docs_from_registry names its per-(group, builder) aggregates
# "<group>-<builder>", which would collide with that document's own
# "<doc>-<builder>" target at configure time. Hence group ids like
# `specification` rather than `requirements`.

base_url: "http://localhost:8000/"

# Every `kind: doxygen` document generates XML into deploy/xml/<id>/.
# Required by the `testmodule` directive, which parses it.
doxygen_xml: true

# The page doc-check scans for cross-references that rendered as plain text or
# as nothing at all. WITHOUT THIS KEY doc-check prints
# "OK (deploy tree, no xref_smoketest configured)" and skips its primary check —
# a green gate that checked nothing. The test report is the document with the
# most inbound channels (intersphinx, doxylink, external needs), so its smoke
# page is the canonical one.
xref_smoketest: "html/test-report/xref-test.html"

# doc-check findings let through on purpose. Exact text, never a pattern; each
# one names its deferred issue (claude/traceability-reconciliation/issues/).
doc_check_accepted:
  - finding: "html/dox-zephyr/structbt__conn__oob__info.html: dead link -> structbt__conn__oob__info_1_1_0d130100253371055064164065265224242172250032310014_1_1_0d137243212029c6f55ad3b31a092abf1483a434744.html"
    reason: "issue 002: Doxygen links nested anonymous struct pages it never generates (full upstream API, outside the safety scope)"

groups:
  - id: specification
    title: "Specification"
    display: "disabled_collapsing"

  - id: verification
    title: "Verification"
    display: "disabled_collapsing"

  - id: reference
    title: "Reference"
    display: "disabled_collapsing"

  - id: governance
    title: "Governance"
    mode: "always_keep"     # single-document group: see sandbox note below
    display: "disabled_collapsing"

  - id: internal
    title: "Internal"
    # Build machinery with no reader of its own. Never shown in navigation; its
    # documents still build, publish and cross-link.
    display: "no-display"

  - id: sandbox
    title: "Sandbox"
    # Superseded hand-crafted documents and tooling experiments, retained for
    # reference. Collapsed so they stay out of the way of the audit-facing set.
    display: "collapsed_at_opening"

documents:

  # -- Specification ----------------------------------------------------------

  requirements:
    title: "Requirements"
    kind: sphinx
    group: specification
    prefix: req
    doc_dir: sdoc/requirements
    builders: [html, latex]
    # One `.. req::` need per StrictDoc requirement, generated by Zephyr's
    # gen_requirements.py (see doc/CMakeLists.txt); ids are the StrictDoc UIDs,
    # uppercase as authored (ZEP-SRS-20-6).
    needs:
      source: json

  architecture:
    title: "Architecture"
    kind: sphinx
    group: specification
    prefix: arch
    # One `design` need per `.. design::` block in Zephyr's doc/kernel,
    # generated by _scripts/design_gen.py (see doc/CMakeLists.txt); published
    # so a requirement lists its design elements ("fulfilled by").
    needs:
      source: json
    # One `impl` need per kernel-internal symbol carrying a Doxygen \satisfies
    # (detailed-design-symbols.rst), read from the Detailed Design's XML: the
    # implementation below the Safety API, beside the design it realises.
    symbol_needs:
      doxygen_source: dox-zephyr-safety-detailed-design
    builders: [html, latex]

  # -- Verification -----------------------------------------------------------

  # The sphinx-needs test spec and report are the documents that matter going
  # forward; the hand-crafted pair they replaced lives on under sandbox/.

  test-specification:
    title: "Test Specification"
    kind: sphinx
    group: verification
    prefix: testspec
    builders: [html]
    needs:
      source: json
    testmodule:
      doxygen_source: dox-zephyr-safety-testspec
      api_reference: dox-zephyr-safety-api

  test-report:
    title: "Test Report"
    kind: sphinx
    group: verification
    prefix: testreport
    builders: [html]
    needs:
      source: json
    testmodule:
      # Replaces the hand-written
      #   add_dependencies(test-report-html test-specification-html)
      # in the old CMakeLists, and fixes Phase 0 defect B2: the report used to
      # correlate against needs_external_needs[0], which was `requirements`.
      spec: test-specification

  # -- Reference --------------------------------------------------------------

  api-documentation:
    title: "API Documentation"
    kind: sphinx
    group: reference
    prefix: api
    builders: [html, html-live, latex]
    # One `impl` need per API symbol carrying a Doxygen \satisfies (the
    # `symbolneeds` directive, satisfied-requirements.rst), read from the Safety
    # API's XML. `source: json` publishes them, so every peer imports them and
    # a requirement lists its implementing symbols ("satisfied by") next to its
    # verifying test cases.
    needs:
      source: json
    symbol_needs:
      doxygen_source: dox-zephyr-safety-api

  # A doxygen document's id is taken verbatim as its target name and deploy
  # path — the `dox-` prefix is ours, not the engine's. The sources live under
  # dox/, hence the doc_dir on each.
  # The full upstream Zephyr API, kept as a stand-alone reference. It is not a
  # link peer (crossref: false): it documents a superset of the safety-scoped
  # Doxygen projects' symbols, and importing each other's tag files made each
  # side defer the shared symbols to the other, so neither generated their
  # pages. The safety documents link within the safety scope only.
  dox-zephyr:
    title: "Kernel API (Doxygen)"
    kind: doxygen
    group: reference
    prefix: dox_zephyr
    doc_dir: dox/zephyr
    crossref: false

  dox-zephyr-safety-api:
    title: "Safety API (Doxygen)"
    kind: doxygen
    group: reference
    prefix: dox_api
    doc_dir: dox/zephyr-safety-api

  dox-zephyr-safety-detailed-design:
    title: "Detailed Design (Doxygen)"
    kind: doxygen
    group: reference
    prefix: dox_design
    doc_dir: dox/zephyr-safety-detailed-design

  dox-zephyr-safety-testspec:
    title: "Test Specification (Doxygen)"
    kind: doxygen
    group: reference
    prefix: dox_testspec
    doc_dir: dox/zephyr-safety-testspec

  # The requirements as Doxygen `\requirement` blocks. Its tag file is what
  # makes `\verifies` / `\satisfies` resolve in the other Doxygen documents —
  # and warn on a UID that does not exist. Not a deliverable: the requirements
  # document is the one people read.
  dox-requirements:
    title: "Requirements (Doxygen)"
    kind: doxygen
    group: internal
    prefix: dox_req
    doc_dir: dox/requirements

  # -- Governance -------------------------------------------------------------

  safety-committee:
    title: "Safety Committee"
    kind: sphinx
    group: governance
    prefix: committee
    doc_dir: sdoc/safety-committee
    builders: [html, latex]

  # -- Sandbox ----------------------------------------------------------------
  #
  # Sources under sandbox/; the ids keep their sandbox- prefix, so target names
  # and deploy paths stay unique next to the real test documents.

  sandbox-test-specification:
    title: "Test Specification (hand-crafted)"
    kind: sphinx
    group: sandbox
    prefix: sb_testspec
    doc_dir: sandbox/test-specification
    builders: [html]

  sandbox-test-report:
    title: "Test Report (hand-crafted)"
    kind: sphinx
    group: sandbox
    prefix: sb_testreport
    doc_dir: sandbox/test-report
    builders: [html]

  sandbox-mlx:
    title: "Sandbox: mlx.traceability"
    kind: sphinx
    group: sandbox
    prefix: sb_mlx
    doc_dir: sandbox/mlx
    builders: [html]

  sandbox-sphinx-needs:
    title: "Sandbox: sphinx-needs"
    kind: sphinx
    group: sandbox
    prefix: sb_needs
    doc_dir: sandbox/sphinx-needs
    builders: [html]
