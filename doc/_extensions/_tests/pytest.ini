# The tests of the local extensions in doc/_extensions. Run from any
# directory:  pytest doc/_extensions/_tests
# The sphinx.testing plugin gives the fixtures app, make_app and warning.
[pytest]
addopts = -p sphinx.testing.fixtures -p no:cacheprovider
testpaths = .
