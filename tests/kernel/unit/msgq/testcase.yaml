# One scenario per configuration axis that changes the code of
# kernel/msg_q.c:
# - the #ifdef blocks: POLL, USERSPACE, OBJ_CORE_MSGQ;
# - CONFIG_MP_MAX_NUM_CPUS: with more than one CPU, LOCK_SCHED_SPINLOCK
#   (kernel/include/kspinlock.h) locks the scheduler spinlock around the
#   hand-over to a waiting thread. With one CPU, the macro is empty;
# - the CHECKIF() variants of z_msgq_cleanup(): RUNTIME_ERROR_CHECKS by
#   default, NO_RUNTIME_CHECKS, ASSERT_ON_ERRORS;
# - CONFIG_ASSERT: the __ASSERT() checks of msg_q.c (buffer size, ISR wait,
#   write pointer).
#
# CONFIG_OBJ_CORE enables CONFIG_OBJ_CORE_MSGQ by default. The scenario
# sets it explicitly.
#
# A scenario with CONFIG_ASSERT also sets CONFIG_ASSERT_TEST. Without it,
# __ASSERT() ends in CODE_UNREACHABLE after the hook assert_post_action().
# The hook is a fake that returns, so the unit continues into undefined
# behavior. With CONFIG_ASSERT_TEST, the unit continues after the hook.

common:
  type: unit
  tags:
    - kernel
    - kernel_unit
tests:
  kernel.unit.msgq: {}
  kernel.unit.msgq.poll:
    extra_configs:
      - CONFIG_POLL=y
  kernel.unit.msgq.obj_core:
    extra_configs:
      - CONFIG_OBJ_CORE=y
      - CONFIG_OBJ_CORE_MSGQ=y
  kernel.unit.msgq.userspace:
    extra_configs:
      - CONFIG_KERNEL_UNIT_USERSPACE=y
      - CONFIG_MPU=y
      - CONFIG_USERSPACE=y
  kernel.unit.msgq.multi_cpu:
    extra_configs:
      - CONFIG_MP_MAX_NUM_CPUS=2
  kernel.unit.msgq.no_runtime_checks:
    extra_configs:
      - CONFIG_NO_RUNTIME_CHECKS=y
  kernel.unit.msgq.assert:
    extra_configs:
      - CONFIG_ASSERT=y
      - CONFIG_ASSERT_TEST=y
  kernel.unit.msgq.assert_on_errors:
    extra_configs:
      - CONFIG_ASSERT=y
      - CONFIG_ASSERT_TEST=y
      - CONFIG_ASSERT_ON_ERRORS=y
  kernel.unit.msgq.all:
    extra_configs:
      - CONFIG_POLL=y
      - CONFIG_OBJ_CORE=y
      - CONFIG_OBJ_CORE_MSGQ=y
      - CONFIG_KERNEL_UNIT_USERSPACE=y
      - CONFIG_MPU=y
      - CONFIG_USERSPACE=y
      - CONFIG_MP_MAX_NUM_CPUS=2
      - CONFIG_ASSERT=y
      - CONFIG_ASSERT_TEST=y
