# One scenario per configuration axis that changes the code of
# kernel/mem_slab.c:
# - the #ifdef blocks: OBJ_CORE_MEM_SLAB, OBJ_CORE_STATS_MEM_SLAB,
#   MEM_SLAB_TRACE_MAX_UTILIZATION;
# - the IS_ENABLED() checks: MEM_SLAB_POINTER_VALIDATE (default y with
#   ASSERT), MULTITHREADING;
# - the CHECKIF() variants of create_free_list(): RUNTIME_ERROR_CHECKS by
#   default, NO_RUNTIME_CHECKS, ASSERT_ON_ERRORS;
# - the __ASSERT() checks (ASSERT).
#
# CONFIG_OBJ_CORE enables CONFIG_OBJ_CORE_MEM_SLAB by default. With
# CONFIG_OBJ_CORE_STATS, CONFIG_OBJ_CORE_STATS_MEM_SLAB is also enabled by
# default. The obj_core scenario has no statistics and no maximum trace.
# The stats scenario has statistics without the maximum trace, and "all"
# has both. Thus each #ifdef branch of k_mem_slab_stats_query() and
# k_mem_slab_stats_reset() is in one scenario.
#
# A scenario with CONFIG_ASSERT also sets CONFIG_ASSERT_TEST. Without it,
# __ASSERT() ends in CODE_UNREACHABLE after the hook assert_post_action().
# The hook is a fake that returns, so the unit continues into undefined
# behavior. With CONFIG_ASSERT_TEST, the unit continues after the hook.

common:
  type: unit
  tags:
    - kernel
    - kernel_unit
tests:
  kernel.unit.mem_slab: {}
  kernel.unit.mem_slab.pointer_validate:
    extra_configs:
      - CONFIG_MEM_SLAB_POINTER_VALIDATE=y
  kernel.unit.mem_slab.trace_max:
    extra_configs:
      - CONFIG_MEM_SLAB_TRACE_MAX_UTILIZATION=y
  kernel.unit.mem_slab.obj_core:
    extra_configs:
      - CONFIG_OBJ_CORE=y
      - CONFIG_OBJ_CORE_MEM_SLAB=y
  kernel.unit.mem_slab.obj_core_stats:
    extra_configs:
      - CONFIG_OBJ_CORE=y
      - CONFIG_OBJ_CORE_MEM_SLAB=y
      - CONFIG_OBJ_CORE_STATS=y
      - CONFIG_OBJ_CORE_STATS_MEM_SLAB=y
  kernel.unit.mem_slab.single_thread:
    extra_configs:
      - CONFIG_KERNEL_UNIT_MEM_SLAB_SINGLE_THREAD=y
      - CONFIG_MULTITHREADING=n
  kernel.unit.mem_slab.no_runtime_checks:
    extra_configs:
      - CONFIG_NO_RUNTIME_CHECKS=y
  kernel.unit.mem_slab.assert_on_errors:
    extra_configs:
      - CONFIG_ASSERT=y
      - CONFIG_ASSERT_TEST=y
      - CONFIG_ASSERT_ON_ERRORS=y
  kernel.unit.mem_slab.all:
    extra_configs:
      - CONFIG_MEM_SLAB_TRACE_MAX_UTILIZATION=y
      - CONFIG_OBJ_CORE=y
      - CONFIG_OBJ_CORE_MEM_SLAB=y
      - CONFIG_OBJ_CORE_STATS=y
      - CONFIG_OBJ_CORE_STATS_MEM_SLAB=y
      - CONFIG_KERNEL_UNIT_USERSPACE=y
      - CONFIG_MPU=y
      - CONFIG_USERSPACE=y
      - CONFIG_ASSERT=y
      - CONFIG_ASSERT_TEST=y
