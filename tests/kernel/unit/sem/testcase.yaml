# One scenario per configuration axis that changes the code of
# kernel/sem.c: the #ifdef blocks (POLL, OBJ_CORE_SEM, USERSPACE) and the
# CHECKIF() variants (RUNTIME_ERROR_CHECKS by default, NO_RUNTIME_CHECKS,
# ASSERT_ON_ERRORS).
#
# A scenario with CONFIG_ASSERT also sets CONFIG_ASSERT_TEST. Without it,
# __ASSERT() ends in CODE_UNREACHABLE after the hook assert_post_action().
# The hook is a fake that returns, so the unit continues into undefined
# behavior. With CONFIG_ASSERT_TEST, the unit continues after the hook.

common:
  type: unit
  tags:
    - kernel
    - kernel_unit
tests:
  kernel.unit.sem: {}
  kernel.unit.sem.poll:
    extra_configs:
      - CONFIG_POLL=y
  kernel.unit.sem.obj_core:
    extra_configs:
      - CONFIG_OBJ_CORE=y
      - CONFIG_OBJ_CORE_SEM=y
  kernel.unit.sem.userspace:
    extra_configs:
      - CONFIG_KERNEL_UNIT_USERSPACE=y
      - CONFIG_MPU=y
      - CONFIG_USERSPACE=y
  kernel.unit.sem.no_runtime_checks:
    extra_configs:
      - CONFIG_NO_RUNTIME_CHECKS=y
  kernel.unit.sem.assert_on_errors:
    extra_configs:
      - CONFIG_ASSERT=y
      - CONFIG_ASSERT_TEST=y
      - CONFIG_ASSERT_ON_ERRORS=y
  # The trace scenarios: the default configuration, CONFIG_POLL and
  # CONFIG_NO_RUNTIME_CHECKS with the trace hook (CONFIG_KERNEL_UNIT_TRACE).
  # spec/tla/tools/check_traces.py checks the traces against KSem.
  kernel.unit.sem.trace:
    extra_configs:
      - CONFIG_KERNEL_UNIT_TRACE=y
  kernel.unit.sem.trace_poll:
    extra_configs:
      - CONFIG_KERNEL_UNIT_TRACE=y
      - CONFIG_POLL=y
  kernel.unit.sem.trace_no_runtime_checks:
    extra_configs:
      - CONFIG_KERNEL_UNIT_TRACE=y
      - CONFIG_NO_RUNTIME_CHECKS=y
  kernel.unit.sem.all:
    extra_configs:
      - CONFIG_POLL=y
      - CONFIG_OBJ_CORE=y
      - CONFIG_OBJ_CORE_SEM=y
      - CONFIG_KERNEL_UNIT_USERSPACE=y
      - CONFIG_MPU=y
      - CONFIG_USERSPACE=y
      - CONFIG_ASSERT=y
      - CONFIG_ASSERT_TEST=y
