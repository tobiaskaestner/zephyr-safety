# Needs a wire from the stimulus pin to the response pin (see the board
# overlay). Without the wire, the static check fails.

common:
  tags:
    - benchmark
    - latency
  platform_allow:
    - nucleo_g474re
    # Build only: these ports never ran on hardware (boards.yaml).
    - nrf52840dk/nrf52840
    - nrf54l15dk/nrf54l15/cpuapp
    - mimxrt1060_evk@C/mimxrt1062/qspi
  harness: console
  harness_config:
    type: one_line
    regex:
      - "RESULT: OK"
tests:
  benchmark.latency.loopback_check: {}
  benchmark.latency.loopback_check.use_switch:
    extra_configs:
      - CONFIG_USE_SWITCH=y
