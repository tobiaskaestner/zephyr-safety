CONFIG_ZTEST=y
CONFIG_PRINTK=y
# The print tests capture printk() through the printk hook. With LOG,
# printk() goes to the log backend and not to the hook. The benchmark apps
# do not use LOG either. TEST_LOGGING_DEFAULTS selects LOG.
CONFIG_TEST_LOGGING_DEFAULTS=n
CONFIG_LOG=n
