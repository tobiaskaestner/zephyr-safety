CONFIG_GPIO=y
CONFIG_PRINTK=y

# Set the debug options explicitly, because the two Zephyr trees have
# different defaults (WP2 finding 5).
CONFIG_ASSERT=n
CONFIG_SPIN_VALIDATE=n

# The main thread only waits for the end of the run. It must not compete
# with the woken thread.
CONFIG_MAIN_THREAD_PRIORITY=10
