# Build check only. Data points come from scripts/run.py.

common:
  tags:
    - benchmark
    - latency
  platform_allow:
    - nucleo_g474re
    # Build only: these ports never ran on hardware (boards.yaml).
    - nrf52840dk/nrf52840
    - nrf54l15dk/nrf54l15/cpuapp
    - mimxrt1060_evk@C/mimxrt1062/qspi
  build_only: true
tests:
  benchmark.latency.wake.sem: {}
  benchmark.latency.wake.sem.direct:
    extra_configs:
      - CONFIG_LATBENCH_WAKE_ISR_DIRECT=y
  benchmark.latency.wake.event:
    extra_configs:
      - CONFIG_LATBENCH_WAKE_EVENT=y
  benchmark.latency.wake.msgq:
    extra_configs:
      - CONFIG_LATBENCH_WAKE_MSGQ=y
  benchmark.latency.wake.fifo:
    extra_configs:
      - CONFIG_LATBENCH_WAKE_FIFO=y
  benchmark.latency.wake.poll:
    extra_configs:
      - CONFIG_LATBENCH_WAKE_POLL=y
