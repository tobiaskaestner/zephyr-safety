# Timeout queue backends with 256 periodic load timers (the t256-default
# point of wake-timers-1m is the DLIST point). M1 and M2 through
# wake_latency (sem, wrapped ISR). SKIPLIST is only in ws-up, see
# timeout-skiplist-1m.

name: timeout-backends-1m
app: wake_latency
trees: [ws-safety, ws-up]
repeat: 1
timeout: 1200

common:
  kconfig:
    LATBENCH_SAMPLES: 1000000
    LATBENCH_WAKE_SEM: y
    LATBENCH_HIST_BINS: 2048
    LATBENCH_HIST_COARSE_BINS: 2048
    LATBENCH_LOAD_TIMERS: 256

axes:
  backend:
    minheap:
      kconfig: {TIMEOUT_BACKEND_MINHEAP: y, TIMEOUT_HEAP_MAX_ENTRIES: 320}
    wheel:
      kconfig: {TIMEOUT_BACKEND_WHEEL: y}
    bucket:
      kconfig: {TIMEOUT_BACKEND_BUCKET: y}
