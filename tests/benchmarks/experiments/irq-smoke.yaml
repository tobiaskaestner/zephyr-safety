# First check of the IRQ latency method: the four interrupt paths with
# board defaults and an idle CPU, plus the direct path with a busy CPU
# (does the WFI wake-up explain the second mode?).

name: irq-smoke
app: irq_latency
trees: [ws-safety]
repeat: 1
timeout: 400

points:
  - id: stock-idle
    kconfig: {LATBENCH_IRQ_PATH_STOCK: y}
  - id: wrapped-idle
    kconfig: {LATBENCH_IRQ_PATH_WRAPPED: y}
    dtc_overlays: [irq_latency/exti_line0_app.overlay]
  - id: direct-idle
    kconfig: {LATBENCH_IRQ_PATH_DIRECT: y}
    dtc_overlays: [irq_latency/exti_line0_app.overlay]
  - id: zli-idle
    kconfig: {LATBENCH_IRQ_PATH_ZLI: y}
    dtc_overlays: [irq_latency/exti_line0_app.overlay]
  - id: direct-busy
    kconfig: {LATBENCH_IRQ_PATH_DIRECT: y, LATBENCH_BG_BUSY: y}
    dtc_overlays: [irq_latency/exti_line0_app.overlay]
