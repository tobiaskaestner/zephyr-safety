# Build check only. Data points come from scripts/benchmarks/run.py with an
# experiment file, which pins the trees (see ../README.md).

common:
  tags:
    - benchmark
    - latency
  platform_allow:
    - nucleo_g474re
    # Build only: these ports never ran on hardware (boards.yaml).
    - nrf52840dk/nrf52840
    - nrf54l15dk/nrf54l15/cpuapp
    - mimxrt1060_evk@C/mimxrt1062/qspi
  build_only: true
tests:
  benchmark.latency.irq.stock:
    extra_configs:
      - CONFIG_LATBENCH_IRQ_PATH_STOCK=y
  benchmark.latency.irq.wrapped:
    # A cmake argument, not a Kconfig fragment: CMakeLists.txt needs the
    # path to select the overlay of the board port.
    extra_args: CONFIG_LATBENCH_IRQ_PATH_WRAPPED=y
  benchmark.latency.irq.direct:
    # A cmake argument, not a Kconfig fragment: CMakeLists.txt needs the
    # path to select the overlay of the board port.
    extra_args: CONFIG_LATBENCH_IRQ_PATH_DIRECT=y
  benchmark.latency.irq.zli:
    # A cmake argument, not a Kconfig fragment: CMakeLists.txt needs the
    # path to select the overlay of the board port.
    extra_args: CONFIG_LATBENCH_IRQ_PATH_ZLI=y
  benchmark.latency.irq.direct.swtrig:
    extra_args: CONFIG_LATBENCH_IRQ_PATH_DIRECT=y
    extra_configs:
      - CONFIG_LATBENCH_SWTRIG=y
    platform_allow:
      - nucleo_g474re
  benchmark.latency.irq.direct.tail:
    extra_args: CONFIG_LATBENCH_IRQ_PATH_DIRECT=y
    extra_configs:
      - CONFIG_LATBENCH_SWTRIG=y
      - CONFIG_LATBENCH_TAIL=y
    platform_allow:
      - nucleo_g474re
  benchmark.latency.irq.direct.unlock:
    extra_args: CONFIG_LATBENCH_IRQ_PATH_DIRECT=y
    extra_configs:
      - CONFIG_LATBENCH_IRQ_SCEN_UNLOCK=y
    platform_allow:
      - nucleo_g474re
  benchmark.latency.irq.direct.nested:
    extra_args: CONFIG_LATBENCH_IRQ_PATH_DIRECT=y
    extra_configs:
      - CONFIG_LATBENCH_IRQ_SCEN_NESTED=y
    platform_allow:
      - nucleo_g474re
  benchmark.latency.irq.direct.exit:
    extra_args: CONFIG_LATBENCH_IRQ_PATH_DIRECT=y
    extra_configs:
      - CONFIG_LATBENCH_IRQ_SCEN_EXIT=y
    platform_allow:
      - nucleo_g474re
  benchmark.latency.irq.direct.burst:
    extra_args: CONFIG_LATBENCH_IRQ_PATH_DIRECT=y
    extra_configs:
      - CONFIG_LATBENCH_IRQ_SCEN_BURST=y
    platform_allow:
      - nucleo_g474re
