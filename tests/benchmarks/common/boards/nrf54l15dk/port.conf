# nrfx_gppi allocates the DPPI channels and the PPIB bridge channel from
# the TIMER00 compare event (MCU domain) to the GPIOTE20 SET task
# (PERI domain).
CONFIG_NRFX_GPPI=y

# The tick rate stays at the SoC default: 31250 ticks/s on the GRTC
# (1 MHz), so a tick is 32 system timer cycles (32 us) and the tick phase
# has 32 steps of 1 us (128 core cycles).
