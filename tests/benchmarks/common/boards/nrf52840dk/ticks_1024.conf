# Optional fragment for the tick phase on nrf52840dk. An experiment adds
# it with conf_files: [common/boards/nrf52840dk/ticks_1024.conf].
#
# The default tick (32768 ticks/s) is 1 RTC cycle, so the tick phase is
# always 0. With 1024 ticks/s, a tick is 32 RTC cycles (977 us) and the
# phase has 32 steps of 30.5 us. The tick period must be a power of two
# in RTC cycles (stim.c reads a 32-bit cycle count on this board).
# This changes the kernel: timeouts round to 977 us instead of 30.5 us.
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1024
