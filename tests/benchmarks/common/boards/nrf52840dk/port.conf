# nrfx_gppi allocates the PPI channel from the TIMER compare event to the
# GPIOTE SET task.
CONFIG_NRFX_GPPI=y

# The tick rate stays at the SoC default (32768 ticks/s). The system timer
# (RTC1) counts at 32768 Hz, so a tick is 1 system timer cycle and the tick
# phase is always 0. For a phase histogram, add ticks_1024.conf (see
# there).
