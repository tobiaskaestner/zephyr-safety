# Boards for the latency benchmarks. scripts/run.py reads this file.
#
# For each board target:
#   port      folder of the board port in common/boards/ (C code, overlays)
#   modules   repos of the tree (trees.yaml) that the build needs; the
#             build gets exactly these as ZEPHYR_MODULES
#   flash     commands that program the board and reset it; run in order.
#             {zephyr} is the Zephyr tree, {elf} and {hex} are the images,
#             {probe} is the probe id from the hardware map of the host.
#   status    tested: data points exist; untested: builds only
#
# An experiment selects a board with "board:"; without it, run.py uses
# "default". The probe and the console of a board are host data: they are
# in the hardware map of the host (hw-map.yml, twister format, not checked
# in; see scripts/hwmap.py).

default: nucleo_g474re

boards:
  nucleo_g474re:
    port: nucleo_g474re
    modules: [cmsis_6, hal_stm32]
    flash:
      - [openocd, -f, "{zephyr}/boards/st/nucleo_g474re/support/openocd.cfg",
         -c, "adapter serial {probe}", -c, "program {elf} verify reset exit"]
    status: tested

  # Wire D2 (P1.03) -> A3 (P0.29), as on nucleo_g474re. The flash
  # commands are not tested yet.
  nrf52840dk/nrf52840:
    port: nrf52840dk
    modules: [cmsis_6, hal_nordic]
    flash:
      - [nrfutil, device, program, --serial-number, "{probe}", --firmware, "{hex}",
         --options, chip_erase_mode=ERASE_RANGES_TOUCHED_BY_FIRMWARE]
      - [nrfutil, device, reset, --serial-number, "{probe}"]
    status: untested

  # No Arduino header: wire P1.11 -> P1.12 on the "PORT P1" header. The
  # console (uart20) is on the second VCOM of the DK (interface 02 of the
  # J-Link OB). The flash commands are not tested yet.
  nrf54l15dk/nrf54l15/cpuapp:
    port: nrf54l15dk
    modules: [cmsis_6, hal_nordic]
    flash:
      - [nrfutil, device, program, --serial-number, "{probe}", --firmware, "{hex}", --x-family, nrf54l,
         --options, chip_erase_mode=ERASE_RANGES_TOUCHED_BY_FIRMWARE]
      - [nrfutil, device, reset, --serial-number, "{probe}", --x-family, nrf54l]
    status: untested

  # MIMXRT1060-EVKC. The wire is D2 - A3, as on nucleo_g474re, but A3
  # drives (GPT2 compare output) and D2 reads. The build makes no .hex,
  # so pyocd programs the .elf.
  mimxrt1060_evk@C/mimxrt1062/qspi:
    port: mimxrt1060_evk
    modules: [cmsis_6, hal_nxp]
    flash:
      - [pyocd, flash, -u, "{probe}", -t, mimxrt1060, "{elf}"]
      - [pyocd, reset, -u, "{probe}", -t, mimxrt1060]
    status: untested
