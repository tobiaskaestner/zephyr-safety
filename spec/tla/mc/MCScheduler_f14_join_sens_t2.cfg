\* Witness size check: the base with 2 threads (Threads = {t1, t2}). The
\* expected result differs from the base: the witness of F14 needs 3
\* threads (a running thread, a joiner and the aborted target;
\* tla/small-scope.md of the workspace notes, table of trigger steps). With
\* 2 threads, the target is the running thread itself (z_swap()) or an ISR
\* aborts it (the exit of the ISR is a reschedule point). Expected result:
\* pass. The check needs CHECK_DEADLOCK FALSE (as the configuration join):
\* without an object, the model stops when each thread is dead.
\*
\* The comment of the base:
\* Finding F14: k_thread_abort() of another thread makes the joiners of
\* the target ready, and halt_thread() does not reschedule. A joiner with a
\* higher priority than the preemptible current thread then does not run
\* (ZEP-SRS-2-9). No object, only the join queues; no priority change.
CONSTANTS
    t1 = t1
    t2 = t2
    t3 = t3
    o1 = o1
    o2 = o2
    j1 = j1
    j2 = j2
    j3 = j3
    i1 = i1
    c1 = c1
    c2 = c2
    NoObj = NoObj
    IdleT = IdleT
    d1 = d1
    NoD = NoD
    Threads = {t1, t2}
    MCCPUS = {c1}
    MCZPrios <- ZPriosMixed
    MCMutant = "none"
    MCIsrPends = FALSE
    MCSetPrioBy = "none"
    MCAbort = TRUE
    MCUseSwitch = TRUE
    MCOuterLock = FALSE
    MCMaxNest = 1
    MCObjs = {}
    MCExtra = FALSE
    MCJoin = TRUE
    MCInit = FALSE

SPECIFICATION Spec

INVARIANTS
    Inv_TypeOK
    Inv_PreemptibleRunsHighest

CHECK_DEADLOCK FALSE
