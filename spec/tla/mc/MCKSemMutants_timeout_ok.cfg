\* Model mutant timeout_ok (see the header of MCKSemMutants.tla). Two threads,
\* one semaphore, safety only, with the view without obs.
CONSTANTS
    t1 = t1
    t2 = t2
    t3 = t3
    s1 = s1
    s2 = s2
    i1 = i1
    c1 = c1
    NoObj = NoObj
    IdleT = IdleT
    NoD = NoD
    MCThreads <- Threads2
    MCSems <- Sems1
    MCInitArgs <- ArgsSmall
    MCUMax = 2
    MCInitPrios <- PriosTwo
    MCEnvPrios = {}
    MCRuntimeChecks = TRUE
    MCPoll = FALSE
    MCReInit = FALSE
    MCIsrWaits = FALSE
    MCMutant = "timeout_ok"

SPECIFICATION MSpec
CHECK_DEADLOCK FALSE
VIEW MViewNoObs

INVARIANTS
    Inv_TypeOK
    Inv_CountLeLimit
    Inv_NoWaitWhileAvailable
    Inv_TokenConservation

PROPERTIES
    Prop_GiveHandsOverOrCounts
    Prop_ResetWakesAll
    Prop_InitSetsFields
    Prop_InitRejectsInvalid
    Prop_GiveWakesHighest
    Prop_WaitResult
    Prop_TimeoutReturnsEagain
