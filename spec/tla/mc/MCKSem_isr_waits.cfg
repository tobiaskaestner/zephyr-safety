\* The condition of use of ZEP-SRS-5-20 broken: an ISR calls k_sem_take()
\* with a timeout. The scheduler panics (z_pend_curr()). Expected violation
\* of the detector NoPanic.
CONSTANTS
    t1 = t1
    t2 = t2
    t3 = t3
    s1 = s1
    s2 = s2
    i1 = i1
    c1 = c1
    NoObj = NoObj
    IdleT = IdleT
    NoD = NoD
    MCThreads <- Threads2
    MCSems <- Sems1
    MCInitArgs <- ArgsDefault
    MCUMax = 3
    MCInitPrios <- PriosTwo
    MCEnvPrios = {}
    MCRuntimeChecks = TRUE
    MCPoll = FALSE
    MCReInit = FALSE
    MCIsrWaits = TRUE

SPECIFICATION SafetySpec
\* All threads can end (Abort), and an ISR does not call an uninitialized
\* semaphore: the system then does nothing, which is not a deadlock.
CHECK_DEADLOCK FALSE
VIEW ViewNoObs

INVARIANTS
    Inv_TypeOK
    Inv_NoPanic
