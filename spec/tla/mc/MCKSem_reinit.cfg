\* The condition of use ReInit broken: a thread calls k_sem_init() on a
\* semaphore with waiters (finding P6-u). Expected violation of the
\* detector NoUndefined.
CONSTANTS
    t1 = t1
    t2 = t2
    t3 = t3
    s1 = s1
    s2 = s2
    i1 = i1
    c1 = c1
    NoObj = NoObj
    IdleT = IdleT
    NoD = NoD
    MCThreads <- Threads2
    MCSems <- Sems1
    MCInitArgs <- ArgsDefault
    MCUMax = 3
    MCInitPrios <- PriosTwo
    MCEnvPrios = {}
    MCRuntimeChecks = TRUE
    MCPoll = FALSE
    MCReInit = TRUE
