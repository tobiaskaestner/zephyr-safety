\* One CPU, two cooperative priorities. All invariants except
\* RunRuleHolds: k_thread_abort() of another thread breaks it (finding
\* P7-c, configuration coop_rule).
CONSTANTS
    t1 = t1
    t2 = t2
    t3 = t3
    o1 = o1
    o2 = o2
    i1 = i1
    c1 = c1
    c2 = c2
    NoObj = NoObj
    IdleT = IdleT
    d1 = d1
    NoD = NoD
    MCCPUS = {c1}
    MCZPrios <- ZPriosCoop
    MCMutant = "none"
    MCIsrPends = FALSE
    MCSetPrioBy = "any"
    MCAbort = TRUE
    MCUseSwitch = TRUE
    MCOuterLock = FALSE
    MCMaxNest = 1
    MCObjs = {o1, o2}

SPECIFICATION Spec

INVARIANTS
    Inv_TypeOK
    Inv_CurUnique
    Inv_CurIsReady
    Inv_PendingIsQueued
    Inv_ArmedArePending
    Inv_DeadIsInert
    Inv_NoPanic
    Inv_WQ_StampsNormal
    Inv_WQ_RanksDistinct
    Inv_TO_ArmedOnce
    Inv_TO_CostBounded
    Inv_RqStampsNormal
