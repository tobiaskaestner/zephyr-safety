\* CONFIG_NO_RUNTIME_CHECKS: k_sem_init() accepts a count above the limit
\* and the limit 0. Two threads. The properties that hold without the
\* runtime checks (configuration nochecks_tokens for the others).
CONSTANTS
    t1 = t1
    t2 = t2
    t3 = t3
    s1 = s1
    s2 = s2
    i1 = i1
    c1 = c1
    NoObj = NoObj
    IdleT = IdleT
    NoD = NoD
    MCThreads <- Threads2
    MCSems <- Sems1
    MCInitArgs <- ArgsDefault
    MCUMax = 3
    MCInitPrios <- PriosTwo
    MCEnvPrios = {}
    MCRuntimeChecks = FALSE
    MCPoll = FALSE
    MCReInit = FALSE
    MCIsrWaits = FALSE

SPECIFICATION SafetySpec
\* All threads can end (Abort), and an ISR does not call an uninitialized
\* semaphore: the system then does nothing, which is not a deadlock.
CHECK_DEADLOCK FALSE
VIEW ViewNoObs

INVARIANTS
    Inv_TypeOK
    Inv_ReqIsWait
    Inv_PendingIsQueued
    Inv_ArmedArePending
    Inv_DeadIsInert
    Inv_CurIsReady
    Inv_RunRuleHolds
    Inv_CountLeLimit
    Inv_NoWaitWhileAvailable
    Inv_NoPanic
    Inv_NoUndefined

PROPERTIES
    Prop_CallsHoldLock
    Prop_GiveWakesHighest
    Prop_TakeResult
    Prop_ResetWakesAll
    Prop_WaitResult
    Prop_PollSignalMeansAvailable
