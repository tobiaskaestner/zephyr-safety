\* Sensitivity set (small-scope argument, tla/small-scope.md of the
\* workspace notes): MCScheduler_join.cfg with 4 threads (Threads = {t1,
\* t2, t3, t4}). All other constants and all properties are those of the
\* base. Expected result: the result of the base (pass).
\*
\* The comment of the base:
\* Round B: k_thread_join() and the join queues (MCJoin), with the abort,
\* CONFIG_USE_SWITCH=y, no other object (with o1 the run had more than
\* 240000 states at depth 7 after two minutes, and the queue grew). The
\* invariants of the descriptive layer and the liveness properties. No
\* deadlock check: without an object the system can stop (all threads
\* dead, or each thread waits for ever in k_thread_join(K_FOREVER) of a
\* thread that waits too). Not RunRuleHolds and not
\* PreemptibleRunsHighest: an abort of another thread leaves the cache
\* different from the current thread (findings P7-c, F14, configuration
\* f14_join).
CONSTANTS
    t1 = t1
    t2 = t2
    t3 = t3
    o1 = o1
    o2 = o2
    j1 = j1
    j2 = j2
    j3 = j3
    i1 = i1
    c1 = c1
    c2 = c2
    NoObj = NoObj
    IdleT = IdleT
    d1 = d1
    NoD = NoD
    Threads = {t1, t2, t3, t4}
    JoinQ4 = j4
    MCCPUS = {c1}
    MCZPrios <- ZPriosMixed
    MCMutant = "none"
    MCIsrPends = FALSE
    MCSetPrioBy = "none"
    MCAbort = TRUE
    MCUseSwitch = TRUE
    MCOuterLock = FALSE
    MCMaxNest = 1
    MCObjs = {}
    MCExtra = FALSE
    MCJoin = TRUE
    MCInit = FALSE

SPECIFICATION Spec

CHECK_DEADLOCK FALSE

INVARIANTS
    Inv_TypeOK
    Inv_CurUnique
    Inv_CurIsReady
    Inv_PendingIsQueued
    Inv_ArmedArePending
    Inv_DeadIsInert
    Inv_NoPanic
    Inv_NoUndefined
    Inv_WQ_StampsNormal
    Inv_WQ_RanksDistinct
    Inv_TO_ArmedOnce
    Inv_TO_CostBounded
    Inv_RqStampsNormal
    Inv_P_NoPendSVWithSwitch
    Inv_P_PendingIsUnlocked

PROPERTIES
    Live_TimedWaitEnds
    Prop_NoSwitchWhileLocked
