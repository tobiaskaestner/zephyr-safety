\* lib/Timeout.tla with CONFIG_TIMEOUT_BACKEND_MINHEAP and a heap that is
\* too small for the three entries. The third insertion panics: NoPanic is
\* violated. This shows that CONFIG_TIMEOUT_HEAP_MAX_ENTRIES must be at
\* least the number of timeouts that can be armed at the same time.
CONSTANTS
    e1 = e1
    e2 = e2
    e3 = e3
    MCBackend = "MINHEAP"
    MCHeapCapacity = 2

SPECIFICATION Spec

INVARIANTS
    Inv_TypeOK
    Inv_ArmedOnce
    Inv_CostBounded
    Inv_HeapWithinCapacity
    Inv_NoPanic
