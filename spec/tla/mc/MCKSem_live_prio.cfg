\* Liveness with two priorities: a waiter with the lower priority starves
\* while the gives go to the waiter with the higher priority. Expected
\* violation of WaiterServedIfGives.
CONSTANTS
    t1 = t1
    t2 = t2
    t3 = t3
    s1 = s1
    s2 = s2
    i1 = i1
    c1 = c1
    NoObj = NoObj
    IdleT = IdleT
    NoD = NoD
    MCThreads <- Threads2
    MCSems <- Sems1
    MCInitArgs <- ArgsSmall
    MCUMax = 2
    MCInitPrios <- PriosTwo
    MCEnvPrios = {}
    MCRuntimeChecks = TRUE
    MCPoll = FALSE
    MCReInit = FALSE
    MCIsrWaits = FALSE

SPECIFICATION Spec
\* All threads can end (Abort), and an ISR does not call an uninitialized
\* semaphore: the system then does nothing, which is not a deadlock.
CHECK_DEADLOCK FALSE

INVARIANTS
    Inv_TypeOK

PROPERTIES
    Live_WaiterServedIfGives
