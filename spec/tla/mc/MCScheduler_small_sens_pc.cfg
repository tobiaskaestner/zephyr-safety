\* Sensitivity set (small-scope argument, tla/small-scope.md of the
\* workspace notes): MCScheduler_small.cfg with the other priority set
\* (MCZPrios <- ZPriosCoop). All other constants and all properties are
\* those of the base. One exception: Inv_RunRuleHolds is not checked, as in
\* the configurations coop and p7_rules_coop. With two cooperative
\* priorities and k_thread_abort() it fails through finding P7-c
\* (configuration coop_rule). Expected result: the result of the base
\* (pass).
\*
\* The comment of the base:
\* A small default run: one CPU, one object, no priority change (the
\* configurations p7_* check it), CONFIG_USE_SWITCH=y. All invariants and liveness
\* properties of lib/Scheduler.tla and lib/Platform.tla, and the
\* normative properties that hold.
CONSTANTS
    t1 = t1
    t2 = t2
    t3 = t3
    o1 = o1
    o2 = o2
    j1 = j1
    j2 = j2
    j3 = j3
    i1 = i1
    c1 = c1
    c2 = c2
    NoObj = NoObj
    IdleT = IdleT
    d1 = d1
    NoD = NoD
    MCCPUS = {c1}
    MCZPrios <- ZPriosCoop
    MCMutant = "none"
    MCIsrPends = FALSE
    MCSetPrioBy = "none"
    MCAbort = TRUE
    MCUseSwitch = TRUE
    MCOuterLock = FALSE
    MCMaxNest = 1
    MCObjs = {o1}
    MCExtra = FALSE
    MCJoin = FALSE
    MCInit = FALSE

SPECIFICATION Spec

