\* Sensitivity set (small-scope argument, tla/small-scope.md of the
\* workspace notes): MCScheduler_small_pendsv.cfg with 4 threads (Threads =
\* {t1, t2, t3, t4}). All other constants and all properties are those of
\* the base. Expected result: the result of the base (pass).
\*
\* The comment of the base:
\* A small default run: one CPU, one object, no priority change and no
\* abort (the configurations p7_*_pendsv and coop_rule_pendsv check them),
\* arch_swap() and PendSV (CONFIG_USE_SWITCH=n). With the abort,
\* RunRuleHolds fails: an ISR in the gap before PendSV gives the CPU back
\* to a cooperative waiter behind its peer (SW-1), and its abort of
\* another thread then leaves the cache at the peer (P7-c). All invariants and liveness properties of
\* lib/Scheduler.tla and lib/Platform.tla, and the normative properties
\* that hold.
CONSTANTS
    t1 = t1
    t2 = t2
    t3 = t3
    o1 = o1
    o2 = o2
    j1 = j1
    j2 = j2
    j3 = j3
    i1 = i1
    c1 = c1
    c2 = c2
    NoObj = NoObj
    IdleT = IdleT
    d1 = d1
    NoD = NoD
    Threads = {t1, t2, t3, t4}
    MCCPUS = {c1}
    MCZPrios <- ZPriosMixed
    MCMutant = "none"
    MCIsrPends = FALSE
    MCSetPrioBy = "none"
    MCAbort = FALSE
    MCUseSwitch = FALSE
    MCOuterLock = FALSE
    MCMaxNest = 1
    MCObjs = {o1}
    MCExtra = FALSE
    MCJoin = FALSE
    MCInit = FALSE

SPECIFICATION Spec

INVARIANTS
    Inv_TypeOK
    Inv_CurUnique
    Inv_CurIsReady
    Inv_PendingIsQueued
    Inv_ArmedArePending
    Inv_DeadIsInert
    Inv_RunRuleHolds
    Inv_NoPanic
    Inv_WQ_StampsNormal
    Inv_WQ_RanksDistinct
    Inv_TO_ArmedOnce
    Inv_TO_CostBounded
    Inv_RqStampsNormal
    Inv_P_NoPendSVWithSwitch
    Inv_P_PendingIsUnlocked
    Inv_PreemptibleRunsHighest

PROPERTIES
    Live_TimedWaitEnds
    Live_SelectionHappens
    Prop_SwitchSelectsHighest
    Prop_NoSwitchWhileLocked
