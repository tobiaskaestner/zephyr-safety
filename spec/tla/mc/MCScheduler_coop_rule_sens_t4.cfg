\* Sensitivity set (small-scope argument, tla/small-scope.md of the
\* workspace notes): MCScheduler_coop_rule.cfg with 4 threads (Threads =
\* {t1, t2, t3, t4}). All other constants and all properties are those of
\* the base. Expected result: the result of the base
\* (fail:Inv_RunRuleHolds).
