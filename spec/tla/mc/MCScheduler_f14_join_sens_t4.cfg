\* Sensitivity set (small-scope argument, tla/small-scope.md of the
\* workspace notes): MCScheduler_f14_join.cfg with 4 threads (Threads =
\* {t1, t2, t3, t4}). All other constants and all properties are those of
\* the base. Expected result: the result of the base
\* (fail:Inv_PreemptibleRunsHighest).
\*
\* The comment of the base:
\* Finding F14: k_thread_abort() of another thread makes the joiners of
\* the target ready, and halt_thread() does not reschedule. A joiner with a
\* higher priority than the preemptible current thread then does not run
\* (ZEP-SRS-2-9). No object, only the join queues; no priority change.
CONSTANTS
    t1 = t1
    t2 = t2
    t3 = t3
    o1 = o1
    o2 = o2
    j1 = j1
    j2 = j2
    j3 = j3
    i1 = i1
    c1 = c1
    c2 = c2
    NoObj = NoObj
    IdleT = IdleT
    d1 = d1
    NoD = NoD
    Threads = {t1, t2, t3, t4}
    JoinQ4 = j4
    MCCPUS = {c1}
    MCZPrios <- ZPriosMixed
    MCMutant = "none"
    MCIsrPends = FALSE
    MCSetPrioBy = "none"
    MCAbort = TRUE
    MCUseSwitch = TRUE
    MCOuterLock = FALSE
    MCMaxNest = 1
    MCObjs = {}
    MCExtra = FALSE
    MCJoin = TRUE
    MCInit = FALSE

SPECIFICATION Spec

INVARIANTS
    Inv_TypeOK
    Inv_PreemptibleRunsHighest
