\* CONFIG_NO_RUNTIME_CHECKS with the condition of use of sem finding 1:
\* k_sem_init() gets only a limit above 0 and an initial count not above
\* the limit. Two threads. The count stays at or below the limit
\* (Inv_CountLeLimitAlways), and the token and hand-over properties hold,
\* which fail with invalid arguments (configurations nochecks and
\* nochecks_tokens).
CONSTANTS
    t1 = t1
    t2 = t2
    t3 = t3
    s1 = s1
    s2 = s2
    i1 = i1
    c1 = c1
    NoObj = NoObj
    IdleT = IdleT
    NoD = NoD
    MCThreads <- Threads2
    MCSems <- Sems1
    MCInitArgs <- ArgsValid
    MCUMax = 3
    MCInitPrios <- PriosTwo
    MCEnvPrios = {}
    MCRuntimeChecks = FALSE
    MCPoll = FALSE
    MCReInit = FALSE
    MCIsrWaits = FALSE

SPECIFICATION SafetySpec
\* All threads can end (Abort), and an ISR does not call an uninitialized
\* semaphore: the system then does nothing, which is not a deadlock.
CHECK_DEADLOCK FALSE
VIEW ViewNoObs

INVARIANTS
    Inv_TypeOK
    Inv_ReqIsWait
    Inv_PendingIsQueued
    Inv_ArmedArePending
    Inv_DeadIsInert
    Inv_CurIsReady
    Inv_RunRuleHolds
    Inv_CountLeLimitAlways
    Inv_NoWaitWhileAvailable
    Inv_TokenConservation
    Inv_NoPanic
    Inv_NoUndefined

PROPERTIES
    Prop_CallsHoldLock
    Prop_GiveHandsOverOrCounts
    Prop_GiveWakesHighest
    Prop_TakeResult
    Prop_ResetWakesAll
    Prop_InitSetsFields
    Prop_InitRejectsInvalid
    Prop_WaitResult
    Prop_TimeoutReturnsEagain
    Prop_PollSignalMeansAvailable
