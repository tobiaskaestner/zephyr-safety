\* Sensitivity set (small-scope argument, tla/small-scope.md of the
\* workspace notes): MCScheduler_small_b.cfg with 2 threads (Threads = {t1,
\* t2}), the lower check. All other constants and all properties are those
\* of the base. Expected result: the result of the base (pass).
\*
\* The comment of the base:
\* Round B: the small run with the calls of P1, P4 and P5 (MCExtra): a
\* thread writes its swap data before a wait, z_unpend_all() of
\* k_heap_free(), the walk of a mailbox send with a stop, and a msgq
\* hand-over that keeps the buffer of the waiter. One CPU, one object,
\* CONFIG_USE_SWITCH=y, without the abort (the configurations join and
\* p7_abort check it) and without a priority change. All invariants and
\* liveness properties, and the normative properties that hold.
