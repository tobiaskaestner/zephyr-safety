\* Sensitivity set (small-scope argument, tla/small-scope.md of the
\* workspace notes): MCScheduler_p7_rules.cfg with the wide priority set
\* (MCZPrios <- ZPriosWide: -2, -1, 0, 1). All other constants and all
\* properties are those of the base. One exception: Inv_RunRuleHolds is not
\* checked, as in the configurations coop and p7_rules_coop. With two
\* cooperative priorities and k_thread_abort() it fails through finding
\* P7-c (configuration coop_rule). Expected result: the result of the base
\* (pass).
\*
\* The comment of the base:
\* One CPU, mixed priorities. The normative properties of ZEP-SRS-2-9
\* and ZEP-SRS-2-12 hold (with all invariants).
