\* Two semaphores (one sem_lock for both, not visible at the coarse
\* grain), two threads. All properties.
CONSTANTS
    t1 = t1
    t2 = t2
    t3 = t3
    s1 = s1
    s2 = s2
    i1 = i1
    c1 = c1
    NoObj = NoObj
    IdleT = IdleT
    NoD = NoD
    MCThreads <- Threads2
    MCSems <- Sems2
    MCInitArgs <- ArgsSmall
    MCUMax = 2
    MCInitPrios <- PriosTwo
    MCEnvPrios = {}
    MCRuntimeChecks = TRUE
    MCPoll = FALSE
    MCReInit = FALSE
    MCIsrWaits = FALSE

SPECIFICATION SafetySpec
\* All threads can end (Abort), and an ISR does not call an uninitialized
\* semaphore: the system then does nothing, which is not a deadlock.
CHECK_DEADLOCK FALSE
VIEW ViewNoObs

INVARIANTS
    Inv_TypeOK
    Inv_ReqIsWait
    Inv_PendingIsQueued
    Inv_ArmedArePending
    Inv_DeadIsInert
    Inv_CurIsReady
    Inv_RunRuleHolds
    Inv_CountLeLimit
    Inv_NoWaitWhileAvailable
    Inv_TokenConservation
    Inv_NoPanic
    Inv_NoUndefined

PROPERTIES
    Prop_CallsHoldLock
    Prop_GiveHandsOverOrCounts
    Prop_GiveWakesHighest
    Prop_TakeResult
    Prop_ResetWakesAll
    Prop_WaitResult
    Prop_PollSignalMeansAvailable
