\* A small default run: one CPU, one object, no priority change (the
\* configurations p7_* check it), CONFIG_USE_SWITCH=y. All invariants and liveness
\* properties of lib/Scheduler.tla and lib/Platform.tla, and the
\* normative properties that hold.
CONSTANTS
    t1 = t1
    t2 = t2
    t3 = t3
    o1 = o1
    o2 = o2
    i1 = i1
    c1 = c1
    c2 = c2
    NoObj = NoObj
    IdleT = IdleT
    d1 = d1
    NoD = NoD
    MCCPUS = {c1}
    MCZPrios <- ZPriosMixed
    MCMutant = "none"
    MCIsrPends = FALSE
    MCSetPrioBy = "none"
    MCAbort = TRUE
    MCUseSwitch = TRUE
    MCOuterLock = FALSE
    MCMaxNest = 1
    MCObjs = {o1}

SPECIFICATION Spec

INVARIANTS
    Inv_TypeOK
    Inv_CurUnique
    Inv_CurIsReady
    Inv_PendingIsQueued
    Inv_ArmedArePending
    Inv_DeadIsInert
    Inv_RunRuleHolds
    Inv_NoPanic
    Inv_WQ_StampsNormal
    Inv_WQ_RanksDistinct
    Inv_TO_ArmedOnce
    Inv_TO_CostBounded
    Inv_RqStampsNormal
    Inv_P_NoPendSVWithSwitch
    Inv_P_PendingIsUnlocked
    Inv_PreemptibleRunsHighest

PROPERTIES
    Live_TimedWaitEnds
    Live_SelectionHappens
    Prop_SwitchSelectsHighest
    Prop_NoSwitchWhileLocked
