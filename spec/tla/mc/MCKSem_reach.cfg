\* Reachability probes (one run for each probe, no view): three threads,
\* no priority change.
CONSTANTS
    t1 = t1
    t2 = t2
    t3 = t3
    s1 = s1
    s2 = s2
    i1 = i1
    c1 = c1
    NoObj = NoObj
    IdleT = IdleT
    NoD = NoD
    MCThreads <- Threads3
    MCSems <- Sems1
    MCInitArgs <- ArgsDefault
    MCUMax = 3
    MCInitPrios <- PriosTwo
    MCEnvPrios = {}
    MCRuntimeChecks = TRUE
    MCPoll = FALSE
    MCReInit = FALSE
    MCIsrWaits = FALSE

SPECIFICATION SafetySpec
\* All threads can end (Abort), and an ISR does not call an uninitialized
\* semaphore: the system then does nothing, which is not a deadlock.
CHECK_DEADLOCK FALSE

INVARIANTS
    Reach_AllThreadsWait
    Reach_IsrGivesToWaiter
    Reach_IsrTakeBusy
    Reach_ResetWakesTwo
    Reach_TimeoutReturns
    Reach_ReturnEagain
    Reach_ReturnOk
    Reach_GiveAtLimit
    Reach_InitRejected
    Reach_WokenPreempts
