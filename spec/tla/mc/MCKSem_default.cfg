\* One semaphore, three threads with two priorities, one ISR, priority
\* changes (k_thread_priority_set()), the default Kconfig of the sem app
\* (runtime checks on, no CONFIG_POLL). Safety only, with the view without
\* obs. All behavior invariants and requirement properties of KSem.
CONSTANTS
    t1 = t1
    t2 = t2
    t3 = t3
    s1 = s1
    s2 = s2
    i1 = i1
    c1 = c1
    NoObj = NoObj
    IdleT = IdleT
    NoD = NoD
    MCThreads <- Threads3
    MCSems <- Sems1
    MCInitArgs <- ArgsDefault
    MCUMax = 3
    MCInitPrios <- PriosTwo
    MCEnvPrios <- PriosTwo
    MCRuntimeChecks = TRUE
    MCPoll = FALSE
    MCReInit = FALSE
    MCIsrWaits = FALSE

SPECIFICATION SafetySpec
\* All threads can end (Abort), and an ISR does not call an uninitialized
\* semaphore: the system then does nothing, which is not a deadlock.
CHECK_DEADLOCK FALSE
VIEW ViewNoObs

INVARIANTS
    Inv_TypeOK
    Inv_ReqIsWait
    Inv_PendingIsQueued
    Inv_ArmedArePending
    Inv_DeadIsInert
    Inv_CurIsReady
    Inv_RunRuleHolds
    Inv_CountLeLimit
    Inv_NoWaitWhileAvailable
    Inv_TokenConservation
    Inv_NoPanic
    Inv_NoUndefined

PROPERTIES
    Prop_CallsHoldLock
    Prop_GiveHandsOverOrCounts
    Prop_GiveWakesHighest
    Prop_TakeResult
    Prop_ResetWakesAll
    Prop_WaitResult
    Prop_PollSignalMeansAvailable
