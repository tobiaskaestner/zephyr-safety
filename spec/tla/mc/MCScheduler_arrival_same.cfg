\* Candidate P7-w (the waiter form of P7-a). One CPU, one object, no
\* abort. A running thread sets the priority of another thread to the
\* priority that it has. If that thread waits, z_thread_prio_set() removes
\* it from the wait queue and adds it again (kernel/sched.c:633-643), so it
\* goes behind the waiters of the same priority. Expected violation of
\* WaitQueue!KeepsArrivalOrder: no priority value changes, but the order of
\* arrival does. MCWaitQueue does not show it: its priority step always
\* changes the value.
