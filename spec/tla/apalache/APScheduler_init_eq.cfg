\* TLC: each state of Init satisfies InitAP (constants of MCScheduler_small).
CONSTANTS
    t1 = t1
    t2 = t2
    t3 = t3
    o1 = o1
    o2 = o2
    j1 = j1
    j2 = j2
    j3 = j3
    i1 = i1
    c1 = c1
    c2 = c2
    NoObj = NoObj
    IdleT = IdleT
    d1 = d1
    NoD = NoD
    MCCPUS = {c1}
    MCZPrios <- ZPriosMixed
    MCMutant = "none"
    MCIsrPends = FALSE
    MCSetPrioBy = "none"
    MCAbort = TRUE
    MCUseSwitch = TRUE
    MCOuterLock = FALSE
    MCMaxNest = 1
    MCObjs = {o1}
    MCExtra = FALSE
    MCJoin = FALSE
    MCInit = FALSE

INIT Init
NEXT NoStep
INVARIANT InitAP
