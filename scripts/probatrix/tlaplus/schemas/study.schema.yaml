# The keys and types of study.yaml of the kind tlaplus (JSON Schema 2020-12, in YAML).
$schema: https://json-schema.org/draft/2020-12/schema
$id: tlaplus/study.schema.yaml
title: study.yaml
type: object
additionalProperties: false
required: [name]
properties:
  name: {$ref: "common.schema.yaml#/$defs/name"}
  kind:
    description: the name of the kind of study (core/kinds.py); the nearest design file that names one wins
    type: string
  question: {type: string}
  experiments:
    type: array
    items: {$ref: "common.schema.yaml#/$defs/name"}
  imports:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [study, experiment]
      properties:
        study: {type: string}
        experiment: {type: string}
        mode: {enum: [reuse, rerun]}
  substudies:
    type: array
    items: {$ref: "common.schema.yaml#/$defs/name"}
