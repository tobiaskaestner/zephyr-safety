# Definitions that the other schemas of the kind tlaplus share.
$schema: https://json-schema.org/draft/2020-12/schema
$id: tlaplus/common.schema.yaml
$defs:
  name:
    type: string
    pattern: "^[a-z0-9][a-z0-9_-]*$"
  paths:
    description: paths below the root of the repository
    type: array
    items: {type: string, minLength: 1}
  check:
    description: an acceptance check or a check of a hypothesis (forms in core/checks.py)
    type: object
    additionalProperties: false
    required: [id]
    properties:
      id: {type: [string, integer]}
      written: {type: string, description: "when the limit was written, before which run"}
      experiment: {type: string}
      select: {type: object}
      metric:
        oneOf:
          - {type: string}
          - {type: array, items: {type: string}, minItems: 1}
      stat:
        oneOf:
          - {type: string}
          - {type: array, items: {type: string}, minItems: 1}
      expect: {type: object, minProperties: 1}
      basis: {type: string}
      manual: {type: boolean}
      statement: {type: string}
      formerly:
        oneOf:
          - {type: string}
          - {type: array, items: {type: string}}
