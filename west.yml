manifest:
  self:
    path: safety

  defaults:
    remote: zephyrproject-rtos
    revision: main

  remotes:
    - name: zephyrproject-rtos
      url-base: https://github.com/zephyrproject-rtos

    - name: nashif
      url-base: https://github.com/nashif

    - name: tiacsys
      url-base: https://github.com/tiacsys

  projects:
    - name: zephyr
      remote: tiacsys
      revision: topic-safety-tskr
      import:
        # By using name-allowlist we can clone only the modules that are
        # strictly needed by the application.
        name-allowlist:
          - cmsis_6      # required by the ARM port
          - cmsis      # required by the ARM port
          - segger     # required by nordic boards
          - hal_nordic # required by nordic boards
          - hal_stm32  # required by STM32 boards
          - hal_nxp    # required by NXP boards

    - name: reqmgmt
      path: doc/reqmgmt

    - name: safety-committee
      url: git@github.com:zephyrproject-rtos/safety-committee.git
      path: doc/safety-committee
      groups: 
        - safety-committee 

    - name: isa_zephyr
      url: git@github.com:bernhard-tuvsud/isa_zephyr.git
      path: doc/isa_zephyr
      groups: 
        - safety-committee 

    - name: safety-doc
      path: references/safety-doc

    # The documentation engine. Consumed as a Zephyr module: the module system
    # sets ZEPHYR_ZDOCS_MODULE_DIR, which doc/CMakeLists.txt adds to
    # CMAKE_MODULE_PATH before include(zdocs). No path is ever written into the
    # engine by hand.
    - name: zdocs
      remote: tiacsys
      revision: main
      path: tools/zdocs

  group-filter: [-safety-committee]