# This study has no experiment and no hypotheses of its own. Its
# sub-studies own the experiments and the hypotheses.

name: load-scaling
question: >
  How do the latencies grow with the number of threads and kernel timers,
  and which kernel data structure (ready queue, timeout queue backend)
  and which priority of SysTick set the growth?

substudies:
  - use: timeout-queue-cost
  - use: systick-priority
  - use: t2t-under-load

# The answer of this study: the central results of its sub-studies.
central_results:
  - {id: timer-slope, from: {substudy: timeout-queue-cost}}
  - {id: thread-slope, from: {substudy: timeout-queue-cost}}
  - {id: backend-tail, from: {substudy: timeout-queue-cost}}
  - {id: systick-prio-tail, from: {substudy: systick-priority}}
  - {id: t2t-grows-with-n, from: {substudy: t2t-under-load}}
