# Description: experiment.md. Hypotheses: ../hypotheses.yaml.

name: wp3-irq-1m
app: irq_latency
trees: [ws-up]
repeat: 1
timeout: 1200

common:
  kconfig:
    LATBENCH_SAMPLES: 1000000
    LATBENCH_STIM_MIN_US: 100
    LATBENCH_STIM_MAX_US: 500
    LATBENCH_IRQ_PATH_WRAPPED: y
    LATBENCH_CODE_RAM: y     # hot code in the CCM SRAM

axes:                        # the variants: wp3-variants.md
  variant:
    baseline: {}
    scalable:
      kconfig: {SCHED_SCALABLE: y}
    multiq:
      kconfig: {SCHED_MULTIQ: y}
    ticks1000:
      kconfig: {SYS_CLOCK_TICKS_PER_SEC: 1000}
    tickless-off:              # 10000 explicit: the default without tickless is 100
      kconfig: {TICKLESS_KERNEL: n, SYS_CLOCK_TICKS_PER_SEC: 10000}
    tickless-off-100:
      kconfig: {TICKLESS_KERNEL: n, SYS_CLOCK_TICKS_PER_SEC: 100}
    fpu-sharing:
      kconfig: {FPU: y, FPU_SHARING: y}
    speed-opt:
      kconfig: {SPEED_OPTIMIZATIONS: y}
    assert:
      kconfig: {ASSERT: y}
    assert-spin:
      kconfig: {ASSERT: y, SPIN_VALIDATE: y}
    no-mpu-guard:              # HW_STACK_PROTECTION=y selects MPU_STACK_GUARD
      kconfig: {HW_STACK_PROTECTION: n, MPU_STACK_GUARD: n}

# The load of the explicit points: t64 = 64 load timers, busy16 = 16
# busy threads. The cube points have no load.
extra_axes: {load: none}

points:
  - id: baseline-t64
    axes: {variant: baseline, load: t64}
    kconfig: {LATBENCH_LOAD_TIMERS: 64}
  - id: ticks1000-t64
    axes: {variant: ticks1000, load: t64}
    kconfig: {LATBENCH_LOAD_TIMERS: 64, SYS_CLOCK_TICKS_PER_SEC: 1000}
  - id: tickless-off-t64
    axes: {variant: tickless-off, load: t64}
    kconfig: {LATBENCH_LOAD_TIMERS: 64, TICKLESS_KERNEL: n, SYS_CLOCK_TICKS_PER_SEC: 10000}
  - id: tickless-off-100-t64
    axes: {variant: tickless-off-100, load: t64}
    kconfig: {LATBENCH_LOAD_TIMERS: 64, TICKLESS_KERNEL: n, SYS_CLOCK_TICKS_PER_SEC: 100}
