# The files of this study, by convention (no keys):
#   <experiment>/experiment.yaml   an experiment that it owns
#   <experiment>/experiment.md     its description
#   hypotheses.yaml                the hypotheses, written before the runs
#   report.ipynb                   the report template (no outputs)
#   wp3-variants.md                the variants of the three experiments

name: kconfig-factors
question: >
  Which Kconfig options of the WP3 ranking change the three latencies,
  against a baseline of the same run, and by how much?

experiments:
  - wp3-irq-1m
  - wp3-wake-1m
  - wp3-t2t-1m

# The results that answer the question. For now all are characterisation:
# measured values. There are no requirement limits yet.
#
# Keys:
#   id         unique in the study
#   statement  the result as a sentence; {name} is a value of the result
#   from       the data: experiment, point, metric, or hypotheses
#   stat       the statistic (study-design.md §14.3)
#   unit       the unit of the values
#
# New stat of this study:
#   diff_rank: for each stat, the variants sorted by their value minus the value of the point with variant baseline and the same load, in the same run.
central_results:
  - id: irq-ranking
    statement: >
      Against the baseline of the same run, {first} changes the irq
      {stat} most, by {first_diff:+d} cycles. The order of all variants
      is {ranking}.
    from: {experiment: wp3-irq-1m, metric: irq}
    stat: {diff_rank: [p50, p99]}
    unit: cycles at 170 MHz

  - id: wake-ranking
    statement: >
      Against the baseline of the same run, {first} changes the isr2thr
      {stat} most, by {first_diff:+d} cycles. The order of all variants
      is {ranking}.
    from: {experiment: wp3-wake-1m, metric: isr2thr}
    stat: {diff_rank: [p50, p99]}
    unit: cycles at 170 MHz

  - id: t2t-ranking
    statement: >
      Against the baseline of the same run, {first} changes the t2t
      {stat} most, by {first_diff:+d} cycles. The order of all variants
      is {ranking}.
    from: {experiment: wp3-t2t-1m, metric: t2t}
    stat: {diff_rank: [p50, p99]}
    unit: cycles at 170 MHz

  - id: tick-reprogram-modes
    statement: >
      Without the tickless kernel, the slice reset does not reprogram the
      SysTick. Then the ISR to thread wake and the thread to thread
      latency have one mode, and the clock drift is about 0 ppm.
    from: {hypotheses: [H12a, H12b, H12c, H19, H20, H21, H29]}
    stat: conclusion               # a person confirms the sentence
