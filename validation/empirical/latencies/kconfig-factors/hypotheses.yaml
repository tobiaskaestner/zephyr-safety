# Hypotheses of the study kconfig-factors. Each statement and each
# limit was written before the run of its experiment (in the comments of
# the experiment files). The basis texts were written on 2026-10-26,
# after the runs, from these comments. Where a comment gave no basis for
# a number, the basis text starts with "Reconstruction:" or "Estimate.".
# The comments did not number the predictions, so no hypothesis has the
# key "formerly". The hypotheses compare a point with the point
# "baseline" (or "baseline-t64", "baseline-busy16") of the same run.
#
# Keys:
#   id         unique in the study
#   formerly   the id in the earlier experiment files and notes
#   type       method: a property that the measurement method must have
#              model:  a prediction from the code or from a model of the kernel
#   written    date, and the run that came after it
#   statement  the hypothesis, one or two sentences
#   basis      where each number comes from
#   experiment, select, metric, stat: the data that the check reads
#   expect     the check (the comparison forms: study-design.md §14.4)
#   manual     true: a person gives the verdict
#   wrong_if   what a wrong hypothesis means for the study
#
# New forms of this study:
#   stat drift_ppm: clock_drift_cyc / clock_elapsed_cyc x 1e6 of the point (LAT META, latbench.py drift_ppm). No metric.
#   expect diff_change: {point: P, of: [Q, R], range: [lo, hi]}: (value - value of P) - (value of Q - value of R) in one run. null: no limit.

hypotheses:
  # ------------------------------------------------------------ wp3-irq-1m
  - id: H1a
    type: model
    written: 2026-10-25, before wp3-irq-1m/20261025T223624Z
    statement: SCHED_SCALABLE does not change the irq p50 (+-2 cycles).
    basis: >
      The IRQ entry path has no scheduler. Estimate. The comment gives no
      basis for the 2 cycles.
    experiment: wp3-irq-1m
    select: {point: scalable}
    metric: irq
    stat: p50
    expect: {diff_to: {point: baseline, range: [-2, 2]}}
    wrong_if: >
      The scheduler is on the IRQ entry path, or the code placement in
      the CCM SRAM moves the p50.

  - id: H1b
    type: model
    written: 2026-10-25, before wp3-irq-1m/20261025T223624Z
    statement: SCHED_MULTIQ does not change the irq p50 (+-2 cycles).
    basis: As H1a.
    experiment: wp3-irq-1m
    select: {point: multiq}
    metric: irq
    stat: p50
    expect: {diff_to: {point: baseline, range: [-2, 2]}}
    wrong_if: As H1a.

  - id: H1c
    type: model
    written: 2026-10-25, before wp3-irq-1m/20261025T223624Z
    statement: FPU_SHARING does not change the irq p50 (+-2 cycles).
    basis: >
      The IRQ entry path saves no FP context. Estimate. The comment gives
      no basis for the 2 cycles.
    experiment: wp3-irq-1m
    select: {point: fpu-sharing}
    metric: irq
    stat: p50
    expect: {diff_to: {point: baseline, range: [-2, 2]}}
    wrong_if: The FPU settings change the IRQ entry path.

  - id: H1d
    type: model
    written: 2026-10-25, before wp3-irq-1m/20261025T223624Z
    statement: Without the MPU stack guard, the irq p50 does not change (+-2 cycles).
    basis: >
      The IRQ entry path has no scheduler and no FP context (the comment
      gives this reason for H1a..H1d together). Estimate. The comment
      gives no basis for the 2 cycles.
    experiment: wp3-irq-1m
    select: {point: no-mpu-guard}
    metric: irq
    stat: p50
    expect: {diff_to: {point: baseline, range: [-2, 2]}}
    wrong_if: The stack guard changes the IRQ entry path.

  - id: H2
    type: model
    written: 2026-10-25, before wp3-irq-1m/20261025T223624Z
    statement: SPEED_OPTIMIZATIONS decreases the irq p50 by 0..10 cycles.
    basis: >
      Estimate. The hardware does most of the IRQ entry, so the compiler
      has little code to change.
    experiment: wp3-irq-1m
    select: {point: speed-opt}
    metric: irq
    stat: p50
    expect: {diff_to: {point: baseline, range: [-10, 0]}}
    wrong_if: The IRQ entry has more software than expected.

  - id: H3a
    type: model
    written: 2026-10-25, before wp3-irq-1m/20261025T223624Z
    statement: ASSERT increases the irq p50 by 0..10 cycles.
    basis: Estimate. The comment gives no basis for the 10 cycles.
    experiment: wp3-irq-1m
    select: {point: assert}
    metric: irq
    stat: p50
    expect: {diff_to: {point: baseline, range: [0, 10]}}
    wrong_if: The assertions are on the IRQ entry path.

  - id: H3b
    type: model
    written: 2026-10-25, before wp3-irq-1m/20261025T223624Z
    statement: ASSERT with SPIN_VALIDATE increases the irq p50 by 0..10 cycles.
    basis: As H3a.
    experiment: wp3-irq-1m
    select: {point: assert-spin}
    metric: irq
    stat: p50
    expect: {diff_to: {point: baseline, range: [0, 10]}}
    wrong_if: As H3a.

  - id: H3c
    type: model
    written: 2026-10-25, before wp3-irq-1m/20261025T223624Z
    statement: ASSERT makes the irq max a little higher than the baseline.
    basis: The assertions make the sections with locked interrupts longer.
    experiment: wp3-irq-1m
    metric: irq
    stat: max
    expect: {order: [baseline, assert]}
    wrong_if: The assertions are not in the sections with locked interrupts.

  - id: H3d
    type: model
    written: 2026-10-25, before wp3-irq-1m/20261025T223624Z
    statement: ASSERT with SPIN_VALIDATE makes the irq max a little higher than the baseline.
    basis: As H3c.
    experiment: wp3-irq-1m
    metric: irq
    stat: max
    expect: {order: [baseline, assert-spin]}
    wrong_if: As H3c.

  - id: H4a
    type: model
    written: 2026-10-25, before wp3-irq-1m/20261025T223624Z
    statement: >
      Without the tickless kernel (10000 ticks/s), about 1..3 % of the
      edges wait for up to one SysTick ISR. The p99 increases from about
      81 cycles to some hundred cycles. The p50 does not change.
    basis: >
      A SysTick ISR comes every 17000 cycles. Estimate. The comment gives
      no length of the SysTick ISR for the share of 1..3 %. The p99 of
      about 81 cycles is from an earlier run.
    experiment: wp3-irq-1m
    manual: true
    wrong_if: >
      The periodic tick does not add a tail of about 1..3 %. Then the
      model of the SysTick ISR as the cause of the IRQ tail is not
      correct.

  - id: H4b
    type: model
    written: 2026-10-25, before wp3-irq-1m/20261025T223624Z
    statement: Without the tickless kernel (10000 ticks/s), the irq p99 is higher than the baseline.
    basis: As H4a.
    experiment: wp3-irq-1m
    metric: irq
    stat: p99
    expect: {order: [baseline, tickless-off]}
    wrong_if: As H4a.

  - id: H5
    type: model
    written: 2026-10-25, before wp3-irq-1m/20261025T223624Z
    statement: 1000 ticks/s does not change the irq p50.
    basis: >
      The kernel stays tickless. Reconstruction: the comment gives no
      tolerance here. The check uses +-2 cycles, the tolerance of "the
      same" for the other variants in the same list (H1a..H1d).
    experiment: wp3-irq-1m
    select: {point: ticks1000}
    metric: irq
    stat: p50
    expect: {diff_to: {point: baseline, range: [-2, 2]}}
    wrong_if: The tick rate changes the IRQ entry path of the tickless kernel.

  - id: H6a
    type: model
    written: 2026-10-25, before wp3-irq-1m/20261025T223624Z
    statement: With 64 load timers, 1000 ticks/s gives a lower irq p99 than the baseline.
    basis: >
      At 1000 ticks/s, the kernel puts the expiries into fewer ticks:
      fewer SysTick ISRs, but longer ones.
    experiment: wp3-irq-1m
    metric: irq
    stat: p99
    expect: {order: [ticks1000-t64, baseline-t64]}
    wrong_if: The tick rate does not group the expiries of the timers.

  - id: H6b
    type: model
    written: 2026-10-25, before wp3-irq-1m/20261025T223624Z
    statement: With 64 load timers, 1000 ticks/s gives a higher irq max than the baseline.
    basis: As H6a.
    experiment: wp3-irq-1m
    metric: irq
    stat: max
    expect: {order: [baseline-t64, ticks1000-t64]}
    wrong_if: As H6a.

  - id: H7
    type: model
    written: 2026-10-25, before wp3-irq-1m/20261025T223624Z
    statement: >
      With 64 load timers and without the tickless kernel (10000
      ticks/s), the irq p99 is higher than the baseline.
    basis: A SysTick ISR comes every 100 us, also when no timer expires.
    experiment: wp3-irq-1m
    metric: irq
    stat: p99
    expect: {order: [baseline-t64, tickless-off-t64]}
    wrong_if: As H4a.

  - id: H8a
    type: model
    written: 2026-10-25, before wp3-irq-1m/20261025T223624Z
    statement: >
      With no load, the irq tail of tickless-off-100 is about 100 times
      smaller than the tail of tickless-off.
    basis: >
      Reconstruction: 100 ticks/s gives 100 times fewer SysTick ISRs
      than 10000 ticks/s.
    experiment: wp3-irq-1m
    manual: true
    wrong_if: The tail does not come from the periodic SysTick ISRs.

  - id: H8b
    type: model
    written: 2026-10-25, before wp3-irq-1m/20261025T223624Z
    statement: >
      With 64 load timers, the irq max of tickless-off-100 is 10000..20000
      cycles.
    basis: >
      The 64 timers have periods of 10..100 ms. Thus each tick ISR (every
      10 ms) handles about 64 x 10 ms x E[1/period] = 16 expiries.
      Estimate. The comment gives about 5000..10000 cycles for this ISR
      and 10000..20000 cycles for the max, with no derivation.
    experiment: wp3-irq-1m
    select: {point: tickless-off-100-t64}
    metric: irq
    stat: max
    expect: {range: [10000, 20000]}
    wrong_if: The model of the expiries in one tick ISR is not correct.

  - id: H8c
    type: model
    written: 2026-10-25, before wp3-irq-1m/20261025T223624Z
    statement: >
      With 64 load timers, the irq max of tickless-off-100 is higher than
      the max of the baseline.
    basis: As H8b.
    experiment: wp3-irq-1m
    metric: irq
    stat: max
    expect: {order: [baseline-t64, tickless-off-100-t64]}
    wrong_if: >
      The IRQ max with 64 timers is not more than the max of baseline-t64.
      Then the tick ISR with many expiries is not the cause of the far
      tail.

  - id: H8d
    type: model
    written: 2026-10-25, before wp3-irq-1m/20261025T223624Z
    statement: >
      With 64 load timers, the irq tail of tickless-off-100 has a share
      of about 0.5 %.
    basis: >
      As H8b. Reconstruction: an ISR of 5000..10000 cycles every 1.7M
      cycles covers 0.3..0.6 % of the time.
    experiment: wp3-irq-1m
    manual: true
    wrong_if: As H8b.

  # ----------------------------------------------------------- wp3-wake-1m
  - id: H9a
    type: model
    written: 2026-10-25, before wp3-wake-1m/20261025T205806Z
    statement: SCHED_SCALABLE increases the isr2thr p50 by a constant 50..200 cycles.
    basis: >
      The run queue is a red-black tree, not a list. Estimate. The
      comment gives no basis for 50..200. The comment names no statistic,
      so the check uses the p50.
    experiment: wp3-wake-1m
    select: {point: scalable}
    metric: isr2thr
    stat: p50
    expect: {diff_to: {point: baseline, range: [50, 200]}}
    wrong_if: The cost of the red-black tree is not as expected.

  - id: H9b
    type: model
    written: 2026-10-25, before wp3-wake-1m/20261025T205806Z
    statement: >
      With 16 busy threads, the cost of SCHED_SCALABLE is at most 40
      cycles more than with no busy thread (log N, not linear).
    basis: >
      A red-black tree has a cost of log N. Estimate. The comment gives
      no basis for 40. Reconstruction: "more than with none" is read as
      the change of the cost of SCHED_SCALABLE against SCHED_SIMPLE from
      0 to 16 busy threads. The check uses the p50, as H9a.
    experiment: wp3-wake-1m
    select: {point: scalable-busy16}
    metric: isr2thr
    stat: p50
    expect: {diff_change: {point: baseline-busy16, of: [scalable, baseline], range: [null, 40]}}
    wrong_if: The cost of SCHED_SCALABLE increases linearly with the number of busy threads.

  - id: H10a
    type: model
    written: 2026-10-25, before wp3-wake-1m/20261025T205806Z
    statement: SCHED_MULTIQ changes the isr2thr p50 by less than 30 cycles.
    basis: >
      Estimate. The comment gives no basis for 30. The comment names no
      statistic, so the check uses the p50.
    experiment: wp3-wake-1m
    select: {point: multiq}
    metric: isr2thr
    stat: p50
    expect: {diff_to: {point: baseline, range: [-30, 30]}}
    wrong_if: The cost of the list for each priority is not as expected.

  - id: H10b
    type: model
    written: 2026-10-25, before wp3-wake-1m/20261025T205806Z
    statement: With 16 busy threads, SCHED_MULTIQ changes the isr2thr p50 by less than 30 cycles.
    basis: As H10a.
    experiment: wp3-wake-1m
    select: {point: multiq-busy16}
    metric: isr2thr
    stat: p50
    expect: {diff_to: {point: baseline-busy16, range: [-30, 30]}}
    wrong_if: As H10a.

  - id: H11
    type: model
    written: 2026-10-25, before wp3-wake-1m/20261025T205806Z
    statement: >
      16 busy threads increase the isr2thr by about 400 cycles. The value
      is the same for 2..64 busy threads (O(1) in N). This experiment has
      16 busy threads only. wake-threads-1m has 2..64.
    basis: >
      The kernel slices the busy thread: one more slice abort and one
      more add for each wake (review of 2026-10-25, §5). The busy threads
      have priority 5, lower than the woken thread. Thus the sorted
      insert of SCHED_SIMPLE stops at once.
    experiment: wp3-wake-1m
    manual: true
    wrong_if: The cost of the busy threads is not the slice, or it depends on N.

  - id: H12a
    type: model
    written: 2026-10-25, before wp3-wake-1m/20261025T205806Z
    statement: Without the tickless kernel, the isr2thr p50 decreases by 250..300 cycles.
    basis: >
      Without TICKLESS_KERNEL, sys_clock_set_timeout() returns at once
      (ws-up drivers/timer/system_timer_generic.h:650). Thus the slice
      reset never reprograms the SysTick, and the fast mode of the
      baseline (20 % of the samples) becomes the only mode. Estimate. The
      comment gives no derivation of 250..300. The comment names no
      statistic, so the check uses the p50.
    experiment: wp3-wake-1m
    select: {point: tickless-off}
    metric: isr2thr
    stat: p50
    expect: {diff_to: {point: baseline, range: [-300, -250]}}
    wrong_if: The SysTick reprogram in the slice reset is not the cause of the slow mode.

  - id: H12b
    type: model
    written: 2026-10-25, before wp3-wake-1m/20261025T205806Z
    statement: Without the tickless kernel, the isr2thr has one mode, at the fast mode of the baseline.
    basis: As H12a.
    experiment: wp3-wake-1m
    manual: true
    wrong_if: Two modes stay. Then the SysTick reprogram is not the cause of the slow mode.

  - id: H12c
    type: model
    written: 2026-10-25, before wp3-wake-1m/20261025T205806Z
    statement: Without the tickless kernel, the clock drift is about 0 ppm.
    basis: >
      Without the reprograms, the kernel resets no SysTick reload. The
      limit of 20 ppm is the "Wrong if" limit of the comment.
    experiment: wp3-wake-1m
    select: {point: tickless-off}
    stat: drift_ppm
    expect: {range: [-20, 20]}
    wrong_if: The drift is more than 20 ppm. Then the reset of the reload is not the cause of the drift.

  - id: H13a
    type: model
    written: 2026-10-25, before wp3-wake-1m/20261025T205806Z
    statement: 1000 ticks/s changes the isr2thr p50 by less than 30 cycles.
    basis: >
      The kernel stays tickless, with the same slice and the same
      reprogram. Estimate. The comment gives no basis for 30. The
      comment names no statistic, so the check uses the p50.
    experiment: wp3-wake-1m
    select: {point: ticks1000}
    metric: isr2thr
    stat: p50
    expect: {diff_to: {point: baseline, range: [-30, 30]}}
    wrong_if: The tick rate changes the slice or the reprogram.

  - id: H13b
    type: model
    written: 2026-10-25, before wp3-wake-1m/20261025T205806Z
    statement: At 1000 ticks/s, the clock drift for each reprogram is the same as in the baseline.
    basis: As H13a.
    experiment: wp3-wake-1m
    manual: true
    wrong_if: The drift for each reprogram depends on the tick rate.

  - id: H14
    type: model
    written: 2026-10-25, before wp3-wake-1m/20261025T205806Z
    statement: FPU_SHARING increases the isr2thr p50 by 0..30 cycles.
    basis: >
      PendSV examines the FP bit of EXC_RETURN. Estimate. The comment
      gives no basis for 30. The comment names no statistic, so the
      check uses the p50.
    experiment: wp3-wake-1m
    select: {point: fpu-sharing}
    metric: isr2thr
    stat: p50
    expect: {diff_to: {point: baseline, range: [0, 30]}}
    wrong_if: The FP context costs more than the check of one bit.

  - id: H15
    type: model
    written: 2026-10-25, before wp3-wake-1m/20261025T205806Z
    statement: SPEED_OPTIMIZATIONS decreases the isr2thr p50 by 10..25 %.
    basis: >
      Estimate. The comment gives no basis. The comment names no
      statistic, so the check uses the p50.
    experiment: wp3-wake-1m
    select: {point: speed-opt}
    metric: isr2thr
    stat: p50
    expect:
      ratio_to: {point: baseline, stat: p50}
      range: [0.75, 0.90]
    wrong_if: The compiler optimization has less or more effect on the wake path than expected.

  - id: H16a
    type: model
    written: 2026-10-25, before wp3-wake-1m/20261025T205806Z
    statement: ASSERT increases the isr2thr p50 by 5..15 %.
    basis: >
      Estimate. The comment gives no basis. The comment names no
      statistic, so the check uses the p50.
    experiment: wp3-wake-1m
    select: {point: assert}
    metric: isr2thr
    stat: p50
    expect:
      ratio_to: {point: baseline, stat: p50}
      range: [1.05, 1.15]
    wrong_if: The assertions on the wake path cost less or more than expected.

  - id: H16b
    type: model
    written: 2026-10-25, before wp3-wake-1m/20261025T205806Z
    statement: SPIN_VALIDATE increases the isr2thr p50 by 100..150 cycles more than ASSERT alone.
    basis: >
      About 3..4 spinlock pairs for each wake, 25..40 cycles each.
      Reconstruction: the product is 75..160 cycles. The comment gives
      100..150 with no reason for the smaller range. The comment names no
      statistic, so the check uses the p50.
    experiment: wp3-wake-1m
    select: {point: assert-spin}
    metric: isr2thr
    stat: p50
    expect: {diff_to: {point: assert, range: [100, 150]}}
    wrong_if: The number of spinlock pairs or the cost of one check is not as expected.

  - id: H17
    type: model
    written: 2026-10-25, before wp3-wake-1m/20261025T205806Z
    statement: Without the MPU stack guard, the isr2thr p50 decreases by 100..250 cycles.
    basis: >
      PendSV skips the update of the MPU region. Estimate. The comment
      gives no basis for 100..250. The comment names no statistic, so
      the check uses the p50.
    experiment: wp3-wake-1m
    select: {point: no-mpu-guard}
    metric: isr2thr
    stat: p50
    expect: {diff_to: {point: baseline, range: [-250, -100]}}
    wrong_if: >
      The wake changes by less than 50 cycles. Then the MPU region update
      is not a large part of the thread switch.

  - id: H18
    type: model
    written: 2026-10-25, before wp3-wake-1m/20261025T205806Z
    statement: >
      With 64 load timers, the slice walk over about 30 timeouts adds
      600..700 cycles against the fast mode, in baseline-t64,
      ticks1000-t64 and tickless-off-t64. tickless-off-t64 has no
      reprograms.
    basis: >
      The slice reset walks the timeout list. Estimate. The comment gives
      no basis for 30 timeouts or for 600..700 cycles.
    experiment: wp3-wake-1m
    manual: true
    wrong_if: The slice walk does not depend on the number of timeouts.

  - id: H19
    type: model
    written: 2026-10-25, before wp3-wake-1m/20261025T205806Z
    statement: >
      The isr2thr p50 of tickless-off-100 is the same as of tickless-off:
      no reprogram, one mode, a clock drift of about 0.
    basis: >
      Without TICKLESS_KERNEL, the slice reset does not reprogram the
      SysTick, also at 100 ticks/s (as H12a). The comment gives no
      tolerance for "the same".
    experiment: wp3-wake-1m
    manual: true
    wrong_if: The wake keeps two modes.

  # ------------------------------------------------------------ wp3-t2t-1m
  - id: H20
    type: model
    written: 2026-10-25, before wp3-t2t-1m/20261025T203235Z
    statement: >
      The t2t of the baseline has two modes: about 20 % fast and 80 %
      slow. The slow mode is about 640 cycles slower (two SysTick
      reprograms).
    basis: The same two modes as in thread2thread-1m.
    experiment: wp3-t2t-1m
    manual: true
    wrong_if: The distance of the two modes is not about 640 cycles.

  - id: H21
    type: model
    written: 2026-10-25, before wp3-t2t-1m/20261025T203235Z
    statement: >
      Without the tickless kernel, the t2t has one mode, at the fast mode
      of the baseline (640 cycles less than the slow mode).
    basis: >
      Without TICKLESS_KERNEL, the slice reset does not reprogram the
      SysTick (as H12a). The slice walk stays.
    experiment: wp3-t2t-1m
    manual: true
    wrong_if: Two modes stay. Then the SysTick reprograms are not the cause of the slow mode.

  - id: H22
    type: model
    written: 2026-10-25, before wp3-t2t-1m/20261025T203235Z
    statement: SCHED_SCALABLE increases the t2t p50 by a constant 50..200 cycles.
    basis: As H9a.
    experiment: wp3-t2t-1m
    select: {point: scalable}
    metric: t2t
    stat: p50
    expect: {diff_to: {point: baseline, range: [50, 200]}}
    wrong_if: As H9a.

  - id: H23
    type: model
    written: 2026-10-25, before wp3-t2t-1m/20261025T203235Z
    statement: SCHED_MULTIQ changes the t2t p50 by less than 30 cycles.
    basis: As H10a.
    experiment: wp3-t2t-1m
    select: {point: multiq}
    metric: t2t
    stat: p50
    expect: {diff_to: {point: baseline, range: [-30, 30]}}
    wrong_if: As H10a.

  - id: H24
    type: model
    written: 2026-10-25, before wp3-t2t-1m/20261025T203235Z
    statement: FPU_SHARING increases the t2t p50 by 0..30 cycles.
    basis: As H14.
    experiment: wp3-t2t-1m
    select: {point: fpu-sharing}
    metric: t2t
    stat: p50
    expect: {diff_to: {point: baseline, range: [0, 30]}}
    wrong_if: As H14.

  - id: H25
    type: model
