# The files of this study, by convention (no keys):
#   ex-<experiment>/experiment.yaml   an experiment that it owns
#   ex-<experiment>/experiment.md     its description
#   st-<sub-study>/study.yaml         a sub-study
#   hypotheses.yaml                   the hypotheses, written before the runs
#   report.ipynb                      the report template (no outputs)

name: mask-time
question: >
  Which call sites of the kernel mask the interrupts, for how long, and
  how does the longest mask section grow with the load?

experiments:
  - m4-sweep
  - m4-thread

imports:
  - {study: measurement-validity/mask-instrumentation, experiment: m4-validate, mode: reuse}

# The results that answer the question. For now all are characterisation:
# measured values. There are no requirement limits yet.
#
# Keys:
#   id         unique in the study
#   statement  the result as a sentence; {name} is a value of the result
#   from       the data: experiment, point, metric, or hypotheses
#   stat       the statistic (doc/benchmark-guide/studies.rst)
#   unit       the unit of the values
#
# Forms that are new in this file (metric m4.<kind>...: see hypotheses.yaml):
#   stat top_site                          for each point, the mask site with the largest max_net: {max_net}, {place} (the function in the m4.py table), {ctx}
#   {fit_linear: {stat: <stat>, x: [axes]}}  the least-squares line of the stat over the sum of the value: numbers of the axes: {intercept}, {slope}
#   stat value                             the value of a meta metric for each point: {value}
central_results:
  - id: longest-by-load
    statement: >
      At {point} (timers, sleepers, slicing), the longest mask section is
      {max_net} cycles, in {place} ({ctx}).
    from: {experiment: m4-sweep, metric: m4.mask}
    stat: top_site
    unit: cycles at 170 MHz (max - m4_floor_cyc)

  - id: growth-per-timeout
    statement: >
      The longest mask section grows by {slope:.0f} cycles for each timeout
      in the queue (timers + sleepers), from {intercept:.0f} cycles without
      load ({slice}).
    from: {experiment: m4-sweep, metric: m4.mask}
    stat: {fit_linear: {stat: max(max_net), x: [timers, sleepers]}}
    unit: cycles at 170 MHz

  - id: thread-sites
    statement: >
      In thread_latency with {primitive} and {timers}, the longest mask
      section in thread context is {max_net} cycles, in {place}.
    from: {experiment: m4-thread, metric: m4.mask.t}
    stat: top_site
    unit: cycles at 170 MHz (max - m4_floor_cyc)

  # The m4-sweep comment (m4-sweep/6) said "grows with the load" and gave
  # no limit for it. Thus the masked share is a result, not a hypothesis.
  - id: masked-share
    statement: >
      At {point} (timers, sleepers, slicing), the interrupts are masked for
      {value:.2%} of the M4 window.
    from: {experiment: m4-sweep, metric: meta.m4_masked_share}
    stat: value
    unit: share of the window (m4_masked_cyc / m4_window_cyc)
