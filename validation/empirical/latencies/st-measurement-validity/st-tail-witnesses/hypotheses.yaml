# Hypotheses of the study tail-witnesses. A hypothesis is wrong if one of
# its checks is wrong. The statements and the limits were written on
# 2026-10-30, before the first runs of irq-witness-1m and
# wake-witness-250k. The numbers of the bases come from manual quick
# checks on the board (not data: flash, 20000 or 100000 samples, run-log
# of the agent notes, 2026-10-29 and 2026-10-30). The check forms are in
# doc/benchmark-guide/reference/check-forms.rst.

hypotheses:
  - id: H1
    type: method
    statement: >
      The witness code does not change the latency path that it
      describes. With the hot code in RAM, the histograms with and
      without the witnesses have the same p50 and p99 (within 1 cycle)
      and the same p99.9 (within 3 cycles).
    basis: >
      The mark runs before the stimulus, the add after the end time stamp
      in a function that is not inline. prestamp.py found the same
      instructions before the time stamp of resp_isr with and without
      the option (wrapped and direct, 2026-10-30). The option adds code,
      so the other code moves. In RAM a move does not change the latency:
      st-code-placement H2 (irq p50 spread 2 cycles or less over pads in
      RAM). In flash the quick checks moved: irq min 55 without, 43 with
      the witnesses (direct, idle, 100000 samples), which is the code
      placement effect.
    wrong_if: >
      The witnesses change the latency. Then a witness run cannot explain
      the tail of a run without witnesses.
    checks:
      - id: a
        written: 2026-10-30, before the first run of irq-witness-1m
        experiment: irq-witness-1m
        select: {witness: with}
        metric: irq
        stat: [p50, p99]
        expect: {diff_to: {axes: {witness: without}, range: [-1, 1]}}
        basis: st-code-placement H2 a, b (spread_abs_le 2 over pads in RAM); one point pair here.
      - id: b
        written: 2026-10-30, before the first run of irq-witness-1m
        experiment: irq-witness-1m
        select: {witness: with}
        metric: irq
        stat: p99.9
        expect: {diff_to: {axes: {witness: without}, range: [-3, 3]}}
        basis: Estimate. The p99.9 has fewer samples, so its value moves more from run to run.
      - id: c
        written: 2026-10-30, before the first run of wake-witness-250k
        experiment: wake-witness-250k
        select: {witness: with}
        metric: [isr2thr, irq2thr]
        stat: [p10, p50]
        expect: {diff_to: {axes: {witness: without}, range: [-2, 2]}}
        basis: >
          st-code-placement H2 d, e (isr2thr p50 spread 5 or less over pads
          in RAM); p10 is in the fast mode, p50 in the slow mode.

  - id: H2
    type: method
    statement: >
      The witness calls are cheap: a mark costs at most 60 cycles, an add
      that the table rejects at most 120 cycles, and an add that stores a
      row (with the scan of a full table of 64 rows) at most 1200 cycles.
    basis: >
      Quick checks (flash, table of 32 rows): mark 37, reject 76..80,
      store 522..553 cycles. Most of the store is the scan of the full
      table, which grows with the rows: 64 rows give about twice the
      scan.
    wrong_if: The witness calls take so long that they change the timing of the next stimulus.
    checks:
      - id: a
        written: 2026-10-30, before the first run of irq-witness-1m
        experiment: irq-witness-1m
        select: {witness: with}
        metric: meta.tail_cost_mark_cyc
        stat: value
        expect: {range: [10, 60]}
        basis: Quick check 37 (flash).
      - id: b
        written: 2026-10-30, before the first run of irq-witness-1m
        experiment: irq-witness-1m
        select: {witness: with}
        metric: meta.tail_cost_reject_cyc
        stat: value
        expect: {range: [30, 120]}
        basis: Quick checks 76..80 (flash).
      - id: c
        written: 2026-10-30, before the first run of irq-witness-1m
        experiment: irq-witness-1m
        select: {witness: with}
        metric: meta.tail_cost_full_cyc
        stat: value
        expect: {range: [200, 1200]}
        basis: Quick checks 553..556 for 32 rows (flash); 64 rows double the scan.

  - id: H3
    type: model
    statement: >
      The largest IRQ entry samples of an idle system come from the
      SysTick ISR: it has the same priority as the response IRQ and runs
      first when both are pending. Without load, at least 90 % of the
      table rows of 700 cycles or more have the cause systick. With 16
      load timers, at least 90 % of these rows have a SysTick cause
      (systick or systick+timers).
    basis: >
      Idea 4 of the comparison note: the upstream benchmark found that
      the idle tail on the MCXN947 is the SysTick ISR every 2^24 cycles
      (PR commit 3fe87c6). The PR load-trace run on the G474 gave one
      tick and one load-timer run for each outlier of 1916..2048 cycles.
      Quick check of our witnesses (direct, idle, flash, 100000 samples):
      the row of 1526 cycles has a SysTick reload during the sample. The
      mask sections of the kernel without load are at most about 520
      cycles (st-mask-time), so a sample of 700 cycles or more needs more
      than a mask section.
    wrong_if: >
      The idle tail has another cause, for example a long mask section of
      the kernel or a cache effect. Then the tail of the entry latency is
      not a property of the system timer.
    checks:
      - id: a
        written: 2026-10-30, before the first run of irq-witness-1m
        experiment: irq-witness-1m
        select: {witness: with, load: none}
        metric: tail.irq
        stat: cause_share(systick, 700)
        expect: {range: [0.9, 1]}
        basis: See the basis of the hypothesis.
      - id: b
        written: 2026-10-30, before the first run of irq-witness-1m
        experiment: irq-witness-1m
        select: {witness: with, load: t16}
        metric: tail.irq
        stat: label_share(systick, 700)
        expect: {range: [0.9, 1]}
        basis: The load timers expire in the SysTick ISR (cause systick+timers, label systick).

  - id: H4
    type: method
    statement: >
      The label systick-reprogram (a SysTick reload during the sample
      without a SysTick interrupt) comes only from the slice reset of the
      wake path. Without time slicing no row of the wake table has it.
    basis: >
      Without slicing, the wake path of a semaphore with K_FOREVER adds
      no timeout, so it does not reprogram SysTick. Quick check (flash,
      20000 samples): 25 of 32 rows had the label with slicing, 0 of 5
      without.
    wrong_if: >
      The label also comes from other events. Then it is not a witness of
      the slice reset.
    checks:
      - id: a
        written: 2026-10-30, before the first run of wake-witness-250k
        experiment: wake-witness-250k
        select: {witness: with, slicing: noslice}
        metric: tail.irq2thr
        stat: label_share(systick-reprogram, 0)
        expect: {range: [0, 0.05]}
        basis: Quick check 0 of 5 rows.
      - id: b
        written: 2026-10-30, before the first run of wake-witness-250k
        experiment: wake-witness-250k
        select: {witness: with, slicing: slice}
        metric: tail.irq2thr
        stat: label_share(systick-reprogram, 0)
        expect: {range: [0.05, 1]}
        basis: >
          Quick check 25 of 32 rows of 20000 samples; 7 rows had a SysTick
          ISR. In 250000 samples about 90 samples have a SysTick ISR, so
          the table has 256 rows (LATBENCH_TAIL_N) and keeps also samples
          of the slow mode. The check needs only that the label occurs.
