# Description: experiment.md. Hypotheses: ../hypotheses.yaml.

name: wake-clock-drift-fix
app: wake_latency
trees: [ws-up-driftfix]
repeat: 1
timeout: 400

common:
  kconfig:
    LATBENCH_SAMPLES: 200000
    LATBENCH_WAKE_SEM: y

axes:
  comp:
    nocomp: {}
    gapcomp:
      kconfig: {CORTEX_M_SYSTICK_RELOAD_GAP_COMP: y}
  anchor:
    default: {}
    noslice:
      kconfig: {TIMESLICING: n}
    switch:
      conf_files: [common/conf/use_switch.conf]

# Axes that only the t256 points change, with the value of the cube points.
extra_axes: {timers: t0, min_reload: min10us, bins: hdefault}

# min_reload: the shortest SysTick reload (zephyr,min-timeout-cycles).
points:
  - id: t256-min10us-gapcomp
    axes: {comp: gapcomp, anchor: default, timers: t256, min_reload: min10us, bins: hcoarse}
    kconfig: {CORTEX_M_SYSTICK_RELOAD_GAP_COMP: y, LATBENCH_LOAD_TIMERS: 256,
              LATBENCH_HIST_BINS: 2048, LATBENCH_HIST_COARSE_BINS: 2048}
  - id: t256-min50us-gapcomp
    axes: {comp: gapcomp, anchor: default, timers: t256, min_reload: min50us, bins: hcoarse}
    kconfig: {CORTEX_M_SYSTICK_RELOAD_GAP_COMP: y, LATBENCH_LOAD_TIMERS: 256,
              LATBENCH_HIST_BINS: 2048, LATBENCH_HIST_COARSE_BINS: 2048}
    dtc_overlays: [common/boards/nucleo_g474re/systick/min_timeout_50us.overlay]
  - id: t256-min200us-gapcomp
    axes: {comp: gapcomp, anchor: default, timers: t256, min_reload: min200us, bins: hcoarse}
    kconfig: {CORTEX_M_SYSTICK_RELOAD_GAP_COMP: y, LATBENCH_LOAD_TIMERS: 256,
              LATBENCH_HIST_BINS: 2048, LATBENCH_HIST_COARSE_BINS: 2048}
    dtc_overlays: [common/boards/nucleo_g474re/systick/min_timeout_200us.overlay]
