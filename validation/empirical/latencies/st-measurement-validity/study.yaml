name: measurement-validity
kind: latbench
question: >
  Do the benchmark apps measure the latency of the kernel, and not an
  effect of the measurement method, the code layout or the host?

substudies:
  - use: stimulus-sampling
  - use: clock-drift
  - use: code-placement
  - use: mask-instrumentation
  - use: reproducibility
  - use: stimulus-path
  - use: tail-witnesses

# The answer of this study: the central results of its sub-studies.
central_results:
  - {id: tail-needs-seeds, from: {substudy: stimulus-sampling}}
  - {id: same-image-same-data, from: {substudy: reproducibility}}
  - {id: drift-cause, from: {substudy: clock-drift}}
  - {id: placement-choice, from: {substudy: code-placement}}
