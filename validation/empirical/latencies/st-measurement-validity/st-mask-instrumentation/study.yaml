# The files of this study, by convention (no keys):
#   ex-<experiment>/experiment.yaml   an experiment that it owns
#   ex-<experiment>/experiment.md     its description
#   st-<sub-study>/study.yaml         a sub-study
#   hypotheses.yaml                   the hypotheses, written before the runs
#   report.ipynb                      the report template (no outputs)

name: mask-instrumentation
kind: latbench
question: >
  Do the interrupt mask hooks of the tree ws-up-irqoff (M4) measure the
  mask time of each call site, and do they leave the image unchanged
  when they are off?

experiments:
  - wake-m4-image-check                 # build only, no run
  - wake-m4-validate                    # its latency histograms are not data

# H2 c and d compare the calibration point with t0-default of
# wake-timers-1m on ws-up.
imports:
  - {study: zephyr-versions, experiment: wake-timers-1m, mode: reuse}

# The results that answer the question. For now all are characterisation:
# measured values. There are no requirement limits yet.
#
# Keys:
#   id         unique in the study
#   statement  the result as a sentence; {name} is a value of the result
#   from       the data: experiment, point, metric, or hypotheses
#   stat       the statistic (doc/benchmark-guide/reference/central-results.rst)
#   unit       the unit of the values
#
# Forms that are new in this file (metric meta.<name>: see hypotheses.yaml):
#   stat value   the value of a meta metric; {<name>} is the value of meta.<name>
central_results:
  - id: hooks-off-same-image
    statement: >
      With the hooks off, the tree ws-up-irqoff gives the image of ws-up.
      Only the version strings differ.
    from: {hypotheses: [H1]}
    stat: conclusion               # a person confirms the sentence

  - id: hook-cost
    statement: >
      An empty mask section has a value of {m4_floor_cyc} cycles. The
      hooks add {m4_pair_cost_cyc} cycles of CPU time to each section.
    from: {experiment: wake-m4-validate, point: cal-t0, metric: [meta.m4_floor_cyc, meta.m4_pair_cost_cyc]}
    stat: value
    unit: cycles at 170 MHz

  - id: mask-paths-covered
    statement: >
      The site table measures a probe of a known length, and the IRQ max
      with SysTick one level lower agrees with the longest mask section.
      M4 sees the mask paths of these points.
    from: {hypotheses: [H3, H4]}
    stat: conclusion
