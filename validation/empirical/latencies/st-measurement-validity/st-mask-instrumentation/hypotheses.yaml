# Hypotheses of the study mask-instrumentation. A hypothesis is one claim
# about a mechanism. Its checks test the claim on points, metrics and
# statistics. The hypothesis is wrong if one check is wrong.
#
# Each statement and each limit was written before the run of its
# experiment (in the comments of the experiment files). wake-m4-image-check has
# no run: it is a build check. The basis texts were written on 2026-10-26,
# after the runs, from these comments and the notes that they name. Where
# a comment gave no basis for a number, the basis text of the check
# starts with "Reconstruction:" or "Estimate.".
#
# This study checks the instrument (the M4 hooks) only. The predictions of
# wake-m4-validate about the kernel (the timeout walk, the SysTick ISR body, the
# sites without load) are checks in the study mask-time, which imports
# wake-m4-validate. The pairing counters of the M4 logs (m4_unmatched_end,
# m4_begin_open) say if a run is usable: they are acceptance checks in
# ex-wake-m4-validate/experiment.yaml.
#
# Keys of a hypothesis:
#   id         unique in the study
#   type       method: a property that the measurement method must have
#              model:  a prediction from the code or from a model of the kernel
#   statement  the claim, one or two sentences
#   basis      the mechanism and its sources
#   wrong_if   what a wrong hypothesis means for the study
#   checks     the tests of the claim
# Keys of a check:
#   id         unique in the hypothesis (a, b, ...)
#   formerly   the label in the old experiment comments, if it had one
#   written    date, and the run that came after it
#   experiment, select, metric, stat: the data that the check reads
#   expect     the comparison (forms: doc/benchmark-guide/reference/check-forms.rst)
#   manual     true: a person gives the verdict
#   basis      where the number of the check comes from
#
# Forms that are new in this file:
#   metric m4.<kind>[.<ctx>][<function>]  the M4 sites of a kind (mask, isr), context (t, e14, e15, e22 = EXTI0) and function (the place in the m4.py table)
#   metric meta.<name>                    a value of a LAT META line, or used and dropped of the LAT M4 BEGIN line
#   stat value                            the value of a meta metric (one for each point)
#   stat max_net, min_net                 max or min of a site minus m4_floor_cyc of the same log (m4.py)
#   stat max(x), n over several sites     the largest x of the sites; the sum of the section counts (0 if there is no site)
#   select {point: [ids]}                 several points; each point is checked
#   diff_to {run, tree, point, range}     as diff_to {point}, but against a point of another run
#   diff_to {metric, stat, range}         the value minus the value of another metric and stat of the same point

hypotheses:
  - id: H1
    type: method
    statement: >
      With the hooks off, ws-up and ws-up-irqoff give the same image for
      each point. Only the version strings (BUILD_VERSION) can differ.
    basis: >
      CONFIG_ARM_IRQ_MASK_HOOKS=n removes the hook calls, and
      common/irqmask.cmake then adds no source file (m4.rst). The version
      string is the git describe of each Zephyr tree.
    wrong_if: The hooks change the code also when they are off.
    checks:
      - id: a
        written: 2026-10-25 (commit 8a6ba03), build only, no run in the results
        experiment: wake-m4-image-check
        manual: true
        statement: >
          For each point, the images of ws-up and ws-up-irqoff are the same,
          apart from the version strings.
        basis: No number. The comment gives the check without a basis.

  - id: H2
    type: method
    statement: >
      The cost of the hooks is known and small: the calibration of each run
      measures it, and the hooks add about this cost to the wake path.
    basis: >
      m4-design.md §3 estimates the cost of the hooks from their
      disassembly. The wake from WFI runs a begin and an end hook before
      "cpsie i", and the ISR enter hook runs before the ISR. The wake
      window of arch_cpu_idle starts after the wake-up and ends at
      "cpsie i" (m4.rst).
    wrong_if: >
      The estimate of the hook cost from the disassembly is not correct, or
      the hooks on the wake path cost more or less than the model of the
      hooks says. Then the site values contain an unknown part.
    checks:
      - id: a
        formerly: wake-m4-validate/cal-t0
        written: 2026-10-25, before m4-validate/20261025T235532Z
        experiment: wake-m4-validate
        metric: meta.m4_floor_cyc
        stat: value
        expect: {range: [15, 30]}
        basis: >
          Estimate. The comment gives no basis. m4-design.md §3 gives 15..30
          as an estimate from the disassembly of the hooks.
      - id: b
        formerly: wake-m4-validate/cal-t0
        written: 2026-10-25, before m4-validate/20261025T235532Z
        experiment: wake-m4-validate
        metric: meta.m4_pair_cost_cyc
        stat: value
        expect: {range: [60, 150]}
        basis: >
          Estimate. The comment gives no basis. m4-design.md §3 gives 60..150
          as an estimate from the disassembly of the hooks.
      - id: c
        formerly: wake-m4-validate/cal-t0
        written: 2026-10-25, before m4-validate/20261025T235532Z
        experiment: wake-m4-validate
        select: {point: cal-t0}
        metric: irq
        stat: p50
        expect:
          diff_to: {run: load-scaling/timeout-queue-cost/wake-timers-1m/20261024T225125Z, tree: ws-up, point: t0-default, range: [60, 150]}
        basis: >
          Reconstruction: the comment says "about one pair cost", and check b
          gives 60..150 for it. The reason: the wake from WFI runs a begin
          and an end hook before "cpsie i", and the ISR enter hook runs
          before the ISR. m4-design.md §3 gives the same +60..150.
      - id: d
        formerly: wake-m4-validate/cal-t0
        written: 2026-10-25, before m4-validate/20261025T235532Z
        experiment: wake-m4-validate
        select: {point: cal-t0}
        metric: isr2thr
        stat: p50
        expect:
          diff_to: {run: load-scaling/timeout-queue-cost/wake-timers-1m/20261024T225125Z, tree: ws-up, point: t0-default, range: [200, 400]}
        basis: >
          Estimate. The comment gives the parts: two pair costs (check b:
          120..300 together) and one ISR exit hook. It gives no cost for the
          exit hook. m4-design.md §3 gives the same +200..400 as an estimate.
      - id: e
        formerly: wake-m4-validate/cal-t0
        written: 2026-10-25, before m4-validate/20261025T235532Z
        experiment: wake-m4-validate
        select: {point: cal-t0}
        metric: m4.mask[arch_cpu_idle]
        stat: max(max_net)
        expect: {range: [0, 19]}
        basis: >
          Estimate. The section starts after the wake-up and ends at "cpsie i"
          (m4.rst). The comment gives no basis for the 20 cycles.

  - id: H3
    type: method
    statement: >
      The hooks measure a mask section of a known length: the probe site
      gives the length of the probe, and the IRQ tail of the same run shows
      it.
    basis: >
      The probe thread masks for exactly 5000 DWT cycles every 10 ms. Each
      section value contains the floor (H2 a). An edge that falls into a
      probe section waits for the end of the section and the end hook.
    wrong_if: >
      The direct method (the probe site) or the indirect method (the IRQ
      tail) does not measure a known mask length.
    checks:
      - id: a
        formerly: wake-m4-validate/probe-t0
        written: 2026-10-25, before m4-validate/20261025T235532Z
        experiment: wake-m4-validate
        select: {point: probe-t0}
        metric: m4.mask[probe_fn]
        stat: [min_net, max_net]
        expect: {range: [5000, 5010]}
        basis: >
          Estimate. The probe masks for exactly 5000 DWT cycles, and each
          section value contains the floor (H2 a). The comment gives no basis
          for the tolerance of 10 cycles.
      - id: b
        formerly: wake-m4-validate/probe-t0
        written: 2026-10-25, before m4-validate/20261025T235532Z
        experiment: wake-m4-validate
        select: {point: probe-t0}
        metric: irq
        stat: max
        expect: {range: [5000, 5400]}
        basis: >
          Estimate. Reconstruction of the 0.3 % of the edges in a probe
          section: 5000 of each 1700000 cycles (10 ms at 170 MHz) are masked.
          The comment gives no number for the end hook and the IRQ floor.
          m4-design.md §3 estimates the end hook tail as 60..100 cycles.

  - id: H4
    type: method
    statement: >
      The M4 sites contain all mask paths of the IRQ tail: with SysTick one
      level lower, the IRQ max of the run is the longest mask section +
      100..300.
    basis: >
      With SysTick lower, the SysTick ISR body does not block the EXTI0
      ISR, and the longest mask section sets the IRQ max (review-2026-10-25
      §4 findings 7 and 8). The rest is the IRQ entry plus the tail of the
      end hook (m4-design.md §5.1).
    wrong_if: >
      If the IRQ max is clearly larger than the longest mask section, M4
      does not see a mask path (m4-design.md §2).
    checks:
      - id: a
        formerly: wake-m4-validate/t64-lower, wake-m4-validate/t256-lower
        written: 2026-10-25, before m4-validate/20261025T235532Z
        experiment: wake-m4-validate
        select: {point: [t64-lower, t256-lower]}
        metric: irq
        stat: max
        expect:
          diff_to: {metric: m4.mask, stat: max(max_net), range: [100, 300]}
        basis: Estimate. No source gives a basis for the limits.
