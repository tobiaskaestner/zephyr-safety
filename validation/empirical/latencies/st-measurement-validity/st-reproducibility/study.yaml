# The files of this study, by convention (no keys):
#   ex-<experiment>/experiment.yaml   an experiment that it owns
#   ex-<experiment>/experiment.md     its description
#   st-<sub-study>/study.yaml         a sub-study
#   hypotheses.yaml                   the hypotheses, written before the runs
#   report.ipynb                      the report template (no outputs)
#
# This study has no experiment of its own.

name: reproducibility
question: >
  Does the same image give the same histograms on another host, does a
  rebuild from the sources of the run (its snapshot or its commit) give the same image, and does a new
  safety revision give the old data of the same code placement?

# It runs points of other experiments again (mode rerun: its own runs of
# these experiments, not their data).
imports:
  - {study: kconfig-factors, experiment: irq-kconfig-1m, mode: rerun}
  - {study: kconfig-factors, experiment: wake-kconfig-1m, mode: rerun}
  - {study: load-scaling/t2t-under-load, experiment: thread-load-1m, mode: rerun}
  # H1 reads the data of this experiment (mode reuse: the runs of the
  # owner study).
  - {study: measurement-validity/code-placement, experiment: wake-code-place-q4, mode: reuse}

# The results that answer the question. For now all are characterisation:
# measured values, with a confidence bound where the value is a
# probability. There are no requirement limits yet.
#
# Keys:
#   id         unique in the study
#   statement  the result as a sentence; {name} is a value of the result
#   from       the data: experiment, point, metric, or hypotheses
#   stat       the statistic (doc/benchmark-guide/reference/central-results.rst)
#   unit       the unit of the values
#
# New statistic:
#   hist_identical_count  the number of re-run points whose histograms are the
#                         same bin for bin as the same point in the run of the owner study
central_results:
  - id: same-image-same-data
    statement: >
      On another host, {hist_identical_count} of {n} re-run points give
      the same histograms bin for bin as the run of the owner study.
    from: {experiment: [irq-kconfig-1m, wake-kconfig-1m, thread-load-1m]}
    stat: hist_identical_count
    unit: points

  - id: rebuild-same-image
    statement: >
      A rebuild from the sources of the run gives the same image on two hosts.
    from: {experiment: [irq-kconfig-1m, wake-kconfig-1m, thread-load-1m]}
    stat: conclusion               # a person confirms the sentence; run.py --rebuild writes no record yet
