# Hypotheses of the study reproducibility. A hypothesis is one claim
# about a mechanism. Its checks test the claim on points, metrics and
# statistics. The hypothesis is wrong if one check is wrong.
#
# Each statement and each limit was written before the run of its
# experiment (in the comments of the experiment files). The basis texts
# were written on 2026-10-26, after the runs, from these comments. Where
# a comment gave no basis for a number, the basis text of the check
# starts with "Reconstruction:" or "Estimate.".
#
# H1 came from the study code-placement (criterion C3 of code-place-q4).
# It reads the experiment code-place-q4 (imported) and the reference run
# of code-layout in flash. The re-runs on another host have no
# hypothesis. Their results are central results (study.yaml).
#
# Keys of a hypothesis:
#   id         unique in the study
#   type       method: a property that the measurement method must have
#              model:  a prediction from the code or from a model of the kernel
#   statement  the claim, one or two sentences
#   basis      the mechanism and its sources
#   wrong_if   what a wrong hypothesis means for the study
#   checks     the tests of the claim
# Keys of a check:
#   id         unique in the hypothesis (a, b, ...)
#   formerly   the label in the old experiment comments, if it had one
#   written    date, and the run that came after it
#   experiment, select, metric, stat: the data that the check reads
#   expect     the comparison (forms: doc/benchmark-guide/reference/check-forms.rst)
#   manual     true: a person gives the verdict
#   basis      where the number of the check comes from
#
# New statistic: drift_per_wake = LAT META clock_drift_cyc / samples.
# New form of diff_to (the value minus the value of another point):
#   diff_to: {run: <run>, points: {<id>: <id there>}}   each selected point against its mapped point

hypotheses:
  - id: H1
    type: method
    statement: >
      A new safety revision reproduces the old data of the same code
      placement: the flash points f0 and f4 give the IRQ p50, the ISR to
      thread p50 and the drift of the reference points p0 and p4.
    basis: >
      f0 and f4 have the same code layout as p0 and p4 (commit 48f1341 of
      LATBENCH_CODE_PLACE). The reference is the run
      code-layout/20261025T060257Z (safety 5a7d0a5).
    wrong_if: The new revision changes the flash behaviour. Flash data from before and after it are not comparable.
    checks:
      - id: a
        formerly: code-place-q4/C3
        written: 2026-10-25, before code-place-q4/20261025T184743Z
        experiment: code-place-q4
        select: {point: [f0-default, f4-default, f0-noslice, f4-noslice]}
        metric: irq
        stat: p50
        expect:
          diff_to:
            run: measurement-validity/code-placement/code-layout/20261025T060257Z
            points: {f0-default: p0-default, f4-default: p4-default, f0-noslice: p0-noslice, f4-noslice: p4-noslice}
            range: [-1, 1]
        basis: Estimate. The comment gives no basis for the tolerance.
      - id: b
        formerly: code-place-q4/C3
        written: 2026-10-25, before code-place-q4/20261025T184743Z
        experiment: code-place-q4
        select: {point: [f0-default, f4-default, f0-noslice, f4-noslice]}
        metric: isr2thr
        stat: p50
        expect:
          diff_to:
            run: measurement-validity/code-placement/code-layout/20261025T060257Z
            points: {f0-default: p0-default, f4-default: p4-default, f0-noslice: p0-noslice, f4-noslice: p4-noslice}
            range: [-5, 5]
        basis: As a.
      - id: c
        formerly: code-place-q4/C3
        written: 2026-10-25, before code-place-q4/20261025T184743Z
        experiment: code-place-q4
        select: {point: [f0-default, f4-default]}
        stat: drift_per_wake
        expect:
          diff_to:
            run: measurement-validity/code-placement/code-layout/20261025T060257Z
            points: {f0-default: p0-default, f4-default: p4-default}
            range: [-0.05, 0.05]
        basis: As a.
