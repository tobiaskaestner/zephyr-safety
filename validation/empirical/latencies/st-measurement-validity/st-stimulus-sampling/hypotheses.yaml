# Hypotheses of the study stimulus-sampling. A hypothesis is one claim
# about a mechanism. Its checks test the claim on points, metrics and
# statistics. The hypothesis is wrong if one check is wrong.
#
# Each statement and each limit was written before the run of its
# experiment (in the comments of the experiment files). The basis texts
# were written on 2026-10-26, after the runs, from these comments. Where
# a comment gave no basis for a number, the basis text of the check
# starts with "Reconstruction:" or "Estimate.".
#
# There is no hypothesis for the tick phase coverage: the experiment
# files irq-phase-1m and wake-phase-1m stated no prediction before their
# runs. The coverage is a central result (study.yaml).
#
# Keys of a hypothesis:
#   id         unique in the study
#   type       method: a property that the measurement method must have
#              model:  a prediction from the code or from a model of the kernel
#   statement  the claim, one or two sentences
#   basis      the mechanism and its sources
#   wrong_if   what a wrong hypothesis means for the study
#   checks     the tests of the claim
# Keys of a check:
#   id         unique in the hypothesis (a, b, ...)
#   formerly   the label in the old experiment comments, if it had one
#   written    date, and the run that came after it
#   experiment, select, metric, stat: the data that the check reads
#   expect     the comparison (forms: doc/benchmark-guide/reference/check-forms.rst)
#   manual     true: a person gives the verdict
#   basis      where the number of the check comes from

hypotheses:
  - id: H1
    type: method
    statement: >
      Stimulus seeds act as independent samples of one distribution:
      the seed changes which edges meet a SysTick ISR, not the behaviour
      of the kernel. A value up to the p99.99 is stable over the seeds;
      the max is not.
    basis: >
      The modes come from the code paths, not from the stimulus sequence.
      The spread of a value comes from the count of samples above it.
    wrong_if: >
      The stimulus sequence changes the behaviour (p50 moves, or the p99
      spreads above 5 %), or a single seed is not enough for a value up to
      the p99.99.
    checks:
      - id: a
        formerly: stim-seed-1m/P2
        written: 2026-10-26, before stim-seed-1m/20261026T155715Z
        experiment: stim-seed-1m
        metric: [irq, isr2thr]
        stat: p50
        expect: {spread_abs_le: 2}
        basis: Estimate. The comment gives no basis for the 2 cycles.
      - id: b
        formerly: stim-seed-1m/P3
        written: 2026-10-26, before stim-seed-1m/20261026T155715Z
        experiment: stim-seed-1m
        metric: [irq, isr2thr]
        stat: [mean, p99]
        expect: {spread_le: 0.03}
        basis: >
          The comment gives "10000 samples above the p99". Reconstruction:
          the count above the p99 then has a relative standard deviation of
          1 %, and the range of 8 seeds is about 3 standard deviations. This
          assumes that the value moves like the count.
      - id: c
        formerly: stim-seed-1m/P4
        written: 2026-10-26, before stim-seed-1m/20261026T155715Z
        experiment: stim-seed-1m
        metric: [irq, isr2thr]
        stat: p99.99
        expect: {spread_le: 0.15}
        basis: >
          The comment gives "100 samples above it". Reconstruction: the count
          has a relative standard deviation of 10 %. The comment gives no
          basis for 15 %; there is no model of the tail shape.
      - id: d
        formerly: stim-seed-1m/P4
        written: 2026-10-26, before stim-seed-1m/20261026T155715Z
        experiment: stim-seed-1m
        metric: [irq, isr2thr]
        stat: max
        expect: {spread_le: 0.30}
        basis: Estimate. The max is one sample; there is no model of the tail shape.
      - id: e
        formerly: stim-seed-1m/P4
        written: 2026-10-26, before stim-seed-1m/20261026T155715Z
        experiment: stim-seed-1m
        metric: [irq, isr2thr]
        stat: max(max)
        expect:
          ratio_to: {run: kconfig-factors/wp3-wake-1m/20261025T205806Z, point: baseline-t64, stat: max}
          range: [1.0, 1.2]
        basis: Estimate. 8 seeds give 8 times the samples of the night run.

  - id: H2
    type: model
    statement: >
      A long run gives the same tail as several stimulus seeds of the same
      total length: the counts above a threshold scale with the number of
      ticks with many expiries, and the percentiles stay in the range of
      the seeds.
    basis: >
      stim-seed-1m showed that the seeds act as independent samples (the
      counts agree with Poisson). loadmodel.py gives the ticks with >= k
      expiries for each run length.
    wrong_if: A long run is not the same as several seeds, for example because the run is not stationary.
    checks:
      - id: a
        formerly: load-seed-tail/P1
        written: 2026-10-26, before load-seed-tail/20261026T181105Z
        experiment: load-seed-tail
        select: {point: default-4m}
        metric: irq
        stat: count_ge(4288)
        expect: {range: [365, 450]}
        basis: >
          4 x the mean count of the 8 seeds of stim-seed-1m (100.4 per 1M),
          times the ratio of the ticks with >= 3 expiries in the 4M run to 4 x
          the 1M run (loadmodel.py: 6142 / (4 x 1518)) = 406. Reconstruction:
          the range is about +-2 Poisson standard deviations.
      - id: b
        formerly: load-seed-tail/P1
        written: 2026-10-26, before load-seed-tail/20261026T181105Z
        experiment: load-seed-tail
        select: {point: default-4m}
        metric: irq
        stat: count_ge(5952)
        expect: {range: [17, 37]}
        basis: As a, from the mean count 5.2 per 1M of the 8 seeds = 27.
      - id: c
        formerly: load-seed-tail/P1
        written: 2026-10-26, before load-seed-tail/20261026T181105Z
        experiment: load-seed-tail
        select: {point: default-4m}
        metric: [irq, isr2thr]
        stat: [p99, p99.9, p99.99]
        expect: {within: {experiment: stim-seed-1m, stat: range}, tolerance_bins: 1}
        basis: A value up to the p99.99 does not depend on the stimulus seed (H1 c).
      - id: d
        formerly: load-seed-tail/P1
        written: 2026-10-26, before load-seed-tail/20261026T181105Z
        experiment: load-seed-tail
        select: {point: default-4m}
        metric: irq
        stat: max
        expect: {range: [7000, 8000]}
        basis: >
          Estimate from the max of the 8 seeds (6240..7840). An edge early in
          the one ISR with 5 expiries can give more than 8000, with a
          probability of about 4 %.

  - id: H3
    type: model
    statement: >
      The IRQ tail comes from the ticks on which several load timers
      expire: the SysTick ISR processes the expiries one after the other.
      Thus the load seed, which sets these ticks, sets the tail.
    basis: >
      Model of the load timers (scripts/benchmarks/loadmodel.py): the
      ticks with k expiries for each load seed.
    wrong_if: The tail does not come from the ticks with many expiries, or not from them only.
    checks:
      - id: a
        formerly: load-seed-tail/P2
        written: 2026-10-26, before load-seed-tail/20261026T181105Z
        experiment: load-seed-tail
        select: {point: lseed-90befffa}
        metric: irq
        stat: count_ge(4288)
        expect: {range: [45, 85]}
        basis: >
          The default count per 1M (100.4), times the ratio of the ticks with
          >= 3 expiries for this load seed to the default (loadmodel.py:
          948 / 1518) = 63. Reconstruction: the range is about +-2.5 Poisson
          standard deviations. The same rule gives the ranges of b and c.
      - id: b
        formerly: load-seed-tail/P2
        written: 2026-10-26, before load-seed-tail/20261026T181105Z
        experiment: load-seed-tail
        select: {point: lseed-78a5636f}
        metric: irq
        stat: count_ge(4288)
        expect: {range: [145, 210]}
        basis: As a, ratio 2674 / 1518 = 177.
      - id: c
        formerly: load-seed-tail/P2
        written: 2026-10-26, before load-seed-tail/20261026T181105Z
        experiment: load-seed-tail
        select: {point: lseed-c67178f2}
        metric: irq
        stat: count_ge(4288)
        expect: {range: [200, 280]}
        basis: >
          As a, ratio 3608 / 1518 = 239. If the count changed with the ticks
          with >= 2 expiries instead, it would be 157.
      - id: d
        formerly: load-seed-tail/P2
        written: 2026-10-26, before load-seed-tail/20261026T181105Z
        experiment: load-seed-tail
        select: {point: lseed-90befffa}
        metric: irq
        stat: count_ge(5952)
        expect: {range: [0, 10]}
        basis: >
          The default count per 1M (5.2), times the ratio of the ticks with
          >= 4 expiries (33 / 39) = 4. The same rule gives e and f.
      - id: e
        formerly: load-seed-tail/P2
        written: 2026-10-26, before load-seed-tail/20261026T181105Z
        experiment: load-seed-tail
        select: {point: lseed-78a5636f}
        metric: irq
        stat: count_ge(5952)
        expect: {range: [9, 27]}
        basis: As d, ratio 125 / 39 = 17.
      - id: f
        formerly: load-seed-tail/P2
        written: 2026-10-26, before load-seed-tail/20261026T181105Z
        experiment: load-seed-tail
        select: {point: lseed-c67178f2}
        metric: irq
        stat: count_ge(5952)
        expect: {range: [17, 40]}
        basis: As d, ratio 209 / 39 = 28.
      - id: g
        formerly: load-seed-tail/P3
        written: 2026-10-26, before load-seed-tail/20261026T181105Z
        experiment: load-seed-tail
        metric: irq
        stat: mean
        expect: {order: [lseed-90befffa, default-4m, lseed-78a5636f, lseed-c67178f2]}
        basis: loadmodel.py, the number of expiries per run for each load seed.
      - id: h
        formerly: load-seed-tail/P4
        written: 2026-10-26, before load-seed-tail/20261026T181105Z
        experiment: load-seed-tail
        manual: true
        statement: >
          The max is not a sharp test: an edge must come in the first
          1600..3400 cycles of an ISR with 5 or 6 expiries to give more than
          8000 cycles. The probability is about 25 % for 78a5636f and for
          c67178f2.
        basis: loadmodel.py, the ticks with 5 or 6 expiries, and the length of their ISR.
