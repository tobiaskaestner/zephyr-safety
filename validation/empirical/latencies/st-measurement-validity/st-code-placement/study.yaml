# The files of this study, by convention (no keys):
#   ex-<experiment>/experiment.yaml   an experiment that it owns
#   ex-<experiment>/experiment.md     its description
#   st-<sub-study>/study.yaml         a sub-study
#   hypotheses.yaml                   the hypotheses, written before the runs
#   report.ipynb                      the report template (no outputs)

name: code-placement
question: >
  How much does the address of the code (and of the data) change the
  latency, and which placement gives numbers that a comparison between
  trees and options can use?

experiments:
  - wake-code-layout
  - wake-code-place-q4
  - wake-data-place-250k
  - wake-witness-bss-250k

# The check of a code shift in the CCM SRAM (H2 k) reads the default seed
# of wake-stim-seed-1m and compares it with baseline-t64 of wake-kconfig-1m.
imports:
  - {study: measurement-validity/stimulus-sampling, experiment: wake-stim-seed-1m, mode: reuse}
  - {study: kconfig-factors, experiment: wake-kconfig-1m, mode: reuse}

# The results that answer the question. For now all are characterisation:
# measured values, with a confidence bound where the value is a
# probability. There are no requirement limits yet.
#
# Keys:
#   id         unique in the study
#   statement  the result as a sentence; {name} is a value of the result
#   from       the data: experiment, point, metric, or hypotheses
#   stat       the statistic (doc/benchmark-guide/reference/central-results.rst)
#   unit       the unit of the values
#
# New statistics:
#   drift_per_wake       LAT META clock_drift_cyc / samples (one wake per sample)
#   spread_abs: [s, ..]  max - min of each statistic s over the points, for each anchor
#   ram_cost: [s, ..]    median of s over the RAM pads - median of s over the flash pads, for each anchor
central_results:
  - id: flash-pad-spread
    statement: >
      In flash, the {metric} p50 changes by {p50} cycles over the pads
      0..28 (anchor {anchor}).
    from: {experiment: wake-code-layout, metric: [irq, isr2thr]}
    stat: {spread_abs: [p50]}
    group_by: [anchor]
    unit: cycles (max - min over the pads)

  - id: flash-pad-drift
    statement: >
      In flash, the drift changes by {drift_per_wake:.2f} cycles per wake
      over the pads 0..28 (anchor default).
    from: {experiment: wake-code-layout, point: [p0-default, p4-default, p8-default, p12-default,
                                            p16-default, p20-default, p24-default, p28-default]}
    stat: {spread_abs: [drift_per_wake]}
    unit: cycles per wake (max - min over the pads)

  - id: ram-pad-spread
    statement: >
      In RAM, the {metric} p50 changes by {p50} cycles and the drift by
      {drift_per_wake:.2f} cycles per wake over the pads 0..28 (anchor
      {anchor}).
    from:
      experiment: wake-code-place-q4
      point: [r0-default, r4-default, r8-default, r12-default, r16-default, r20-default, r24-default, r28-default,
              r0-noslice, r4-noslice, r8-noslice, r12-noslice, r16-noslice, r20-noslice, r24-noslice, r28-noslice]
      metric: [irq, isr2thr]
    stat: {spread_abs: [p50, drift_per_wake]}
    group_by: [anchor]
    unit: cycles, cycles per wake (max - min over the pads)

  - id: ram-cost
    statement: >
      Hot code in RAM changes the {metric} p50 by {p50:+.0f} cycles and
      the drift by {drift_per_wake:+.2f} cycles per wake, against code in
      flash (anchor {anchor}).
    from: {experiment: wake-code-place-q4, metric: [irq, isr2thr]}
    stat: {ram_cost: [p50, drift_per_wake]}    # criterion C4 of the old file: no limit
    group_by: [anchor]
    unit: cycles, cycles per wake

  - id: data-place
    statement: >
      With the code in RAM and a data pad of {pad} (msp moves with it),
      the isr2thr p10 is {p10:.0f} cycles and the p50 {p50:.0f} cycles
      (anchor {anchor}).
    from: {experiment: wake-data-place-250k, metric: isr2thr}
    stat: [p10, p50]
    unit: CPU cycles (170 MHz)

  - id: placement-choice
    statement: >
      Comparisons between trees and options use LATBENCH_CODE_RAM, and
      the builds keep their stacks in the same SRAM (LAT META msp).
      Absolute numbers use a range over LATBENCH_CODE_FLASH_PAD.
    # Also the check of the old flash data: hypothesis H1 of the study
    # reproducibility (formerly H4a..c of this study).
    from: {hypotheses: [H2, H3]}
    stat: conclusion               # a person confirms the sentence
