# Hypotheses of the study code-placement. A hypothesis is one claim
# about a mechanism. Its checks test the claim on points, metrics and
# statistics. The hypothesis is wrong if one check is wrong.
#
# Each statement and each limit was written before the run of its
# experiment (in the comments of the experiment files). The basis texts
# were written on 2026-10-26, after the runs, from these comments. Where
# a comment gave no basis for a number, the basis text of the check
# starts with "Reconstruction:" or "Estimate.".
#
# The check of the new revision against the old flash data (criterion C3
# of wake-code-place-q4) is in the study reproducibility. The log checks of
# wake-code-place-q4 and wake-code-place-q4-up are acceptance checks in their
# experiment files. The cost of RAM (criterion C4) has no limit: it is a
# central result (study.yaml).
#
# Keys of a hypothesis:
#   id         unique in the study
#   type       method: a property that the measurement method must have
#              model:  a prediction from the code or from a model of the kernel
#   statement  the claim, one or two sentences
#   basis      the mechanism and its sources
#   wrong_if   what a wrong hypothesis means for the study
#   checks     the tests of the claim
# Keys of a check:
#   id         unique in the hypothesis (a, b, ...)
#   formerly   the label in the old experiment comments, if it had one
#   written    date, and the run that came after it
#   experiment, select, metric, stat: the data that the check reads
#   expect     the comparison (forms: doc/benchmark-guide/reference/check-forms.rst)
#   manual     true: a person gives the verdict
#   basis      where the number of the check comes from
#
# New statistic: drift_per_wake = LAT META clock_drift_cyc / samples.
# New forms of diff_to (the value minus the value of another point):
#   diff_to: {experiment: <name>, point: same}   the same point id in the run of that experiment
#   diff_to: {run: <run>, points: {<id>: <id there>}}   each selected point against its mapped point
#   spread_abs_le: x inside diff_to   the differences over the selected points differ by x or less

hypotheses:
  - id: H1
    type: model
    statement: >
      The latency and the drift change with the pad, with a period of the
      flash line or of the cache line.
    basis: >
      In wake-threads-1m, builds with the same code at different addresses
      gave two groups (IRQ p50 86 or 82 cycles, drift 9.7 or 8.0 cycles
      per wake).
    wrong_if: The address effect in flash does not repeat with the size of the flash line or of the cache line.
    checks:
      - id: a
        written: 2026-10-25, before code-layout/20261025T060257Z
        experiment: wake-code-layout
        manual: true
        statement: >
          The IRQ p50, the ISR to thread p50 and the drift per wake change
          over the pads 0..28 with a period of the flash line or of the
          cache line.
        basis: The comment gives no line size and no size of the change.

  - id: H2
    type: method
    statement: >
      Hot code in RAM (the CCM SRAM) removes the effect of the code
      address: the pad and a shift of the CCM code do not change the
      latency and the drift.
    basis: >
      In flash, the code address changes the latency: the IRQ p50 changes
      by 5 cycles over the pads 0..28 (wake-code-layout), and the tree
      difference of the ISR to thread p50 changed from 0 to 190 cycles from
      build to build (wake-threads-1m). Code in the CCM SRAM does not go
      through the flash and its cache.
    wrong_if: >
      Code in RAM does not remove the effect of the code address, or the
      result for the pads 0..28 does not cover a code shift of 16 bytes in
      the CCM SRAM. Then a comparison in RAM still depends on the layout.
    checks:
      # Criterion C1: the pad in RAM.
      - id: a
        formerly: wake-code-place-q4/C1
        written: 2026-10-25, before code-place-q4/20261025T184743Z
        experiment: wake-code-place-q4
        select: {point: [r0-default, r4-default, r8-default, r12-default, r16-default, r20-default, r24-default, r28-default]}
        metric: irq
        stat: p50
        expect: {spread_abs_le: 2}
        basis: >
          Estimate. The comment gives no basis for the limit. For comparison,
          the spread in flash over the pads 0..28 is 5 cycles
          (code-layout/20261025T060257Z, IRQ p50 81..86).
      - id: b
        formerly: wake-code-place-q4/C1
        written: 2026-10-25, before code-place-q4/20261025T184743Z
        experiment: wake-code-place-q4
        select: {point: [r0-noslice, r4-noslice, r8-noslice, r12-noslice, r16-noslice, r20-noslice, r24-noslice, r28-noslice]}
        metric: irq
        stat: p50
        expect: {spread_abs_le: 2}
        basis: As a.
      - id: c
        formerly: wake-code-place-q4/C1
        written: 2026-10-25, before code-place-q4/20261025T184743Z
        experiment: wake-code-place-q4
        select: {point: [r0-default, r4-default, r8-default, r12-default, r16-default, r20-default, r24-default, r28-default]}
        stat: drift_per_wake
        expect: {spread_abs_le: 0.2}
        basis: >
          Estimate. The comment gives no basis for the limit. For comparison,
          the spread in flash over the pads is 1.6 cycles per wake
          (code-layout/20261025T060257Z, 8.06..9.66).
      - id: d
        formerly: wake-code-place-q4/C1
        written: 2026-10-25, before code-place-q4/20261025T184743Z
        experiment: wake-code-place-q4
        select: {point: [r0-default, r4-default, r8-default, r12-default, r16-default, r20-default, r24-default, r28-default]}
        metric: isr2thr
        stat: p50
        expect: {spread_abs_le: 5}
        basis: >
          Estimate. The comment gives no basis for the limit. For comparison,
          the spread in flash over the pads is 40 cycles
          (code-layout/20261025T060257Z, 1663..1703).
      - id: e
        formerly: wake-code-place-q4/C1
        written: 2026-10-25, before code-place-q4/20261025T184743Z
        experiment: wake-code-place-q4
        select: {point: [r0-noslice, r4-noslice, r8-noslice, r12-noslice, r16-noslice, r20-noslice, r24-noslice, r28-noslice]}
        metric: isr2thr
        stat: p50
        expect: {spread_abs_le: 5}
        basis: >
          Estimate, as d. The spread in flash over the pads is 35 cycles
          (code-layout/20261025T060257Z, 763..798).
      # A shift of the CCM code by 16 bytes (a new LAT META line in
      # stim_init(), see wake-stim-seed-1m).
      - id: k
        formerly: wake-stim-seed-1m/P1
        written: 2026-10-26, before stim-seed-1m/20261026T155715Z
        experiment: wake-stim-seed-1m
        select: {point: seed-default}
        metric: [irq, isr2thr, irq2thr]
        expect: {hist_identical_to: {experiment: wake-kconfig-1m, point: baseline-t64}}
        basis: >
          The same image gave the same histograms bin for bin on two hosts
          (reproducibility). The checks a to e found no change for code
          shifts of 0..28 bytes in RAM.
