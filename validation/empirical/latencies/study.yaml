# Study design (top level). The folders below with a study.yaml are its
# sub-studies. Each experiment file is in the folder of the (sub-)study
# that owns it; other studies refer to it by its name, which is unique.

name: kernel-latency
kind: latbench
question: >
  How long does the Zephyr kernel delay the response to an interrupt on a
  Cortex-M MCU (IRQ entry, ISR to thread, thread to thread), which kernel
  settings and loads change the delay, and by how much?
board: null                      # fixed by the sub-study instances

substudies:
  - use: measurement-validity
  - use: default-latencies
  - use: load-scaling
  - use: kconfig-factors
  - use: mask-time
  - use: zephyr-versions

# The answer of the study: the central results of its sub-studies.
central_results:
  - {id: irq-entry-p99-direct, from: {substudy: default-latencies}}
  - {id: isr2thr-p99-sem, from: {substudy: default-latencies}}
  - {id: t2t-p99-sem, from: {substudy: default-latencies}}
  - {id: timer-slope, from: {substudy: load-scaling}}
  - {id: irq-ranking, from: {substudy: kconfig-factors}}
  - {id: wake-ranking, from: {substudy: kconfig-factors}}
  - {id: t2t-ranking, from: {substudy: kconfig-factors}}
  - {id: longest-by-load, from: {substudy: mask-time}}
