# Hypotheses of the study t2t-under-load. A hypothesis is one claim
# about a mechanism. Its checks test the claim on points, metrics and
# statistics. The hypothesis is wrong if one check is wrong.
#
# Each statement and each limit was written before the run of its
# experiment (in the comments of the experiment files). The basis texts
# were written on 2026-10-26, after the runs, from these comments. Where
# a comment gave no basis for a number, the basis text of the check
# starts with "Reconstruction:" or "Estimate.".
#
# The model of H1 (t2t-load-1m/experiment.md, from the review 2026-10-25
# §4 and §5): t2t(load) = t2t_fast(no load) + c x n. n is the number of
# timeouts that expire before the new slice deadline, c is the cost of
# one node of the DLIST walk.
#
# Keys of a hypothesis:
#   id         unique in the study
#   type       method: a property that the measurement method must have
#              model:  a prediction from the code or from a model of the kernel
#   statement  the claim, one or two sentences
#   basis      the mechanism and its sources
#   wrong_if   what a wrong hypothesis means for the study
#   checks     the tests of the claim
# Keys of a check:
#   id         unique in the hypothesis (a, b, ...)
#   formerly   the label in the old experiment comments, if it had one
#   written    date, and the run that came after it
#   experiment, select, metric, stat: the data that the check reads
#   expect     the comparison (forms: study-design.md §14.3)
#   manual     true: a person gives the verdict
#   basis      where the number of the check comes from
#
# Forms that are new in this file:
#   select: {axes: {<axis>: <value> or [<value>, ...]}}   the points with these axis values
#   order: {<axis>: [<value>, ...]}         for each value of the other axes, the stat increases in this order of the axis values
#   diff_to: {axes: {<axis>: <value>}, range: [lo, hi]}   value minus the value of the point that has this axis value and the same values on the other axes

hypotheses:
  - id: H1
    type: model
    statement: >
      Under load the t2t has one mode, and its p50 is linear in n:
      t2t_fast(no load) + c x n, with the same slope c for sem, mutex and
      msgq. Without load, most samples are in a slow mode; without time
      slicing, the p50 does not grow with the load.
    basis: >
      In each sample, the give resets the time slice of the taker
      (update_cache()). The reset inserts a timeout, and the DLIST insert
      walks the n timeouts that expire before the new slice deadline.
      When a timeout comes before the slice deadline, the slice abort and
      add do not reprogram SysTick. Without load, two SysTick reprograms
      give the slow mode. The walk is in the scheduler, not in
      the primitive. Without time slicing, the give inserts no slice
      timeout.
    wrong_if: >
      The model t2t(load) = t2t_fast(no load) + c x n is wrong. For
      example, the model of the slice reset does not apply to the thread
      to thread wake, or a loaded point has two modes. Or the slope
      differs between the primitives, or it is about 2c (two inserts per
      sample). Or the control without time slicing grows with the load;
      then the slice reset is not the cause.
    checks:
      - id: a
        formerly: t2t-load-1m/1
        written: 2026-10-25, before t2t-load-1m/20261025T193636Z
        experiment: t2t-load-1m
        select: {axes: {load: none, slicing: default}}
        metric: t2t
        manual: true
        statement: >
          Without load, the t2t has two modes: about 20 % of the samples in
          the fast mode and 80 % in the slow mode. The slow mode is about 640
          cycles above the fast mode (two SysTick reprograms).
        basis: >
          The model of the ISR to thread wake (review 2026-10-25 §4 and §5).
          Estimate. The comment gives no calculation for 20 %, 80 % and 640
          cycles.
      - id: b
        formerly: t2t-load-1m/2
        written: 2026-10-25, before t2t-load-1m/20261025T193636Z
        experiment: t2t-load-1m
        select: {axes: {slicing: default}}
        metric: t2t
        manual: true
        statement: >
          With each load of this experiment, the t2t has one mode (fast mode
          > 95 %). A timeout comes before the slice deadline, so the slice
          abort and add do not reprogram SysTick.
        basis: >
          Each load has timeouts that expire before the slice deadline (20 ms
          after the reset): timers with a period of 10..100 ms, sleepers of
          1..20 ms. Estimate. The comment gives no basis for 95 %.
      - id: c
        formerly: t2t-load-1m/3
        written: 2026-10-25, before t2t-load-1m/20261025T193636Z
        experiment: t2t-load-1m
        select: {axes: {load: t16}}
        metric: t2t
        stat: p50
        expect: {diff_to: {axes: {load: none}, range: [-490, -452]}}
        basis: >
          The model: n = 7.5 timeouts, c = 20..25 cycles. The no-load p50 is
          in the slow mode, 640 cycles above the fast mode (a). A loaded
          point is in the fast mode (b). Reconstruction: c x n - 640 gives
          -490..-452 cycles. The range does not include an error of the 640
          cycles.
      - id: d
        formerly: t2t-load-1m/3
        written: 2026-10-25, before t2t-load-1m/20261025T193636Z
        experiment: t2t-load-1m
        select: {axes: {load: sl8}}
        metric: t2t
        stat: p50
        expect: {diff_to: {axes: {load: none}, range: [-480, -440]}}
        basis: >
          As c, with n = 8. Reconstruction: c x n - 640 gives -480..-440
          cycles.
      - id: e
        formerly: t2t-load-1m/3
        written: 2026-10-25, before t2t-load-1m/20261025T193636Z
        experiment: t2t-load-1m
        select: {axes: {load: t64}}
        metric: t2t
        stat: p50
        expect: {diff_to: {axes: {load: none}, range: [-40, 110]}}
        basis: >
          As c, with n = 30. Reconstruction: c x n - 640 gives -40..110
          cycles.
      - id: f
        formerly: t2t-load-1m/3
        written: 2026-10-25, before t2t-load-1m/20261025T193636Z
        experiment: t2t-load-1m
        select: {axes: {load: sl64}}
        metric: t2t
        stat: p50
        expect: {diff_to: {axes: {load: none}, range: [640, 960]}}
        basis: >
          As c, with n = 64. Reconstruction: c x n - 640 gives 640..960
          cycles.
      - id: g
        formerly: t2t-load-1m/3
        written: 2026-10-25, before t2t-load-1m/20261025T193636Z
        experiment: t2t-load-1m
        select: {axes: {load: t256}}
        metric: t2t
        stat: p50
        expect: {diff_to: {axes: {load: none}, range: [1760, 2360]}}
        basis: >
          As c, with n = 120. Reconstruction: c x n - 640 gives
          1760..2360 cycles.
      - id: h
        formerly: t2t-load-1m/4
        written: 2026-10-25, before t2t-load-1m/20261025T193636Z
        experiment: t2t-load-1m
        select: {axes: {slicing: default}}
        metric: t2t
        stat: p50
        manual: true
        statement: >
          The p50 of t2t is linear in n, with the same slope c for sem, mutex
          and msgq. The differences between the primitives stay constant.
        basis: >
          The walk over the timeouts is in the scheduler (slice reset), not
          in the primitive. One slice reset per sample gives one insert.
      - id: i
        formerly: t2t-load-1m/5
        written: 2026-10-25, before t2t-load-1m/20261025T193636Z
        experiment: t2t-load-1m
        select: {point: sem-t256-noslice}
        metric: t2t
        stat: p50
        expect: {diff_to: {point: sem-none-noslice, range: [-30, 30]}}
        basis: >
          Without time slicing, the give inserts no slice timeout. Estimate.
          The comment gives no basis for 30 cycles.
      - id: j
        formerly: t2t-load-1m/5
        written: 2026-10-25, before t2t-load-1m/20261025T193636Z
        experiment: t2t-load-1m
        select: {point: sem-sl64-noslice}
        metric: t2t
        stat: p50
        expect: {diff_to: {point: sem-none-noslice, range: [-30, 30]}}
        basis: As i.

  - id: H2
    type: model
    statement: >
      The tail (p99.99) of t2t grows with the number of timers and with
      the number of sleepers: the SysTick ISR preempts the threads, as in
      the wake data.
    basis: >
      The SysTick ISR runs the expiry functions of the timers
      (wake-timers-1m). Each sleep of a sleeper adds a timeout that
      expires in the SysTick ISR.
    wrong_if: The SysTick ISR does not set the tail of the thread to thread wake.
    checks:
      - id: a
        formerly: t2t-load-1m/6
        written: 2026-10-25, before t2t-load-1m/20261025T193636Z
        experiment: t2t-load-1m
        select: {axes: {slicing: default}}
        metric: t2t
        stat: p99.99
        expect: {order: {load: [none, t16, t64, t256]}}
        basis: The SysTick ISR runs the expiry functions of the timers (wake-timers-1m).
      - id: b
        formerly: t2t-load-1m/6
        written: 2026-10-25, before t2t-load-1m/20261025T193636Z
        experiment: t2t-load-1m
        select: {axes: {slicing: default}}
        metric: t2t
        stat: p99.99
        expect: {order: {load: [none, sl8, sl64]}}
        basis: As a. Each sleep of a sleeper adds a timeout that expires in the SysTick ISR.
