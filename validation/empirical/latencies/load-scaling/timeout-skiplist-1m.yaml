# Description: timeout-skiplist-1m.md.

name: timeout-skiplist-1m
app: wake_latency
trees: [ws-up]
repeat: 1
timeout: 1200

common:
  kconfig:
    LATBENCH_SAMPLES: 1000000
    LATBENCH_WAKE_SEM: y
    LATBENCH_HIST_BINS: 2048
    LATBENCH_HIST_COARSE_BINS: 2048
    LATBENCH_LOAD_TIMERS: 256

axes:
  backend:                  # the axis of timeout-backends-1m
    skiplist: {kconfig: {TIMEOUT_BACKEND_SKIPLIST: y}}
