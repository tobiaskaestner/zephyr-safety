# Description: t2t-load-1m.md. Hypotheses: hypotheses.yaml.

name: t2t-load-1m
app: thread_latency
trees: [ws-up]
repeat: 1
timeout: 1500

common:
  kconfig:
    LATBENCH_SAMPLES: 1000000
    LATBENCH_STIM_MIN_US: 50
    LATBENCH_STIM_MAX_US: 150
    LATBENCH_HIST_BINS: 2048
    LATBENCH_HIST_COARSE_BINS: 2048
    LATBENCH_CODE_RAM: y     # hot code in the CCM SRAM

axes:
  primitive:
    sem: {kconfig: {LATBENCH_T2T_SEM: y}}
    mutex: {kconfig: {LATBENCH_T2T_MUTEX: y}}
    msgq: {kconfig: {LATBENCH_T2T_MSGQ: y}}
  load:
    none: {}
    t16:
      kconfig: {LATBENCH_LOAD_TIMERS: 16}
    t64:
      kconfig: {LATBENCH_LOAD_TIMERS: 64}
    t256:
      kconfig: {LATBENCH_LOAD_TIMERS: 256}
    sl8:
      kconfig: {LATBENCH_LOAD_THREAD_SLEEPER: y, LATBENCH_LOAD_THREADS: 8}
    sl64:
      kconfig: {LATBENCH_LOAD_THREAD_SLEEPER: y, LATBENCH_LOAD_THREADS: 64}

# The control without time slicing changes only the axis slicing.
extra_axes: {slicing: default}

points:
  - id: sem-none-noslice
    axes: {primitive: sem, load: none, slicing: noslice}
    kconfig: {LATBENCH_T2T_SEM: y, TIMESLICING: n}
  - id: sem-t256-noslice
    axes: {primitive: sem, load: t256, slicing: noslice}
    kconfig: {LATBENCH_T2T_SEM: y, TIMESLICING: n, LATBENCH_LOAD_TIMERS: 256}
  - id: sem-sl64-noslice
    axes: {primitive: sem, load: sl64, slicing: noslice}
    kconfig: {LATBENCH_T2T_SEM: y, TIMESLICING: n, LATBENCH_LOAD_THREAD_SLEEPER: y, LATBENCH_LOAD_THREADS: 64}
