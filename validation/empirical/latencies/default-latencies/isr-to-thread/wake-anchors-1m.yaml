# Description: wake-anchors-1m.md. Hypotheses: none.

name: wake-anchors-1m
app: wake_latency
trees: [ws-safety, ws-up]
repeat: 1
timeout: 900

common:
  kconfig:
    LATBENCH_SAMPLES: 1000000
    LATBENCH_WAKE_SEM: y

axes:
  anchor:
    default: {}
    noslice:
      kconfig: {TIMESLICING: n}
    lean:
      conf_files: [common/conf/lean.conf]   # no time slicing, no stack guard, -O2
  arch:
    legacy: {}
    switch:
      conf_files: [common/conf/use_switch.conf]
