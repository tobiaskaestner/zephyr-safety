# Hypotheses of the study thread-to-thread. Each statement and each
# limit was written before the run of its experiment (in the comments of
# the experiment files). The basis texts were written on 2026-10-26,
# after the runs, from these comments. Where a comment gave no basis for
# a number, the basis text starts with "Reconstruction:" or "Estimate.".
# The comments have no "Wrong if" text. Each wrong_if says which part of
# the basis is then wrong.
#
# Keys:
#   id         unique in the study
#   formerly   the id in the earlier experiment files and notes
#   type       method: a property that the measurement method must have
#              model:  a prediction from the code or from a model of the kernel
#   written    date, and the run that came after it
#   statement  the hypothesis, one or two sentences
#   basis      where each number comes from
#   experiment, select, metric, stat: the data that the check reads
#   expect     the check (the comparison forms: study-design.md §14.4)
#   manual     true: a person gives the verdict
#   wrong_if   what a wrong hypothesis means for the study

hypotheses:
  # -------------------------------------------------- thread2thread-switch
  - id: H1
    type: model
    written: 2026-10-25, before thread2thread-switch/20261025T100427Z
    statement: >
      With USE_SWITCH=y the wake has the same two modes as with PendSV:
      about 20 % of the samples without a SysTick reprogram, about 80 %
      with two.
    basis: >
      The slice reset is in update_cache() and does not depend on the
      arch interface. The 20 % and 80 % are the shares with PendSV in
      the earlier runs. The comment gives no tolerance for "about".
    experiment: thread2thread-switch
    select: {point: [sem-switch, mutex-switch]}
    metric: t2t
    manual: true
    wrong_if: The slice reset is not the only cause of the two modes, or it depends on the arch interface.

  - id: H2a
    type: model
    written: 2026-10-25, before thread2thread-switch/20261025T100427Z
    statement: >
      The thread switch costs more with USE_SWITCH=y than with PendSV:
      the mean t2t of sem-switch is larger than the mean of sem-legacy.
    basis: >
      wake-anchors-1m: USE_SWITCH=y adds about 280 cycles per ISR wake.
      The comment gives no value for the thread to thread wake.
    experiment: thread2thread-switch
    metric: t2t
    stat: mean
    expect: {order: [sem-legacy, sem-switch]}
    wrong_if: The cost of USE_SWITCH=y in wake-anchors-1m is not in the switch itself.

  - id: H2b
    type: model
    written: 2026-10-25, before thread2thread-switch/20261025T100427Z
    statement: As H2a, for the mutex.
    basis: As H2a.
    experiment: thread2thread-switch
    metric: t2t
    stat: mean
    expect: {order: [mutex-legacy, mutex-switch]}
    wrong_if: As H2a.
