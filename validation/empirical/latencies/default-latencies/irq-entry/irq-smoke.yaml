# Description: irq-smoke.md. Hypotheses: hypotheses.yaml.

name: irq-smoke
app: irq_latency
trees: [ws-safety]
repeat: 1
timeout: 400

# No cube: the four paths with an idle CPU, and the direct path with a busy CPU.
extra_axes: {path: stock, background: idle}

points:
  - id: stock-idle
    axes: {path: stock, background: idle}
    kconfig: {LATBENCH_IRQ_PATH_STOCK: y}
  - id: wrapped-idle
    axes: {path: wrapped, background: idle}
    kconfig: {LATBENCH_IRQ_PATH_WRAPPED: y}
  - id: direct-idle
    axes: {path: direct, background: idle}
    kconfig: {LATBENCH_IRQ_PATH_DIRECT: y}
  - id: zli-idle
    axes: {path: zli, background: idle}
    kconfig: {LATBENCH_IRQ_PATH_ZLI: y}
  - id: direct-busy
    axes: {path: direct, background: busy}
    kconfig: {LATBENCH_IRQ_PATH_DIRECT: y, LATBENCH_BG_BUSY: y}
