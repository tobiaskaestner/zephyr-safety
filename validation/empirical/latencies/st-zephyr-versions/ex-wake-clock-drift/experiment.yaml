# Description: experiment.md. Hypotheses:
# st-measurement-validity/st-clock-drift/hypotheses.yaml.

name: wake-clock-drift
app: wake_latency
trees: [ws-up]
repeat: 1
timeout: 400

common:
  kconfig:
    LATBENCH_SAMPLES: 200000
    LATBENCH_WAKE_SEM: y

axes:
  anchor:
    default: {}
    noslice:
      kconfig: {TIMESLICING: n}
    switch:
      conf_files: [common/conf/use_switch.conf]
  timers:
    t0: {value: 0}
    t16:
      value: 16
      kconfig: {LATBENCH_LOAD_TIMERS: 16}
