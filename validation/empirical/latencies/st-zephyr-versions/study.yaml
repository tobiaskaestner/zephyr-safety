# The files of this study, by convention (no keys):
#   ex-<experiment>/experiment.yaml   an experiment that it owns
#   ex-<experiment>/experiment.md     its description
#   hypotheses.yaml                   the hypotheses, written before the runs
#
# This study owns the experiments that ran on more than one Zephyr tree.
# For now each runs on one tree, ws-up. The other studies read them with
# imports. Later the experiments get one tree for each Zephyr version
# of the comparison (for example v3.7, v4.0, v4.4, v4.5).

name: zephyr-versions
question: >
  How do the three latencies (IRQ entry, ISR to thread, thread to
  thread) and their growth with the load change from one Zephyr version
  to the next?

experiments:
  - irq-baseline-1m
  - wake-anchors-1m
  - thread-baseline-1m
  - thread-switch
  - wake-systick-prio-1m
  - wake-timeout-backends-1m
  - wake-threads-1m
  - wake-timers-1m
  - wake-clock-drift
  - wake-clock-drift-layout
  - wake-code-place-q4-up

# H1 compares wake-code-place-q4-up with wake-code-place-q4 at the same point.
imports:
  - {study: measurement-validity/code-placement, experiment: wake-code-place-q4, mode: reuse}

# The results that answer the question. For now all are characterisation:
# measured values. There are no requirement limits yet.
#
# Keys:
#   id         unique in the study
#   statement  the result as a sentence; {name} is a value of the result
#   from       the data: experiment, point, metric, or hypotheses
#   stat       the statistic (doc/benchmark-guide/reference/central-results.rst)
#   unit       the unit of the values
#
# Statistics:
#   tree_diff: s   s of ws-up (wake-code-place-q4-up) - s of ws-safety (wake-code-place-q4), same point.
#                  The tree names are fixed in the tools; a comparison of
#                  versions needs a new form of this statistic.
central_results:
  - id: tree-diff
    statement: >
      At the point {point}, the {metric} p50 of ws-up minus that of
      ws-safety is {tree_diff:+.0f} cycles.
    from: {experiment: [wake-code-place-q4, wake-code-place-q4-up], point: [f0-default, f4-default, r0-default, r4-default,
                                                                   f0-noslice, f4-noslice, r0-noslice, r4-noslice],
           metric: [irq, isr2thr]}
    stat: {tree_diff: p50}
    unit: cycles
