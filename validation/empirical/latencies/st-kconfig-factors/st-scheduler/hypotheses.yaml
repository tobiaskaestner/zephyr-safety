# Hypotheses of the study scheduler. A hypothesis is one claim about a
# mechanism. Its checks test the claim on points, metrics and
# statistics. The hypothesis is wrong if one check is wrong.
#
# Each statement and each limit was written before the run of its
# experiment (in the comments of the experiment files). The basis texts
# were written on 2026-10-26, after the runs, from these comments. Where
# a comment gave no basis for a number, the basis text of the check
# starts with "Reconstruction:" or "Estimate.".
#
# The experiments are in the parent study kconfig-factors
# (../wp3-variants.md gives the variants). The comments did not number
# the predictions, so no check has the key "formerly". The checks compare
# a point with the point "baseline" (or "baseline-busy16") of the same
# run.
#
# Keys of a hypothesis:
#   id         unique in the study
#   type       method: a property that the measurement method must have
#              model:  a prediction from the code or from a model of the kernel
#   statement  the claim, one or two sentences
#   basis      the mechanism and its sources
#   wrong_if   what a wrong hypothesis means for the study
#   checks     the tests of the claim
# Keys of a check:
#   id         unique in the hypothesis (a, b, ...)
#   formerly   the label in the old experiment comments, if it had one
#   written    date, and the run that came after it
#   experiment, select, metric, stat: the data that the check reads
#   expect     the comparison (forms: doc/benchmark-guide/reference/check-forms.rst)
#   manual     true: a person gives the verdict
#   basis      where the number of the check comes from
#
# New forms of this study:
#   expect diff_change: {point: P, of: [Q, R], range: [lo, hi]}: (value - value of P) - (value of Q - value of R) in one run. null: no limit.

hypotheses:
  - id: H1
    type: model
    statement: >
      SCHED_SCALABLE adds a constant 50..200 cycles to the ISR to thread
      wake and to the thread to thread latency, also with 16 busy threads,
      and nothing to the IRQ entry. SCHED_MULTIQ changes the wake paths by
      less than 30 cycles and the IRQ entry by at most 2 cycles.
    basis: >
      With SCHED_SCALABLE, the run queue is a red-black tree, with a cost
      of log N. With SCHED_MULTIQ, the run queue is one list for each
      priority. The IRQ entry path has no scheduler.
    wrong_if: >
      The scheduler is on the IRQ entry path, or the code placement in the
      CCM SRAM moves the irq p50. The cost of the red-black tree or of the
      list for each priority is not as expected. The cost of
      SCHED_SCALABLE increases linearly with the number of busy threads.
    checks:
      - id: a
        written: 2026-10-25, before wp3-irq-1m/20261025T223624Z
        experiment: wp3-irq-1m
        select: {point: scalable}
        metric: irq
        stat: p50
        expect: {diff_to: {point: baseline, range: [-2, 2]}}
        basis: >
          The IRQ entry path has no scheduler. Estimate. The comment gives no
          basis for the 2 cycles.
      - id: b
        written: 2026-10-25, before wp3-irq-1m/20261025T223624Z
        experiment: wp3-irq-1m
        select: {point: multiq}
        metric: irq
        stat: p50
        expect: {diff_to: {point: baseline, range: [-2, 2]}}
        basis: As a.
      - id: c
        written: 2026-10-25, before wp3-wake-1m/20261025T205806Z
        experiment: wp3-wake-1m
        select: {point: scalable}
        metric: isr2thr
        stat: p50
        expect: {diff_to: {point: baseline, range: [50, 200]}}
        basis: >
          The run queue is a red-black tree, not a list. Estimate. The
          comment gives no basis for 50..200. The comment names no statistic,
          so the check uses the p50.
      - id: d
        written: 2026-10-25, before wp3-wake-1m/20261025T205806Z
        experiment: wp3-wake-1m
        select: {point: scalable-busy16}
        metric: isr2thr
        stat: p50
        expect: {diff_change: {point: baseline-busy16, of: [scalable, baseline], range: [null, 40]}}
        basis: >
          A red-black tree has a cost of log N. Estimate. The comment gives
          no basis for 40. Reconstruction: "more than with none" is read as
          the change of the cost of SCHED_SCALABLE against SCHED_SIMPLE from
          0 to 16 busy threads. The check uses the p50, as c.
      - id: e
        written: 2026-10-25, before wp3-wake-1m/20261025T205806Z
        experiment: wp3-wake-1m
        select: {point: multiq}
        metric: isr2thr
        stat: p50
        expect: {diff_to: {point: baseline, range: [-30, 30]}}
        basis: >
          Estimate. The comment gives no basis for 30. The comment names no
          statistic, so the check uses the p50.
      - id: f
        written: 2026-10-25, before wp3-wake-1m/20261025T205806Z
        experiment: wp3-wake-1m
        select: {point: multiq-busy16}
        metric: isr2thr
        stat: p50
        expect: {diff_to: {point: baseline-busy16, range: [-30, 30]}}
        basis: As e.
      - id: g
        written: 2026-10-25, before wp3-t2t-1m/20261025T203235Z
        experiment: wp3-t2t-1m
        select: {point: scalable}
        metric: t2t
        stat: p50
        expect: {diff_to: {point: baseline, range: [50, 200]}}
        basis: As c.
      - id: h
        written: 2026-10-25, before wp3-t2t-1m/20261025T203235Z
        experiment: wp3-t2t-1m
        select: {point: multiq}
        metric: t2t
        stat: p50
        expect: {diff_to: {point: baseline, range: [-30, 30]}}
        basis: As e.

  - id: H2
    type: model
    statement: >
      16 busy threads add a constant cost of about 400 cycles to the ISR
      to thread wake. The cost comes from the slice of the busy thread,
      not from the ready queue, so it does not depend on the number of
      busy threads (O(1) in N).
    basis: >
      Time slicing: the kernel slices the busy thread, which adds one slice
      abort and one add for each wake. The busy threads have a lower
      priority than the woken thread, so the sorted insert of SCHED_SIMPLE
      stops at once.
    wrong_if: The cost of the busy threads is not the slice, or it depends on N.
    checks:
      - id: a
        written: 2026-10-25, before wp3-wake-1m/20261025T205806Z
        experiment: wp3-wake-1m
        manual: true
        statement: >
          16 busy threads increase the isr2thr by about 400 cycles. The value
          is the same for 2..64 busy threads (O(1) in N). This experiment has
          16 busy threads only. wake-threads-1m has 2..64.
        basis: >
          The kernel slices the busy thread: one more slice abort and one
          more add for each wake (review of 2026-10-25, §5). The busy threads
          have priority 5, lower than the woken thread. Thus the sorted
          insert of SCHED_SIMPLE stops at once.
