# Hypotheses of the study stack-guard. A hypothesis is one claim about a
# mechanism. Its checks test the claim on points, metrics and
# statistics. The hypothesis is wrong if one check is wrong.
#
# Each statement and each limit was written before the run of its
# experiment (in the comments of the experiment files). The basis texts
# were written on 2026-10-26, after the runs, from these comments. Where
# a comment gave no basis for a number, the basis text of the check
# starts with "Reconstruction:" or "Estimate.".
#
# The experiments are in the parent study kconfig-factors
# (../wp3-variants.md gives the variants and the Kconfig trap of the
# variant no-mpu-guard). The comments did not number the predictions, so
# no check has the key "formerly". The checks compare a point with the
# point "baseline" of the same run.
#
# Keys of a hypothesis:
#   id         unique in the study
#   type       method: a property that the measurement method must have
#              model:  a prediction from the code or from a model of the kernel
#   statement  the claim, one or two sentences
#   basis      the mechanism and its sources
#   wrong_if   what a wrong hypothesis means for the study
#   checks     the tests of the claim
# Keys of a check:
#   id         unique in the hypothesis (a, b, ...)
#   formerly   the label in the old experiment comments, if it had one
#   written    date, and the run that came after it
#   experiment, select, metric, stat: the data that the check reads
#   expect     the comparison (forms: doc/benchmark-guide/reference/check-forms.rst)
#   manual     true: a person gives the verdict
#   basis      where the number of the check comes from

hypotheses:
  - id: H1
    type: model
    statement: >
      Without the MPU stack guard, PendSV skips the update of the MPU
      region, so the isr2thr and t2t p50 decrease by 100..250 cycles. The
      IRQ entry has no thread switch, so the irq p50 does not change (+-2
      cycles).
    basis: >
      PendSV updates the MPU region of the stack guard at each thread
      switch. Each wake and each t2t sample has one thread switch. The IRQ
      entry path has no scheduler and no FP context.
    wrong_if: >
      The stack guard changes the IRQ entry path. The wake changes by less
      than 50 cycles. Then the MPU region update is not a large part of
      the thread switch.
    checks:
      - id: a
        written: 2026-10-25, before wp3-irq-1m/20261025T223624Z
        experiment: irq-kconfig-1m
        select: {point: no-mpu-guard}
        metric: irq
        stat: p50
        expect: {diff_to: {point: baseline, range: [-2, 2]}}
        basis: >
          The IRQ entry path has no scheduler and no FP context (the comment
          gives this reason for the variants scalable, multiq, fpu-sharing
          and no-mpu-guard together). Estimate. The comment gives no basis
          for the 2 cycles.
      - id: b
        written: 2026-10-25, before wp3-wake-1m/20261025T205806Z
        experiment: wake-kconfig-1m
        select: {point: no-mpu-guard}
        metric: isr2thr
        stat: p50
        expect: {diff_to: {point: baseline, range: [-250, -100]}}
        basis: >
          PendSV skips the update of the MPU region. Estimate. The comment
          gives no basis for 100..250. The comment names no statistic, so
          the check uses the p50.
      - id: c
        written: 2026-10-25, before wp3-t2t-1m/20261025T203235Z
        experiment: thread-kconfig-1m
        select: {point: no-mpu-guard}
        metric: t2t
        stat: p50
        expect: {diff_to: {point: baseline, range: [-250, -100]}}
        basis: >
          One thread switch for each sample, and PendSV skips the update of the
          MPU region (as b). Estimate. The comment gives no basis for
          100..250.
