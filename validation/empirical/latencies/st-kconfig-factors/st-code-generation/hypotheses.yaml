# Hypotheses of the study code-generation. A hypothesis is one claim
# about a mechanism. Its checks test the claim on points, metrics and
# statistics. The hypothesis is wrong if one check is wrong.
#
# Each statement and each limit was written before the run of its
# experiment (in the comments of the experiment files). The basis texts
# were written on 2026-10-26, after the runs, from these comments. Where
# a comment gave no basis for a number, the basis text of the check
# starts with "Reconstruction:" or "Estimate.".
#
# The experiments are in the parent study kconfig-factors
# (../wp3-variants.md gives the variants). The comments did not number
# the predictions, so no check has the key "formerly". The checks compare
# a point with the point "baseline" (or "assert") of the same run.
#
# Keys of a hypothesis:
#   id         unique in the study
#   type       method: a property that the measurement method must have
#              model:  a prediction from the code or from a model of the kernel
#   statement  the claim, one or two sentences
#   basis      the mechanism and its sources
#   wrong_if   what a wrong hypothesis means for the study
#   checks     the tests of the claim
# Keys of a check:
#   id         unique in the hypothesis (a, b, ...)
#   formerly   the label in the old experiment comments, if it had one
#   written    date, and the run that came after it
#   experiment, select, metric, stat: the data that the check reads
#   expect     the comparison (forms: doc/benchmark-guide/reference/check-forms.rst)
#   manual     true: a person gives the verdict
#   basis      where the number of the check comes from

hypotheses:
  - id: H1
    type: model
    statement: >
      SPEED_OPTIMIZATIONS makes the kernel paths faster: the isr2thr and
      t2t p50 decrease by 10..25 %. The irq p50 decreases by 0..10 cycles
      only, because the hardware does most of the IRQ entry.
    basis: >
      The compiler optimizes for speed, not for size (../wp3-variants.md).
      The hardware does most of the IRQ entry, so the compiler has little
      code to change there.
    wrong_if: >
      The IRQ entry has more software than expected, or the compiler
      optimization has less or more effect on the wake paths than
      expected.
    checks:
      - id: a
        written: 2026-10-25, before wp3-irq-1m/20261025T223624Z
        experiment: wp3-irq-1m
        select: {point: speed-opt}
        metric: irq
        stat: p50
        expect: {diff_to: {point: baseline, range: [-10, 0]}}
        basis: >
          Estimate. The hardware does most of the IRQ entry, so the compiler
          has little code to change.
      - id: b
        written: 2026-10-25, before wp3-wake-1m/20261025T205806Z
        experiment: wp3-wake-1m
        select: {point: speed-opt}
        metric: isr2thr
        stat: p50
        expect:
          ratio_to: {point: baseline, stat: p50}
          range: [0.75, 0.90]
        basis: >
          Estimate. The comment gives no basis. The comment names no
          statistic, so the check uses the p50.
      - id: c
        written: 2026-10-25, before wp3-t2t-1m/20261025T203235Z
        experiment: wp3-t2t-1m
        select: {point: speed-opt}
        metric: t2t
        stat: p50
        expect:
          ratio_to: {point: baseline, stat: p50}
          range: [0.75, 0.90]
        basis: As b.

  - id: H2
    type: model
    statement: >
      The kernel assertions make the paths slower. ASSERT increases the
      isr2thr and t2t p50 by 5..15 %, and SPIN_VALIDATE adds 100..150
      cycles more. On the IRQ entry, both increase the p50 by 0..10 cycles
      and make the max a little higher.
    basis: >
      ASSERT adds checks to the kernel code, also in the sections with
      locked interrupts. SPIN_VALIDATE adds a check to each spinlock pair.
    wrong_if: >
      The assertions are on the IRQ entry path, or they are not in the
      sections with locked interrupts. The assertions on the wake paths
      cost less or more than expected. The number of spinlock pairs or the
      cost of one check is not as expected.
    checks:
      - id: a
        written: 2026-10-25, before wp3-irq-1m/20261025T223624Z
        experiment: wp3-irq-1m
        select: {point: assert}
        metric: irq
        stat: p50
        expect: {diff_to: {point: baseline, range: [0, 10]}}
        basis: Estimate. The comment gives no basis for the 10 cycles.
      - id: b
        written: 2026-10-25, before wp3-irq-1m/20261025T223624Z
        experiment: wp3-irq-1m
        select: {point: assert-spin}
        metric: irq
        stat: p50
        expect: {diff_to: {point: baseline, range: [0, 10]}}
        basis: As a.
      - id: c
        written: 2026-10-25, before wp3-irq-1m/20261025T223624Z
        experiment: wp3-irq-1m
        metric: irq
        stat: max
        expect: {order: [baseline, assert]}
        basis: The assertions make the sections with locked interrupts longer.
      - id: d
        written: 2026-10-25, before wp3-irq-1m/20261025T223624Z
        experiment: wp3-irq-1m
        metric: irq
        stat: max
        expect: {order: [baseline, assert-spin]}
        basis: As c.
      - id: e
        written: 2026-10-25, before wp3-wake-1m/20261025T205806Z
        experiment: wp3-wake-1m
        select: {point: assert}
        metric: isr2thr
        stat: p50
        expect:
          ratio_to: {point: baseline, stat: p50}
          range: [1.05, 1.15]
        basis: >
          Estimate. The comment gives no basis. The comment names no
          statistic, so the check uses the p50.
      - id: f
        written: 2026-10-25, before wp3-wake-1m/20261025T205806Z
        experiment: wp3-wake-1m
        select: {point: assert-spin}
        metric: isr2thr
        stat: p50
        expect: {diff_to: {point: assert, range: [100, 150]}}
        basis: >
          About 3..4 spinlock pairs for each wake, 25..40 cycles each.
          Reconstruction: the product is 75..160 cycles. The comment gives
          100..150 with no reason for the smaller range. The comment names no
          statistic, so the check uses the p50.
      - id: g
        written: 2026-10-25, before wp3-t2t-1m/20261025T203235Z
        experiment: wp3-t2t-1m
        select: {point: assert}
        metric: t2t
        stat: p50
        expect:
          ratio_to: {point: baseline, stat: p50}
          range: [1.05, 1.15]
        basis: As e.
      - id: h
        written: 2026-10-25, before wp3-t2t-1m/20261025T203235Z
        experiment: wp3-t2t-1m
        select: {point: assert-spin}
        metric: t2t
        stat: p50
        expect: {diff_to: {point: assert, range: [100, 150]}}
        basis: >
          Estimate. The comment gives no basis for the thread to thread
          path. The comment names no statistic, so the check uses the p50.

  - id: H3
    type: model
    statement: >
      FPU_SHARING increases the isr2thr and t2t p50 by 0..30 cycles,
      because PendSV examines one bit for the FP context. The IRQ entry
      saves no FP context, so the irq p50 does not change (+-2 cycles).
    basis: >
      PendSV examines the FP bit of EXC_RETURN. The IRQ entry path saves
      no FP context.
    wrong_if: >
      The FPU settings change the IRQ entry path, or the FP context costs
      more than the check of one bit.
    checks:
      - id: a
        written: 2026-10-25, before wp3-irq-1m/20261025T223624Z
        experiment: wp3-irq-1m
        select: {point: fpu-sharing}
        metric: irq
        stat: p50
        expect: {diff_to: {point: baseline, range: [-2, 2]}}
        basis: >
          The IRQ entry path saves no FP context. Estimate. The comment gives
          no basis for the 2 cycles.
      - id: b
        written: 2026-10-25, before wp3-wake-1m/20261025T205806Z
        experiment: wp3-wake-1m
        select: {point: fpu-sharing}
        metric: isr2thr
        stat: p50
        expect: {diff_to: {point: baseline, range: [0, 30]}}
        basis: >
          PendSV examines the FP bit of EXC_RETURN. Estimate. The comment
          gives no basis for 30. The comment names no statistic, so the
          check uses the p50.
      - id: c
        written: 2026-10-25, before wp3-t2t-1m/20261025T203235Z
        experiment: wp3-t2t-1m
        select: {point: fpu-sharing}
        metric: t2t
        stat: p50
        expect: {diff_to: {point: baseline, range: [0, 30]}}
        basis: As b.
