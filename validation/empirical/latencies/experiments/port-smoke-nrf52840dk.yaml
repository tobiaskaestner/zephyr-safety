# Smoke test of the nrf52840dk board port: wake_latency with the defaults, on
# both trees. It checks that run.py builds, flashes and reads the board.

name: port-smoke-nrf52840dk
board: nrf52840dk/nrf52840
app: wake_latency
trees: [ws-safety, ws-up]
repeat: 1
timeout: 400

common:
  kconfig:
    LATBENCH_SAMPLES: 10000

points:
  - id: default
