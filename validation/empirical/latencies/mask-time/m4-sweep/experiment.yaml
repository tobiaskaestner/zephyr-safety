# Description: experiment.md. Hypotheses: ../hypotheses.yaml.

# The latency histograms of these runs are not data (LAT META m4=1).
name: m4-sweep
app: wake_latency
trees: [ws-up-irqoff]
repeat: 1
timeout: 600

common:
  kconfig:
    ARM_IRQ_MASK_HOOKS: y
    ARM_IRQ_MASK_HOOKS_ISR: y
    LATBENCH_SAMPLES: 200000
    LATBENCH_WAKE_SEM: y
    LATBENCH_HIST_BINS: 1024
    LATBENCH_HIST_COARSE_BINS: 1024
    LATBENCH_HIST_COARSE_SHIFT: 6

axes:
  timers:                   # periodic k_timers, 10..100 ms, random start
    t0: {value: 0}
    t16:
      value: 16
      kconfig: {LATBENCH_LOAD_TIMERS: 16}
    t64:
      value: 64
      kconfig: {LATBENCH_LOAD_TIMERS: 64}
    t256:
      value: 256
      kconfig: {LATBENCH_LOAD_TIMERS: 256}
  sleepers:                 # sleeper threads, 1..20 ms sleeps, priority 5
    s0: {value: 0}
    s8:
      value: 8
      kconfig: {LATBENCH_LOAD_THREADS: 8, LATBENCH_LOAD_THREAD_SLEEPER: y}
    s64:
      value: 64
      kconfig: {LATBENCH_LOAD_THREADS: 64, LATBENCH_LOAD_THREAD_SLEEPER: y}
  slice:
    slice: {}               # TIMESLICING=y (default, 20 ms)
    noslice:
      kconfig: {TIMESLICING: n}

# Checks of each run. A run that fails one gets the role "excluded".
acceptance:
  # m4-sweep/7, written 2026-10-25, before m4-sweep/20261026T000640Z: each
  # start hook has one end hook (m4.rst), apart from the start-up, and the
  # site table has room for all sites (fewer than 64).
  - {id: A1, metric: [meta.m4_unmatched_end, meta.m4_begin_open, meta.dropped], stat: value, expect: {range: [0, 0]}}
