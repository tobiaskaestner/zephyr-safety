# Hypotheses of the study mask-time. Each statement and each limit was
# written before the run of its experiment (in the comments of the
# experiment files). The basis texts were written on 2026-10-26, after
# the runs, from these comments and the notes that they name. Where a
# comment gave no basis for a number, the basis text starts with
# "Reconstruction:" or "Estimate.".
#
# Keys:
#   id         unique in the study
#   formerly   the id in the earlier experiment files and notes
#   type       method: a property that the measurement method must have
#              model:  a prediction from the code or from a model of the kernel
#   written    date, and the run that came after it
#   statement  the hypothesis, one or two sentences
#   basis      where each number comes from
#   experiment, select, metric, stat: the data that the check reads
#   expect     the check (the comparison forms: study-design.md §14.4)
#   manual     true: a person gives the verdict
#   wrong_if   what a wrong hypothesis means for the study
#
# Forms that are new in this file:
#   metric m4.<kind>[.<ctx>][<function>]  the M4 sites of a kind (mask, isr), context (t, e14, e15, e22 = EXTI0) and function (the place in the m4.py table)
#   metric meta.<name>                    a value of a LAT META line, or used and dropped of the LAT M4 BEGIN line
#   metric meta.m4_masked_share           m4_masked_cyc / m4_window_cyc of the log
#   stat value                            the value of a meta metric (one for each point)
#   stat max_net                          max of a site minus m4_floor_cyc of the same log (m4.py)
#   stat max(x), n over several sites     the largest x of the sites; the sum of the section counts (0 if there is no site)
#   stat top_place                        the function of the mask site with the largest max_net
#   expect {equals: x}                    the stat is x
#   select {<axis>: <value>, ...}         the points with these axis values; each point is checked

hypotheses:
  # ---------------------------------------------------------------- m4-sweep
  - id: H1
    formerly: m4-sweep/1
    type: model
    written: 2026-10-25, before m4-sweep/20261026T000640Z
    statement: The longest mask section is in z_add_timeout.
    basis: >
      The DLIST insert walks over each timeout that expires before the new
      one, with the timeout lock held. The lock is inlined in
      z_add_timeout, so all callers share one site. The context splits
      them: SysTick = the timer restarts and the sleeper wakes, irq6
      (EXTI0, e22) = the slice reset in the give of the EXTI0 ISR, thread
      = the slice reset at a switch and k_sleep.
    experiment: m4-sweep
    metric: m4.mask
    stat: top_place
    expect: {equals: z_add_timeout}
    wrong_if: Another site masks longer than the timeout insert.

  - id: H2
    formerly: m4-sweep/1
    type: model
    written: 2026-10-25, before m4-sweep/20261026T000640Z
    statement: >
      The max of z_add_timeout grows about linearly with the number of
      timeouts in the queue: about 300 + 25 x (timers + sleepers). Thus
      t16 gives about 700 and s64 about 1900.
    basis: >
      Estimate. The walk costs about 25 cycles for each timeout: the ISR
      to thread p50 grows by about 20..25 cycles for each timer or
      sleeper (review-2026-10-25 §4 and §5). The comment gives no basis
      for the 300 cycles.
    experiment: m4-sweep
    manual: true
    wrong_if: The model of the DLIST insert walk is not correct.

  - id: H3
    formerly: m4-sweep/1
    type: model
    written: 2026-10-25, before m4-sweep/20261026T000640Z
    statement: Without timers and sleepers, the longest mask section is below 1000.
    basis: >
      Estimate. The formula of H2 gives about 300. The comment gives no
      basis for the limit of 1000.
    experiment: m4-sweep
    select: {timers: t0, sleepers: s0}
    metric: m4.mask
    stat: max(max_net)
    expect: {range: [0, 999]}
    wrong_if: A long mask section occurs also without timeouts in the queue.

  - id: H4
    formerly: m4-sweep/1
    type: model
    written: 2026-10-25, before m4-sweep/20261026T000640Z
    statement: At 64 timers and no sleepers, the longest mask section is 1800..2600.
    basis: >
      Reconstruction: the formula of H2 gives 1900. The comment gives no
      basis for the width of the range.
    experiment: m4-sweep
    select: {timers: t64, sleepers: s0}
    metric: m4.mask
    stat: max(max_net)
    expect: {range: [1800, 2600]}
    wrong_if: The model of the DLIST insert walk is not correct.

  - id: H5
    formerly: m4-sweep/1
    type: model
    written: 2026-10-25, before m4-sweep/20261026T000640Z
    statement: At 256 timers and no sleepers, the longest mask section is 6300..7500.
    basis: >
      Reconstruction: the formula of H2 gives 6700. The comment gives no
      basis for the width of the range.
    experiment: m4-sweep
    select: {timers: t256, sleepers: s0}
    metric: m4.mask
    stat: max(max_net)
    expect: {range: [6300, 7500]}
    wrong_if: The model of the DLIST insert walk is not correct.

  - id: H6
    formerly: m4-sweep/2
    type: model
    written: 2026-10-25, before m4-sweep/20261026T000640Z
    statement: Without slicing, the irq6 (EXTI0) entry of z_add_timeout is absent.
    basis: >
      In the EXTI0 ISR, only the slice reset in the give calls
      z_add_timeout (H1). Without slicing there is no slice reset.
    experiment: m4-sweep
    select: {slice: noslice}
    metric: m4.mask.e22[z_add_timeout]
    stat: n
    expect: {range: [0, 0]}
    wrong_if: The give adds a timeout also without slicing.

  - id: H7
    formerly: m4-sweep/2
    type: model
    written: 2026-10-25, before m4-sweep/20261026T000640Z
    statement: Without slicing, the thread entry of z_add_timeout for the slice reset is absent.
    basis: >
      As H6. Reconstruction: with sleepers, k_sleep also calls
      z_add_timeout in thread context (H1). Thus the check uses only the
      points without sleepers.
    experiment: m4-sweep
    select: {slice: noslice, sleepers: s0}
    metric: m4.mask.t[z_add_timeout]
    stat: n
    expect: {range: [0, 0]}
    wrong_if: A switch adds a timeout also without slicing.

  - id: H8
    formerly: m4-sweep/2
    type: model
    written: 2026-10-25, before m4-sweep/20261026T000640Z
    statement: >
      Without slicing, the SysTick entries of z_add_timeout and the max of
      H1 stay: the restart walk does not depend on slicing.
    basis: The timer restarts and the sleeper wakes run in the SysTick ISR, with or without slicing.
    experiment: m4-sweep
    manual: true
    wrong_if: Slicing changes the restart walk.

  - id: H9
    formerly: m4-sweep/3
    type: model
    written: 2026-10-25, before m4-sweep/20261026T000640Z
    statement: >
      With slicing, the irq6 (EXTI0) entry of z_add_timeout has a max of
      about 300 + 25 x (the timeouts that expire in the next 20 ms). At
      256 timers this is about 3000..3800, about half of the max of H5.
    basis: >
      Estimate. The slice reset adds a timeout 20 ms ahead, so the walk
      stops at the timeouts of the next 20 ms. The comment gives no count
      of these timeouts. In the formula, the range is 108..140 timeouts.
    experiment: m4-sweep
    select: {timers: t256, sleepers: s0, slice: slice}
    metric: m4.mask.e22[z_add_timeout]
    stat: max(max_net)
    expect: {range: [3000, 3800]}
    wrong_if: The slice reset walks more or fewer timeouts than the model says.

  - id: H10
    formerly: m4-sweep/4
    type: model
    written: 2026-10-25, before m4-sweep/20261026T000640Z
    statement: At 256 timers, the SysTick ISR body has a max of 33000..42000.
    basis: >
      Estimate. ws-up wake-timers-1m at 256 timers has an IRQ max of
      33005..36140. The comment gives no basis for the limits.
    experiment: m4-sweep
    select: {timers: t256, sleepers: s0}
    metric: m4.isr.e15
    stat: max(max)
    expect: {range: [33000, 42000]}
    wrong_if: The SysTick ISR body is not the source of the IRQ max at the same priority.

  - id: H11
    formerly: m4-sweep/4
    type: model
    written: 2026-10-25, before m4-sweep/20261026T000640Z
    statement: >
      The SysTick ISR body max grows faster than the longest mask section.
      It is the largest blocking time for EXTI0 at the same priority.
    basis: The SysTick ISR body contains the callbacks and the restarts of several expiries in one tick.
    experiment: m4-sweep
    manual: true
    wrong_if: The mask sections, not the SysTick ISR body, set the IRQ tail at the same priority.

  - id: H12
    formerly: m4-sweep/5
    type: model
    written: 2026-10-25, before m4-sweep/20261026T000640Z
    statement: >
      The sites with a fixed cost do not change over the axes (within
      10 %): the middle part of PendSV, the wake window of arch_cpu_idle,
      k_sem_give and k_sem_take.
    basis: >
      Estimate. The comment calls the cost of these sites fixed. It gives
      no basis for 10 % and does not name the statistic. The check uses
      max_net, as the other mask checks.
    experiment: m4-sweep
    metric:
      - m4.mask.e14[z_arm_pendsv]
      - m4.mask[arch_cpu_idle]
      - m4.mask[z_impl_k_sem_give]
      - m4.mask[z_impl_k_sem_take]
    stat: max(max_net)
    expect: {spread_le: 0.10}
    wrong_if: The load changes the cost of code that does not walk a list.

  - id: H13
    formerly: m4-sweep/6
    type: model
    written: 2026-10-25, before m4-sweep/20261026T000640Z
    statement: Without timers and sleepers, the masked share of the window is below 2 %.
    basis: Estimate. The comment gives no basis for 2 %.
    experiment: m4-sweep
    select: {timers: t0, sleepers: s0}
    metric: meta.m4_masked_share
    stat: value
    expect: {range: [0, 0.02]}
    wrong_if: The kernel masks the interrupts for a large part of the time also without load.

  - id: H14
    formerly: m4-sweep/6
    type: model
    written: 2026-10-25, before m4-sweep/20261026T000640Z
    statement: The masked share of the window grows with the load.
    basis: More timeouts make the walks longer (H2).
    experiment: m4-sweep
    manual: true
    wrong_if: The load does not change the masked time.

  - id: H15
    formerly: m4-sweep/7
    type: method
    written: 2026-10-25, before m4-sweep/20261026T000640Z
    statement: >
      m4_unmatched_end and m4_begin_open are 0 in all logs (apart from the
      start-up), and dropped is 0 (fewer than 64 sites).
    basis: >
      Two sections never overlap, and each start has one end (m4.rst).
      m4-design.md §7 counts about 39 call sites that start a section. The
      split by context makes more sites, but the comment expects fewer
      than 64.
    experiment: m4-sweep
    metric: [meta.m4_unmatched_end, meta.m4_begin_open, meta.dropped]
    stat: value
    expect: {range: [0, 0]}
    wrong_if: The site values are not complete or not correct.

  # --------------------------------------------------------------- m4-thread
  - id: H16
    formerly: m4-thread/1
    type: model
    written: 2026-10-25, before m4-thread/20261026T004002Z
    statement: >
      The thread context has more sites than in wake_latency: the wake
      call of the giver, the switch (arch_swap ends the section of the
      lock in the wake call), the slice abort and the slice add.
    basis: The giver is a thread, so its wake call and the switch to the taker run in thread context.
    experiment: m4-thread
    manual: true
    wrong_if: The model of the thread wake path is not correct.

  - id: H17
    formerly: m4-thread/2
    type: model
    written: 2026-10-25, before m4-thread/20261026T004002Z
    statement: With the semaphore and no timers, no thread site has a max above 1000.
    basis: Estimate. The comment gives no basis for 1000 cycles.
    experiment: m4-thread
    select: {primitive: sem, timers: t0}
    metric: m4.mask.t
    stat: max(max)
    expect: {range: [0, 1000]}
    wrong_if: The semaphore wake masks the interrupts longer than expected.

  - id: H18
    formerly: m4-thread/2
    type: model
    written: 2026-10-25, before m4-thread/20261026T004002Z
    statement: >
      With the mutex and no timers, the lock and the unlock sites
      (priority inheritance under the lock) have a max below 1500.
    basis: Estimate. The comment gives no basis for 1500 cycles.
    experiment: m4-thread
    select: {primitive: mutex, timers: t0}
    metric:
      - m4.mask.t[z_impl_k_mutex_lock]
      - m4.mask.t[z_impl_k_mutex_unlock]
    stat: max(max)
    expect: {range: [0, 1499]}
    wrong_if: The priority inheritance masks the interrupts longer than expected.

  - id: H19
    formerly: m4-thread/3
    type: model
    written: 2026-10-25, before m4-thread/20261026T004002Z
    statement: At 64 timers, the longest mask section is 1800..2600, as in m4-sweep t64.
    basis: As H4.
    experiment: m4-thread
    select: {timers: t64}
    metric: m4.mask
    stat: max(max_net)
    expect: {range: [1800, 2600]}
    wrong_if: The app changes the timeout walk.

  - id: H20
    formerly: m4-thread/3
    type: model
    written: 2026-10-25, before m4-thread/20261026T004002Z
    statement: At 64 timers, the longest mask section is in z_add_timeout.
    basis: As H1.
    experiment: m4-thread
    select: {timers: t64}
    metric: m4.mask
    stat: top_place
    expect: {equals: z_add_timeout}
    wrong_if: A site of the thread wake masks longer than the timeout insert.

  - id: H21
    formerly: m4-thread/3
    type: model
    written: 2026-10-25, before m4-thread/20261026T004002Z
    statement: At 64 timers, the SysTick ISR body max is as in m4-validate t64-same.
    basis: Both apps use the same 64 periodic load timers, and the SysTick ISR restarts them.
    experiment: m4-thread
    manual: true
    wrong_if: The app changes the work of the SysTick ISR.
