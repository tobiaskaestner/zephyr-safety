# The files of this study, by convention (no keys):
#   <experiment>.yaml, <experiment>.md   the experiments that it owns
#   hypotheses.yaml                      the hypotheses, written before the runs
#   report.ipynb                         the report template (no outputs)

name: code-placement
question: >
  How much does the address of the code change the latency, and which
  placement gives numbers that a comparison between trees and options
  can use?

experiments:
  - code-layout
  - code-place-q4
  - code-place-q4-up

# The results that answer the question. For now all are characterisation:
# measured values, with a confidence bound where the value is a
# probability. There are no requirement limits yet.
#
# Keys:
#   id         unique in the study
#   statement  the result as a sentence; {name} is a value of the result
#   from       the data: experiment, point, metric, or hypotheses
#   stat       the statistic (study-design.md §14.3)
#   unit       the unit of the values
#
# New statistics:
#   drift_per_wake       LAT META clock_drift_cyc / samples (one wake per sample)
#   spread_abs: [s, ..]  max - min of each statistic s over the points, for each anchor
#   tree_diff: s         s of ws-up (code-place-q4-up) - s of ws-safety (code-place-q4), same point
#   ram_cost: [s, ..]    median of s over the RAM pads - median of s over the flash pads, for each anchor
central_results:
  - id: flash-pad-spread
    statement: >
      In flash, the {metric} p50 changes by {p50} cycles over the pads
      0..28 (anchor {anchor}).
    from: {experiment: code-layout, metric: [irq, isr2thr]}
    stat: {spread_abs: [p50]}
    unit: cycles (max - min over the pads)

  - id: flash-pad-drift
    statement: >
      In flash, the drift changes by {drift_per_wake:.2f} cycles per wake
      over the pads 0..28 (anchor default).
    from: {experiment: code-layout, point: [p0-default, p4-default, p8-default, p12-default,
                                            p16-default, p20-default, p24-default, p28-default]}
    stat: {spread_abs: [drift_per_wake]}
    unit: cycles per wake (max - min over the pads)

  - id: ram-pad-spread
    statement: >
      In RAM, the {metric} p50 changes by {p50} cycles and the drift by
      {drift_per_wake:.2f} cycles per wake over the pads 0..28 (anchor
      {anchor}).
    from:
      experiment: code-place-q4
      point: [r0-default, r4-default, r8-default, r12-default, r16-default, r20-default, r24-default, r28-default,
              r0-noslice, r4-noslice, r8-noslice, r12-noslice, r16-noslice, r20-noslice, r24-noslice, r28-noslice]
      metric: [irq, isr2thr]
    stat: {spread_abs: [p50, drift_per_wake]}
    unit: cycles, cycles per wake (max - min over the pads)

  - id: tree-diff
    statement: >
      At the point {point}, the {metric} p50 of ws-up minus that of
      ws-safety is {tree_diff:+.0f} cycles.
    from: {experiment: [code-place-q4, code-place-q4-up], point: [f0-default, f4-default, r0-default, r4-default,
                                                                   f0-noslice, f4-noslice, r0-noslice, r4-noslice],
           metric: [irq, isr2thr]}
    stat: {tree_diff: p50}
    unit: cycles

  - id: ram-cost
    statement: >
      Hot code in RAM changes the {metric} p50 by {p50:+.0f} cycles and
      the drift by {drift_per_wake:+.2f} cycles per wake, against code in
      flash (anchor {anchor}).
    from: {experiment: code-place-q4, metric: [irq, isr2thr]}
    stat: {ram_cost: [p50, drift_per_wake]}    # criterion C4 of the old file: no limit
    unit: cycles, cycles per wake

  - id: placement-choice
    statement: >
      Comparisons between trees and options use LATBENCH_CODE_RAM.
      Absolute numbers use a range over LATBENCH_CODE_FLASH_PAD.
    from: {hypotheses: [H2a, H2b, H2c, H2d, H2e, H3a, H3b, H3c, H3d, H3e, H4a, H4b, H4c]}
    stat: conclusion               # a person confirms the sentence
