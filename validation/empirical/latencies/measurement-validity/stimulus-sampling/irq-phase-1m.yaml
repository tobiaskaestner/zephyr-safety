# Description: irq-phase-1m.md. Hypotheses: hypotheses.yaml.

name: irq-phase-1m
app: irq_latency
trees: [ws-safety]
repeat: 1
timeout: 900

common:
  kconfig:
    LATBENCH_SAMPLES: 1000000
    LATBENCH_IRQ_PATH_DIRECT: y

axes:
  stimulus:
    random: {kconfig: {LATBENCH_STIM_MIN_US: 100, LATBENCH_STIM_MAX_US: 500}}
    fixed-scan: {kconfig: {LATBENCH_STIM_FIXED: y, LATBENCH_STIM_PERIOD_US: 300, LATBENCH_STIM_PERIOD_ADJ_CYC: 1}}
