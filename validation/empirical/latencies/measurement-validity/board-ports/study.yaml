# The files of this study, by convention (no keys):
#   <experiment>/experiment.yaml   an experiment that it owns
#   <experiment>/experiment.md     its description
#   hypotheses.yaml                the hypotheses, written before the runs
#   report.ipynb                   the report template (no outputs)

name: board-ports
question: >
  Does the port of the benchmark to a board build, flash, read the
  console and give plausible data?

board: null                      # one instance per board; the folder of each instance is board-ports@<port>

experiments:
  - port-smoke-nrf54l15dk
  - port-smoke-nrf52840dk
  - port-smoke-mimxrt1060_evk

# The results that answer the question. For now all are characterisation:
# measured values, with a confidence bound where the value is a
# probability. There are no requirement limits yet.
#
# Keys:
#   id         unique in the study
#   statement  the result as a sentence; {name} is a value of the result
#   from       the data: experiment, point, metric, or hypotheses
#   stat       the statistic (study-design.md §14.3)
#   unit       the unit of the values
#
# An instance reads only the experiment of its board.
central_results:
  - id: port-works
    statement: >
      run.py builds the image, flashes the board and reads the console,
      and the data are plausible.
    from: {experiment: [port-smoke-nrf54l15dk, port-smoke-nrf52840dk, port-smoke-mimxrt1060_evk]}
    stat: conclusion               # a person confirms the sentence

  - id: irq-p50
    statement: >
      On {board}, the IRQ to ISR p50 is {p50} cycles of the CPU clock
      ({tree}).
    from: {experiment: [port-smoke-nrf54l15dk, port-smoke-nrf52840dk, port-smoke-mimxrt1060_evk],
           point: default, metric: irq}
    stat: p50
    unit: cycles of the CPU clock of the board
