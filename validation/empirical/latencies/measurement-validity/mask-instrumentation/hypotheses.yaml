# Hypotheses of the study mask-instrumentation. Each statement and each
# limit was written before the run of its experiment (in the comments of
# the experiment files). m4-image-check has no run: it is a build check.
# The basis texts were written on 2026-10-26, after the runs, from these
# comments and the notes that they name. Where a comment gave no basis
# for a number, the basis text starts with "Reconstruction:" or
# "Estimate.".
#
# Keys:
#   id         unique in the study
#   formerly   the id in the earlier experiment files and notes
#   type       method: a property that the measurement method must have
#              model:  a prediction from the code or from a model of the kernel
#   written    date, and the run that came after it
#   statement  the hypothesis, one or two sentences
#   basis      where each number comes from
#   experiment, select, metric, stat: the data that the check reads
#   expect     the check (the comparison forms: study-design.md §14.4)
#   manual     true: a person gives the verdict
#   wrong_if   what a wrong hypothesis means for the study
#
# Forms that are new in this file:
#   metric m4.<kind>[.<ctx>][<function>]  the M4 sites of a kind (mask, isr), context (t, e14, e15, e22 = EXTI0) and function (the place in the m4.py table)
#   metric meta.<name>                    a value of a LAT META line, or used and dropped of the LAT M4 BEGIN line
#   stat value                            the value of a meta metric (one for each point)
#   stat max_net, min_net                 max or min of a site minus m4_floor_cyc of the same log (m4.py)
#   stat max(x), n over several sites     the largest x of the sites; the sum of the section counts (0 if there is no site)
#   stat top_place                        the function of the mask site with the largest max_net
#   expect {equals: x}                    the stat is x
#   select {point: [ids]}                 several points; each point is checked
#   diff_to {run, tree, point, range}     as diff_to {point}, but against a point of another run
#   diff_to {metric, stat, range}         the value minus the value of another metric and stat of the same point

hypotheses:
  # -------------------------------------------------------- m4-image-check
  - id: H1
    type: method
    written: 2026-10-25 (commit 8a6ba03), build only, no run in the results
    statement: >
      With the hooks off, ws-up and ws-up-irqoff give the same image for
      each point. Only the version strings (BUILD_VERSION) can differ.
    basis: >
      CONFIG_ARM_IRQ_MASK_HOOKS=n removes the hook calls, and
      common/irqmask.cmake then adds no source file (m4.rst). The version
      string is the git describe of each Zephyr tree.
    experiment: m4-image-check
    manual: true
    wrong_if: The hooks change the code also when they are off.

  # ----------------------------------------------------------- m4-validate
  - id: H2
    formerly: m4-validate/cal-t0
    type: method
    written: 2026-10-25, before m4-validate/20261025T235532Z
    statement: The calibration in each run gives m4_floor_cyc (the value of an empty section) 15..30.
    basis: >
      Estimate. The comment gives no basis. m4-design.md §3 gives 15..30
      as an estimate from the disassembly of the hooks.
    experiment: m4-validate
    metric: meta.m4_floor_cyc
    stat: value
    expect: {range: [15, 30]}
    wrong_if: The estimate of the hook cost from the disassembly is not correct.

  - id: H3
    formerly: m4-validate/cal-t0
    type: method
    written: 2026-10-25, before m4-validate/20261025T235532Z
    statement: >
      The calibration in each run gives m4_pair_cost_cyc (the extra CPU
      time of the hooks for each section) 60..150.
    basis: >
      Estimate. The comment gives no basis. m4-design.md §3 gives 60..150
      as an estimate from the disassembly of the hooks.
    experiment: m4-validate
    metric: meta.m4_pair_cost_cyc
    stat: value
    expect: {range: [60, 150]}
    wrong_if: The estimate of the hook cost from the disassembly is not correct.

  - id: H4
    formerly: m4-validate/cal-t0
    type: method
    written: 2026-10-25, before m4-validate/20261025T235532Z
    statement: >
      The IRQ p50 rises from 81 (ws-up, wake-timers-1m t0-default) by
      about one pair cost.
    basis: >
      Reconstruction: the comment says "about one pair cost", and H3 gives
      60..150 for it. The reason: the wake from WFI runs a begin and an
      end hook before "cpsie i", and the ISR enter hook runs before the
      ISR. m4-design.md §3 gives the same +60..150.
    experiment: m4-validate
    select: {point: cal-t0}
    metric: irq
    stat: p50
    expect:
      diff_to: {run: load-scaling/wake-timers-1m/20261024T225125Z, tree: ws-up, point: t0-default, range: [60, 150]}
    wrong_if: The hooks in the wake window cost more or less than the model of the hooks says.

  - id: H5
    formerly: m4-validate/cal-t0
    type: method
    written: 2026-10-25, before m4-validate/20261025T235532Z
    statement: >
      The ISR to thread p50 rises from 1575 (ws-up, wake-timers-1m
      t0-default) by about 2 pair costs plus one ISR exit hook, about
      +200..+400.
    basis: >
      Estimate. The comment gives the parts: two pair costs (H3: 120..300
      together) and one ISR exit hook. It gives no cost for the exit hook.
      m4-design.md §3 gives the same +200..400 as an estimate.
    experiment: m4-validate
    select: {point: cal-t0}
    metric: isr2thr
    stat: p50
    expect:
      diff_to: {run: load-scaling/wake-timers-1m/20261024T225125Z, tree: ws-up, point: t0-default, range: [200, 400]}
    wrong_if: The hooks on the wake path cost more or less than the model of the hooks says.

  - id: H6
    formerly: m4-validate/cal-t0
    type: model
    written: 2026-10-25, before m4-validate/20261025T235532Z
    statement: The site of arch_cpu_idle (the wake window) has max - floor less than 20.
    basis: >
      Estimate. The section starts after the wake-up and ends at "cpsie i"
      (m4.rst). The comment gives no basis for the 20 cycles.
    experiment: m4-validate
    select: {point: cal-t0}
    metric: m4.mask[arch_cpu_idle]
    stat: max(max_net)
    expect: {range: [0, 19]}
    wrong_if: The wake window contains more code than the model of arch_cpu_idle says.

  - id: H7
    formerly: m4-validate/cal-t0
    type: model
    written: 2026-10-25, before m4-validate/20261025T235532Z
    statement: Without load, no site has a max above 2000.
    basis: Estimate. The comment gives no basis for 2000 cycles.
    experiment: m4-validate
    select: {point: cal-t0}
    metric: [m4.mask, m4.isr]
    stat: max(max)
    expect: {range: [0, 2000]}
    wrong_if: A long mask section or ISR body occurs also without load.

  - id: H8
    formerly: m4-validate/cal-t0
    type: method
    written: 2026-10-25, before m4-validate/20261025T235532Z
    statement: m4_unmatched_end and m4_begin_open are 0 after the start.
    basis: >
      Two sections never overlap, and each start has one end (m4.rst). The
      two counters count the errors of this pairing.
    experiment: m4-validate
    select: {point: cal-t0}
    metric: [meta.m4_unmatched_end, meta.m4_begin_open]
    stat: value
    expect: {range: [0, 0]}
    wrong_if: A mask path has a start hook without an end hook, or the reverse. The site values are then not correct.

  - id: H9
    formerly: m4-validate/probe-t0
    type: method
    written: 2026-10-25, before m4-validate/20261025T235532Z
    statement: >
      The probe site (probe_fn) has min and max in 5000 + floor .. 5000 +
      floor + 10.
    basis: >
      Estimate. The probe masks for exactly 5000 DWT cycles, and each
      section value contains the floor (H2). The comment gives no basis
      for the tolerance of 10 cycles.
    experiment: m4-validate
    select: {point: probe-t0}
    metric: m4.mask[probe_fn]
    stat: [min_net, max_net]
    expect: {range: [5000, 5010]}
    wrong_if: The direct method does not measure a known mask length.

  - id: H10
    formerly: m4-validate/probe-t0
    type: method
    written: 2026-10-25, before m4-validate/20261025T235532Z
    statement: >
      About 0.3 % of the edges fall into a probe section, so the IRQ tail
      of the same run reaches 5000..5400 (IRQ max - IRQ floor = the probe
      length + the end hook).
    basis: >
      Estimate. Reconstruction of the 0.3 %: 5000 of each 1700000 cycles
      (10 ms at 170 MHz) are masked. The comment gives no number for the
      end hook and the IRQ floor. m4-design.md §3 estimates the end hook
      tail as 60..100 cycles.
    experiment: m4-validate
    select: {point: probe-t0}
    metric: irq
    stat: max
    expect: {range: [5000, 5400]}
    wrong_if: The indirect method (the IRQ tail) does not show a known mask length.

  - id: H11
    formerly: m4-validate/t64-same
    type: model
    written: 2026-10-25, before m4-validate/20261025T235532Z
    statement: >
      At 64 timers, the SysTick ISR body (m4.isr.e15) has a max of
      7500..9500: the body plus the hooks of its sections.
    basis: >
      Estimate. ws-up systick-prio-1m t64-same has an IRQ max of 7775 and
      an IRQ p99.99 of 5312. The comment gives no basis for the limits.
    experiment: m4-validate
    select: {point: t64-same}
    metric: m4.isr.e15
    stat: max(max)
    expect: {range: [7500, 9500]}
    wrong_if: The SysTick ISR body is not the source of the IRQ max at the same priority.

  - id: H12
    formerly: m4-validate/t64-same, m4-validate/t64-lower
    type: model
    written: 2026-10-25, before m4-validate/20261025T235532Z
    statement: >
      At 64 timers, with SysTick at the same and at the lower priority,
      the longest mask section is 1800..2600 (z_add_timeout, the DLIST
      walk over about 64 timeouts at about 25 cycles each).
    basis: >
      Reconstruction: 64 x 25 cycles give about 1600 cycles for the walk.
      m4-sweep expectation 1 gives 300 + 25 x 64 = 1900. The 25 cycles for
      each timeout come from review-2026-10-25 §4 and §5. The comment
      gives no basis for the width of the range.
    experiment: m4-validate
    select: {point: [t64-same, t64-lower]}
    metric: m4.mask
    stat: max(max_net)
    expect: {range: [1800, 2600]}
    wrong_if: The model of the DLIST insert walk is not correct.

  - id: H13
    formerly: m4-validate/t256-same
    type: model
    written: 2026-10-25, before m4-validate/20261025T235532Z
    statement: At 256 timers, the SysTick ISR body has a max of 33000..42000.
    basis: >
      Estimate. ws-up systick-prio-1m t256-same has an IRQ max of 34762
      and an IRQ p99.99 of 24704. The comment gives no basis for the
      limits.
    experiment: m4-validate
    select: {point: t256-same}
    metric: m4.isr.e15
    stat: max(max)
    expect: {range: [33000, 42000]}
    wrong_if: The SysTick ISR body is not the source of the IRQ max at the same priority.

  - id: H14
    formerly: m4-validate/t256-same, m4-validate/t256-lower
    type: model
    written: 2026-10-25, before m4-validate/20261025T235532Z
    statement: >
      At 256 timers, with SysTick at the same and at the lower priority,
      the longest mask section is 6300..7500, at the site z_add_timeout in
      SysTick context (the restart of a periodic timer).
    basis: >
      Reconstruction: m4-sweep expectation 1 gives 300 + 25 x 256 = 6700.
      review-2026-10-25 §4 finding 8 explains the stop of the IRQ tail at
      about 7000 cycles with this walk. The comment gives no basis for
      the width of the range.
    experiment: m4-validate
    select: {point: [t256-same, t256-lower]}
    metric: m4.mask.e15[z_add_timeout]
    stat: max(max_net)
    expect: {range: [6300, 7500]}
    wrong_if: The model of the DLIST insert walk is not correct.

  - id: H15
    formerly: m4-validate/t64-same, m4-validate/t256-same
    type: model
    written: 2026-10-25, before m4-validate/20261025T235532Z
    statement: At 64 and at 256 timers with the DLIST backend, the longest mask section is in z_add_timeout.
    basis: >
      The restart of a periodic timer walks the DLIST queue in
      z_add_timeout, with the timeout lock held. The walk grows with the
      number of timeouts.
    experiment: m4-validate
    select: {point: [t64-same, t64-lower, t256-same, t256-lower]}
    metric: m4.mask
    stat: top_place
    expect: {equals: z_add_timeout}
    wrong_if: Another site masks longer than the timeout insert.

  - id: H16
    formerly: m4-validate/t64-lower, m4-validate/t256-lower
    type: method
    written: 2026-10-25, before m4-validate/20261025T235532Z
    statement: >
      With SysTick one level lower, the IRQ max of the run is the longest
      mask section + 100..300.
    basis: >
      Estimate. With SysTick lower, the SysTick ISR body does not block
      the EXTI0 ISR, and the longest mask section sets the IRQ max
      (review-2026-10-25 §4 findings 7 and 8). The rest is the IRQ entry
      plus the tail of the end hook (m4-design.md §5.1). No source gives
      a basis for the limits.
    experiment: m4-validate
    select: {point: [t64-lower, t256-lower]}
    metric: irq
    stat: max
    expect:
      diff_to: {metric: m4.mask, stat: max(max_net), range: [100, 300]}
    wrong_if: >
      If the IRQ max is clearly larger than the longest mask section, M4
      does not see a mask path (m4-design.md §2).

  - id: H17
    formerly: m4-validate/t256-wheel
    type: model
    written: 2026-10-25, before m4-validate/20261025T235532Z
    statement: >
      With the WHEEL backend there is no z_add_timeout walk: the longest
      mask section is below 1500.
    basis: >
      Estimate. The WHEEL backend has no insert walk over the queue
      (review-2026-10-25 §4 finding 8). The comment gives no basis for
      1500 cycles.
    experiment: m4-validate
    select: {point: t256-wheel}
    metric: m4.mask
    stat: max(max_net)
    expect: {range: [0, 1499]}
    wrong_if: The WHEEL backend also has a long mask section that grows with the timers.

  - id: H18
    formerly: m4-validate/t256-wheel
    type: model
    written: 2026-10-25, before m4-validate/20261025T235532Z
    statement: With the WHEEL backend, the SysTick ISR body has a max of 6500..9000.
    basis: >
      Estimate. ws-up timeout-backends-1m wheel has an IRQ max of 7160 and
      an IRQ p99.99 of 5056. The comment gives no basis for the limits.
    experiment: m4-validate
    select: {point: t256-wheel}
    metric: m4.isr.e15
    stat: max(max)
    expect: {range: [6500, 9000]}
    wrong_if: The SysTick ISR body is not the source of the IRQ max with the WHEEL backend.
