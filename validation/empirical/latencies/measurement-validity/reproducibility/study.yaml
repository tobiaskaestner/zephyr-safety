# The files of this study, by convention (no keys):
#   <experiment>.yaml, <experiment>.md   the experiments that it owns
#   hypotheses.yaml                      the hypotheses, written before the runs
#   report.ipynb                         the report template (no outputs)
#
# This study has no experiment and no hypotheses of its own.

name: reproducibility
question: >
  Does the same image give the same histograms on another host, and does
  a rebuild from the run snapshot give the same image?

# It runs points of other experiments again (mode rerun: its own runs of
# these experiments, not their data).
imports:
  - {study: kconfig-factors, experiment: wp3-irq-1m, mode: rerun}
  - {study: kconfig-factors, experiment: wp3-wake-1m, mode: rerun}
  - {study: load-scaling, experiment: t2t-load-1m, mode: rerun}

# The results that answer the question. For now all are characterisation:
# measured values, with a confidence bound where the value is a
# probability. There are no requirement limits yet.
#
# Keys:
#   id         unique in the study
#   statement  the result as a sentence; {name} is a value of the result
#   from       the data: experiment, point, metric, or hypotheses
#   stat       the statistic (study-design.md §14.3)
#   unit       the unit of the values
#
# New statistic:
#   hist_identical_count  the number of re-run points whose histograms are the
#                         same bin for bin as the same point in the run of the owner study
central_results:
  - id: same-image-same-data
    statement: >
      On another host, {hist_identical_count} of {n} re-run points give
      the same histograms bin for bin as the run of the owner study.
    from: {experiment: [wp3-irq-1m, wp3-wake-1m, t2t-load-1m]}
    stat: hist_identical_count
    unit: points

  - id: rebuild-same-image
    statement: >
      A rebuild from the run snapshot gives the same image on two hosts.
    from: {experiment: [wp3-irq-1m, wp3-wake-1m, t2t-load-1m]}
    stat: conclusion               # a person confirms the sentence; run.py --rebuild writes no record yet
