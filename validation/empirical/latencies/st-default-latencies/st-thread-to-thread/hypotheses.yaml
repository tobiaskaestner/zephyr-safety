# Hypotheses of the study thread-to-thread. A hypothesis is one claim
# about a mechanism. Its checks test the claim on points, metrics and
# statistics. The hypothesis is wrong if one check is wrong.
#
# Each statement and each limit was written before the run of its
# experiment (in the comments of the experiment files). The basis texts
# were written on 2026-10-26, after the runs, from these comments. Where
# a comment gave no basis for a number, the basis text of the check
# starts with "Reconstruction:" or "Estimate.".
#
# The comments have no "Wrong if" text. Each wrong_if says which part of
# the basis is then wrong. thread-baseline-1m stated no prediction before
# its run.
#
# Keys of a hypothesis:
#   id         unique in the study
#   type       method: a property that the measurement method must have
#              model:  a prediction from the code or from a model of the kernel
#   statement  the claim, one or two sentences
#   basis      the mechanism and its sources
#   wrong_if   what a wrong hypothesis means for the study
#   checks     the tests of the claim
# Keys of a check:
#   id         unique in the hypothesis (a, b, ...)
#   formerly   the label in the old experiment comments, if it had one
#   written    date, and the run that came after it
#   experiment, select, metric, stat: the data that the check reads
#   expect     the comparison (forms: doc/benchmark-guide/reference/check-forms.rst)
#   manual     true: a person gives the verdict
#   basis      where the number of the check comes from

hypotheses:
  - id: H1
    type: model
    statement: >
      With USE_SWITCH=y the wake has the same two modes as with PendSV:
      about 20 % of the samples without a SysTick reprogram, about 80 %
      with two.
    basis: >
      The slice reset is in update_cache() and does not depend on the
      arch interface.
    wrong_if: The slice reset is not the only cause of the two modes, or it depends on the arch interface.
    checks:
      - id: a
        written: 2026-10-25, before thread2thread-switch/20261025T100427Z
        experiment: thread-switch
        select: {point: [sem-switch, mutex-switch]}
        metric: t2t
        manual: true
        statement: >
          sem-switch and mutex-switch have two modes: about 20 % of the
          samples without a SysTick reprogram, about 80 % with two.
        basis: >
          The 20 % and 80 % are the shares with PendSV in the earlier runs.
          The comment gives no tolerance for "about".

  - id: H2
    type: model
    statement: >
      The thread switch costs more with USE_SWITCH=y than with PendSV:
      the mean t2t with USE_SWITCH=y is larger, for the semaphore and for
      the mutex.
    basis: >
      wake-anchors-1m: USE_SWITCH=y adds about 280 cycles per ISR wake.
    wrong_if: The cost of USE_SWITCH=y in wake-anchors-1m is not in the switch itself.
    checks:
      - id: a
        written: 2026-10-25, before thread2thread-switch/20261025T100427Z
        experiment: thread-switch
        metric: t2t
        stat: mean
        expect: {order: [sem-legacy, sem-switch]}
        basis: The comment gives no value for the thread to thread wake.
      - id: b
        written: 2026-10-25, before thread2thread-switch/20261025T100427Z
        experiment: thread-switch
        metric: t2t
        stat: mean
        expect: {order: [mutex-legacy, mutex-switch]}
        basis: As a.
