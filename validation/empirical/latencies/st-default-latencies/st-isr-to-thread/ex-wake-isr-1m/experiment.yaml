# Description: experiment.md. Hypotheses: none.

name: wake-isr-1m
app: wake_latency
trees: [ws-up]
repeat: 1
timeout: 900

common:
  kconfig:
    LATBENCH_SAMPLES: 1000000

# No cube: the sem points come first (both ISR kinds), then the other primitives.
extra_axes: {isr: wrapped, primitive: sem}

points:
  - id: wrapped-sem
    axes: {isr: wrapped, primitive: sem}
    kconfig: {LATBENCH_WAKE_SEM: y}
  - id: direct-sem
    axes: {isr: direct, primitive: sem}
    kconfig: {LATBENCH_WAKE_SEM: y, LATBENCH_WAKE_ISR_DIRECT: y}
  - id: wrapped-event
    axes: {isr: wrapped, primitive: event}
    kconfig: {LATBENCH_WAKE_EVENT: y}
  - id: wrapped-msgq
    axes: {isr: wrapped, primitive: msgq}
    kconfig: {LATBENCH_WAKE_MSGQ: y}
  - id: wrapped-fifo
    axes: {isr: wrapped, primitive: fifo}
    kconfig: {LATBENCH_WAKE_FIFO: y}
  - id: wrapped-poll
    axes: {isr: wrapped, primitive: poll}
    kconfig: {LATBENCH_WAKE_POLL: y}
