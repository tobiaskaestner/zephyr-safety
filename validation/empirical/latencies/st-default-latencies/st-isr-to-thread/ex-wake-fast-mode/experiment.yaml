# Description: experiment.md. Hypotheses: none.

name: wake-fast-mode
app: wake_latency
trees: [ws-up]
repeat: 1
timeout: 600

common:
  kconfig:
    LATBENCH_SAMPLES: 200000
    LATBENCH_WAKE_SEM: y

# No cube: each point changes one factor against r100-500 (the app defaults).
extra_axes: {stimulus: r100-500, poll: 100ms}

points:
  - id: r100-500
    axes: {stimulus: r100-500, poll: 100ms}
  - id: r100-200
    axes: {stimulus: r100-200, poll: 100ms}
    kconfig: {LATBENCH_STIM_MIN_US: 100, LATBENCH_STIM_MAX_US: 200}
  - id: r400-500
    axes: {stimulus: r400-500, poll: 100ms}
    kconfig: {LATBENCH_STIM_MIN_US: 400, LATBENCH_STIM_MAX_US: 500}
  - id: fixed300
    axes: {stimulus: fixed300, poll: 100ms}
    kconfig: {LATBENCH_STIM_FIXED: y, LATBENCH_STIM_PERIOD_US: 300}   # plus 1 cycle per edge (default)
  - id: poll1000
    axes: {stimulus: r100-500, poll: 1000ms}
    kconfig: {LATBENCH_POLL_MS: 1000}
