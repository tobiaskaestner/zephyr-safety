name: default-latencies
question: >
  What are the three latencies with the board and kernel defaults and
  an idle CPU: IRQ entry (M1), ISR to thread (M2), thread to thread (M3)?

substudies:
  - use: irq-entry
  - use: isr-to-thread
  - use: thread-to-thread
  - use: irq-scenarios

# The answer of this study: the central results of its sub-studies.
central_results:
  - {id: irq-entry-p99-direct, from: {substudy: irq-entry}}
  - {id: isr2thr-p99-sem, from: {substudy: isr-to-thread}}
  - {id: t2t-p99-sem, from: {substudy: thread-to-thread}}
